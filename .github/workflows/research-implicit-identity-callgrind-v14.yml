name: Research implicit identity Callgrind v14

on:
  push:
    branches: ["research/implicit-identity-callgrind-v14-20260913"]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"
  BASE_SHA: 93278bf9b540f93521c7bd4c02f68db458e5db7a
  CANDIDATE_SHA: 0b01ae2b34db2b78c11acf9c4242e73538717c95
  BASE_ENTRY_SHA256: 8f3ef89364b35b9fb8fb4277e99709a26cefa827f88611587265d3fb40465ff7
  CANDIDATE_ENTRY_SHA256: 4f58d7f47bc7767d336b2771990f64fa52e4dd1df0f550fff30bdfc7ff1035be

jobs:
  taken-path-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout research carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "11.11.0"

      - name: Install Callgrind
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          command -v valgrind
          command -v callgrind_control
          valgrind --version | tee callgrind-environment.txt
          callgrind_control --version | tee -a callgrind-environment.txt

      - name: Reconstruct exact product artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/380/head
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          base="$RUNNER_TEMP/lm-base"
          candidate="$RUNNER_TEMP/lm-candidate"
          git worktree add --detach "$base" "$BASE_SHA"
          git worktree add --detach "$candidate" "$CANDIDATE_SHA"
          for dir in "$base" "$candidate"; do
            pnpm --dir "$dir" install --frozen-lockfile --prefer-offline
            pnpm --dir "$dir" build
          done
          printf '%s  %s\n' "$BASE_ENTRY_SHA256" "$base/dist/keyframes/index.js" | sha256sum --check --status -
          printf '%s  %s\n' "$CANDIDATE_ENTRY_SHA256" "$candidate/dist/keyframes/index.js" | sha256sum --check --status -
          printf 'base=%s\ncandidate=%s\n' "$base/dist/keyframes/index.js" "$candidate/dist/keyframes/index.js" >> "$GITHUB_ENV"
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "kernel=$(uname -srvm)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "arch=$(uname -m)"
            echo "base=$BASE_SHA"
            echo "candidate=$CANDIDATE_SHA"
            echo "carrier=$GITHUB_SHA"
            sha256sum "$base/dist/keyframes/index.js" "$candidate/dist/keyframes/index.js"
          } >> callgrind-environment.txt

      - name: Calibrate software dynamic-instruction plane and conditionally compare
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/scripts/research-implicit-identity-callgrind-v14.mjs"
          raw="$GITHUB_WORKSPACE/callgrind-raw.jsonl"
          controls="$GITHUB_WORKSPACE/callgrind-controls.json"
          result="$GITHUB_WORKSPACE/callgrind-result.json"
          profiles_dir="$GITHUB_WORKSPACE/callgrind-profiles"
          failure="$GITHUB_WORKSPACE/callgrind-transport-failure.json"
          mkdir -p "$profiles_dir"
          : > "$raw"

          allowed="$(awk '/Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          first="${allowed%%,*}"
          first="${first%%-*}"
          if ! [[ "$first" =~ ^[0-9]+$ ]]; then
            printf '{"schema":1,"verdict":"BLOCKED-CALLGRIND","reason":"cannot-resolve-allowed-cpu","allowed":"%s"}\n' "$allowed" > "$result"
            exit 0
          fi
          cpu="$first"
          echo "cpu_allowed=$allowed" >> callgrind-environment.txt
          echo "cpu_pinned=$cpu" >> callgrind-environment.txt

          block_result() {
            local reason="$1" rc="${2:-0}"
            printf '{"schema":1,"verdict":"BLOCKED-CALLGRIND","reason":"%s","rc":%s}\n' "$reason" "$rc" > "$result"
          }
          transport_fail() {
            local rc="$1" stage="$2" profile="$3" phase="$4" run="$5" side="$6" out="$7" log="$8"
            python3 - "$rc" "$stage" "$profile" "$phase" "$run" "$side" "$out" "$log" > "$failure" <<'PY'
          import hashlib, json, pathlib, sys
          rc, stage, profile, phase, run, side, out, log = sys.argv[1:]
          def info(path):
              p = pathlib.Path(path)
              return None if not p.exists() else {"path": p.name, "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
          print(json.dumps({"schema":1,"rc":int(rc),"stage":stage,"profile":profile,"phase":phase,"run":int(run),"side":side,"out":info(out),"log":info(log)}, separators=(',', ':')))
          PY
            return "$rc"
          }

          run_one() {
            local profile="$1" phase="$2" run="$3" side="$4" impl="$5" factor="$6" nominal="$7"
            local entry="$base"
            if [[ "$impl" == candidate ]]; then entry="$candidate"; fi
            local dir="$RUNNER_TEMP/cg-${profile}-${phase}-${run}-${side}"
            mkdir -p "$dir"
            local ready="$dir/ready.json" start="$dir/start" done="$dir/done" stop="$dir/stop"
            local out="$profiles_dir/${profile}-${phase}-${run}-${side}.callgrind"
            local log="$profiles_dir/${profile}-${phase}-${run}-${side}.valgrind.log"
            mkfifo "$start" "$done" "$stop"

            taskset -c "$cpu" valgrind \
              --tool=callgrind \
              --instr-atstart=no \
              --cache-sim=no \
              --branch-sim=no \
              --callgrind-out-file="$out" \
              --log-file="$log" \
              node "$harness" workload "$entry" "$profile" "$nominal" "$factor" \
                "$ready" "$start" "$done" "$stop" &
            local pid=$!

            local waited=0
            while [[ ! -s "$ready" ]] && kill -0 "$pid" 2>/dev/null; do
              sleep 0.02
              waited=$((waited + 1))
              if (( waited > 9000 )); then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                transport_fail 71 ready-timeout "$profile" "$phase" "$run" "$side" "$out" "$log"
                return 71
              fi
            done
            if [[ ! -s "$ready" ]]; then
              wait "$pid" || true
              transport_fail 72 ready-missing "$profile" "$phase" "$run" "$side" "$out" "$log"
              return 72
            fi

            if ! callgrind_control -i on "$pid" >/dev/null; then transport_fail 73 instrumentation-on "$profile" "$phase" "$run" "$side" "$out" "$log"; return 73; fi
            if ! callgrind_control -z "$pid" >/dev/null; then transport_fail 74 zero "$profile" "$phase" "$run" "$side" "$out" "$log"; return 74; fi
            printf 'go\n' > "$start"
            local receipt
            IFS= read -r receipt < "$done"
            if ! callgrind_control -i off "$pid" >/dev/null; then transport_fail 75 instrumentation-off "$profile" "$phase" "$run" "$side" "$out" "$log"; return 75; fi
            printf 'stop\n' > "$stop"
            if ! wait "$pid"; then transport_fail 76 child-exit "$profile" "$phase" "$run" "$side" "$out" "$log"; return 76; fi

            local events ir collected
            events="$(awk '$1 == "events:" { if (NF != 2 || seen++) exit 2; print $2 } END { if (!seen) exit 3 }' "$out")" || { transport_fail 77 events-shape "$profile" "$phase" "$run" "$side" "$out" "$log"; return 77; }
            [[ "$events" == Ir ]] || { transport_fail 78 events-value "$profile" "$phase" "$run" "$side" "$out" "$log"; return 78; }
            ir="$(awk '$1 == "totals:" { if (NF != 2 || seen++) exit 2; print $2 } END { if (!seen) exit 3 }' "$out")" || { transport_fail 79 totals-shape "$profile" "$phase" "$run" "$side" "$out" "$log"; return 79; }
            [[ "$ir" =~ ^[0-9]+$ ]] && (( ir > 0 )) || { transport_fail 80 totals-value "$profile" "$phase" "$run" "$side" "$out" "$log"; return 80; }
            collected="$(awk '/^==[0-9]+== Collected : / { if (NF != 4 || seen++) exit 2; print $4 } END { if (!seen) exit 3 }' "$log")" || { transport_fail 81 collected-shape "$profile" "$phase" "$run" "$side" "$out" "$log"; return 81; }
            [[ "$collected" =~ ^[0-9]+$ ]] && [[ "$collected" == "$ir" ]] || { transport_fail 82 totals-collected-mismatch "$profile" "$phase" "$run" "$side" "$out" "$log"; return 82; }

            if ! python3 - "$receipt" "$profile" "$phase" "$run" "$side" "$impl" "$factor" "$nominal" "$ir" "$out" >> "$raw" <<'PY'
          import hashlib, json, math, pathlib, sys
          receipt_s, profile, phase, run, side, impl, factor, nominal, ir, out = sys.argv[1:]
          receipt = json.loads(receipt_s)
          factor_i = int(factor); nominal_i = int(nominal); ir_i = int(ir)
          if receipt.get('profile') != profile:
              raise SystemExit('receipt profile mismatch')
          if receipt.get('factor') != factor_i or receipt.get('nominal') != nominal_i:
              raise SystemExit('receipt workload mismatch')
          if receipt.get('actual') != factor_i * nominal_i:
              raise SystemExit('receipt actual mismatch')
          if not math.isfinite(receipt.get('sink', float('nan'))) or receipt.get('callbacks', 0) <= 0:
              raise SystemExit('semantic receipt invalid')
          p = pathlib.Path(out)
          print(json.dumps({
              'profile': profile, 'phase': phase, 'run': int(run), 'side': side,
              'impl': impl, 'factor': factor_i, 'nominal': nominal_i, 'ir': ir_i,
              'actual': receipt['actual'], 'callbacks': receipt['callbacks'], 'sink': receipt['sink'],
              'profileSha256': hashlib.sha256(p.read_bytes()).hexdigest(),
          }, separators=(',', ':')))
          PY
            then transport_fail 83 receipt-validate "$profile" "$phase" "$run" "$side" "$out" "$log"; return 83; fi
          }

          pair() {
            local profile="$1" phase="$2" run="$3" impl_a="$4" factor_a="$5" impl_b="$6" factor_b="$7" nominal="$8"
            if (( run % 2 == 0 )); then
              run_one "$profile" "$phase" "$run" a "$impl_a" "$factor_a" "$nominal" || return $?
              run_one "$profile" "$phase" "$run" b "$impl_b" "$factor_b" "$nominal" || return $?
            else
              run_one "$profile" "$phase" "$run" b "$impl_b" "$factor_b" "$nominal" || return $?
              run_one "$profile" "$phase" "$run" a "$impl_a" "$factor_a" "$nominal" || return $?
            fi
          }

          collect_controls() {
            local profile="$1" nominal="$2" run
            for run in $(seq 0 5); do pair "$profile" null-base "$run" base 1 base 1 "$nominal" || return $?; done
            for run in $(seq 0 5); do pair "$profile" null-candidate "$run" candidate 1 candidate 1 "$nominal" || return $?; done
            for run in $(seq 0 5); do pair "$profile" positive "$run" base 1 base 2 "$nominal" || return $?; done
          }

          if collect_controls setup3-default 10000; then :; else rc=$?; block_result "callgrind-control-or-workload-execution-failed" "$rc"; exit 0; fi
          if collect_controls seek3-default 500000; then :; else rc=$?; block_result "callgrind-control-or-workload-execution-failed" "$rc"; exit 0; fi

          node "$harness" controls "$raw" "$controls"
          cat "$controls"

          admitted() {
            node -e 'const x=require(process.argv[1]); process.exit(x.profiles[process.argv[2]].admitted ? 0 : 1)' "$controls" "$1"
          }
          collect_ab() {
            local profile="$1" nominal="$2" run
            for run in $(seq 0 7); do pair "$profile" ab "$run" base 1 candidate 1 "$nominal" || return $?; done
          }

          if admitted setup3-default; then
            if collect_ab setup3-default 10000; then :; else rc=$?; block_result "callgrind-ab-execution-failed" "$rc"; exit 0; fi
          fi
          if admitted seek3-default; then
            if collect_ab seek3-default 500000; then :; else rc=$?; block_result "callgrind-ab-execution-failed" "$rc"; exit 0; fi
          fi

          node "$harness" final "$raw" "$result"
          cat "$result"
          sha256sum "$raw" "$controls" "$result" callgrind-environment.txt > callgrind-SHA256SUMS
          find "$profiles_dir" -type f -print0 | sort -z | xargs -0 sha256sum > callgrind-profile-SHA256SUMS
          tar -C "$GITHUB_WORKSPACE" -c callgrind-profiles | zstd -19 -T0 -o callgrind-profiles.tar.zst
          sha256sum callgrind-profiles.tar.zst >> callgrind-SHA256SUMS

      - name: Verify research receipt exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s callgrind-result.json
          node -e 'const r=require("./callgrind-result.json"); if (!r.verdict) process.exit(1); console.log(`scientific verdict=${r.verdict}`)'

      - name: Upload sealed v14 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implicit-identity-callgrind-v14
          path: |
            callgrind-result.json
            callgrind-controls.json
            callgrind-raw.jsonl
            callgrind-environment.txt
            callgrind-transport-failure.json
            callgrind-SHA256SUMS
            callgrind-profile-SHA256SUMS
            callgrind-profiles.tar.zst
            callgrind-profiles/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
