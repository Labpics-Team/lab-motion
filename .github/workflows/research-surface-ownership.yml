name: Research surface ownership proof
on:
  push:
    branches: [research/surface-ownership-proof-20260911]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: motion-macro-base
          ref: 5f375cff2e978914cfb6ffed4c0ae2d573d1415f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: motion-pass
          ref: 45418c4ba9826a7701cd86b17a29061a62daeaf7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Prepare fixed evidence plane
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          mkdir motion-macro-evidence
          cp carrier/research/surface-proof/*.mjs motion-macro-evidence/
          for side in motion-macro-base motion-pass; do
            git -C "$side" rev-parse HEAD >> motion-macro-evidence/heads.txt
            git -C "$side" status --porcelain >> motion-macro-evidence/status-before.txt
            (cd "$side" && pnpm install --frozen-lockfile) > "motion-macro-evidence/$side-install.log" 2>&1
          done

          (cd motion-pass && pnpm exec vitest run test/surface-knot-ownership.test.ts) > motion-macro-evidence/cap-oracle.log 2>&1

          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'motion-pass/src/future-layout/artifact.ts';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '    remainingStops--;\n    const stack:';
          if (!source.includes(marker)) throw new Error('segment-start cap marker missing');
          fs.writeFileSync(path, source.replace(marker, '    const stack:'));
          NODE
          if (cd motion-pass && pnpm exec vitest run test/surface-knot-ownership.test.ts) > motion-macro-evidence/cap-mutant-segment.log 2>&1; then
            echo 'segment-start cap mutant escaped oracle' >&2
            exit 1
          fi
          git -C motion-pass checkout -- src/future-layout/artifact.ts

          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'motion-pass/src/future-layout/artifact.ts';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '      out.push(b, qAt(wB));\n      remainingStops--;\n      a = b;';
          if (!source.includes(marker)) throw new Error('accepted-endpoint cap marker missing');
          fs.writeFileSync(path, source.replace(marker, '      out.push(b, qAt(wB));\n      a = b;'));
          NODE
          if (cd motion-pass && pnpm exec vitest run test/surface-knot-ownership.test.ts) > motion-macro-evidence/cap-mutant-endpoint.log 2>&1; then
            echo 'accepted-endpoint cap mutant escaped oracle' >&2
            exit 1
          fi
          git -C motion-pass checkout -- src/future-layout/artifact.ts
          git -C motion-pass diff --exit-code

          for side in motion-macro-base motion-pass; do
            (cd "$side" && pnpm build && pnpm size) > "motion-macro-evidence/$side-build-size.log" 2>&1
          done
          node motion-macro-evidence/prepare.mjs > motion-macro-evidence/prepare.log
      - name: Separate ownership of GC debt
        shell: bash
        run: node motion-macro-evidence/owned-timing.mjs > motion-macro-evidence/owned-timing.log 2>&1
      - name: Read back immutable inputs
        if: always()
        shell: bash
        run: |
          for side in motion-macro-base motion-pass; do
            git -C "$side" diff --exit-code
            git -C "$side" status --porcelain >> motion-macro-evidence/status-after.txt
          done
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface-ownership-proof-${{ github.sha }}
          path: motion-macro-evidence/
          if-no-files-found: error
          retention-days: 7
