name: CI

# Единственный required check орги Labpics-Team. Имя джоба "CI" не менять.
# Ждёт другие Actions runs на этом SHA: pull_request, pull_request_target,
# merge_group. Новый тест стопорит merge тогда и только тогда, когда его
# workflow запущен этими событиями. schedule / workflow_dispatch — нет.

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  gate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Reject accidental PR-blocking of class-B workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          head = os.environ["HEAD_SHA"]
          base = os.environ.get("BASE_SHA") or ""
          api = "https://api.github.com"
          CLASS_B = re.compile(
              r"(nightly|probe|diagnostic|throwaway|billing|snapshot|agent-|fuzz|mutation|canary|zombie)",
              re.I,
          )

          def req(url, accept="application/vnd.github+json"):
              r = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "labpics-ci-gate",
              })
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def workflows(sha):
              if not sha:
                  return {}
              st, raw = req(f"{api}/repos/{repo}/contents/.github/workflows?ref={sha}")
              if st != 200:
                  return {}
              out = {}
              for item in json.loads(raw.decode()):
                  path = item.get("path") or ""
                  if not path.endswith((".yml", ".yaml")):
                      continue
                  st2, body = req(
                      f"{api}/repos/{repo}/contents/{path}?ref={sha}",
                      "application/vnd.github.raw",
                  )
                  if st2 == 200:
                      out[path] = body.decode("utf-8", "replace")
              return out

          def on_section(text):
              parts = re.split(r"(?m)^jobs:\s*$", text, maxsplit=1)
              return parts[0] if parts else text

          def has_pr(text):
              on = on_section(text)
              return bool(re.search(r"(?m)^\s+(pull_request|pull_request_target)\s*:", on)) or bool(
                  re.search(r"(?m)^on:\s*\[([^\]]*(pull_request|pull_request_target)[^\]]*)\]", on)
              )

          head_wf = workflows(head)
          base_wf = workflows(base)
          violations = []
          for path, text in head_wf.items():
              name = path.rsplit("/", 1)[-1]
              if name == "ci-gate.yml" or not CLASS_B.search(name):
                  continue
              if not has_pr(text):
                  continue
              prev = base_wf.get(path)
              if prev is not None and has_pr(prev):
                  continue
              violations.append(path)
          if violations:
              print("These workflows look like class-B (nightly/fuzz/probe/...)")
              print("but newly gained pull_request / pull_request_target.")
              print("That makes them merge-blocking. Use schedule or workflow_dispatch.")
              for v in violations:
                  print(" -", v)
              sys.exit(1)
          print("workflow policy: no new class-B PR triggers")
          PY

      - name: Await other workflow runs on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          api = "https://api.github.com"
          events = ("pull_request", "pull_request_target", "merge_group")

          def req(url):
              r = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "labpics-ci-gate",
              })
              with urllib.request.urlopen(r) as resp:
                  return json.load(resp)

          def workflow_runs():
              runs = []
              for event in events:
                  url = (
                      f"{api}/repos/{repo}/actions/runs"
                      f"?head_sha={sha}&event={event}&per_page=100"
                  )
                  for run in req(url).get("workflow_runs") or []:
                      path = run.get("path") or ""
                      if path.endswith("ci-gate.yml"):
                          continue
                      runs.append(run)
              return runs

          ok = {"success", "skipped", "neutral"}
          pending = {"queued", "in_progress", "waiting", "requested", "pending"}
          started = time.time()
          empty_polls = 0
          timeout = 85 * 60

          while True:
              elapsed = int(time.time() - started)
              runs = workflow_runs()
              incomplete = [r for r in runs if (r.get("status") or "") in pending]
              failed = [
                  r for r in runs
                  if r.get("status") == "completed"
                  and (r.get("conclusion") or "") not in ok
              ]
              print(
                  f"elapsed={elapsed}s peers={len(runs)} "
                  f"pending={len(incomplete)} failed={len(failed)}",
                  flush=True,
              )
              for r in failed:
                  print(
                      f"FAIL {r.get('name')} conclusion={r.get('conclusion')} "
                      f"event={r.get('event')} path={r.get('path')}",
                      flush=True,
                  )
              if failed:
                  sys.exit(1)
              if runs and not incomplete:
                  print("all peer workflow runs completed green", flush=True)
                  sys.exit(0)
              if not runs:
                  empty_polls += 1
              else:
                  empty_polls = 0
              if empty_polls >= 8 and elapsed >= 120:
                  print("no peer workflows registered; gate green", flush=True)
                  sys.exit(0)
              if elapsed >= timeout:
                  print("timeout waiting for peer workflows", flush=True)
                  for r in incomplete:
                      print(
                          f"PENDING {r.get('name')} status={r.get('status')} "
                          f"path={r.get('path')}",
                          flush=True,
                      )
                  sys.exit(1)
              time.sleep(15)
          PY
