name: CI

# Org-wide merge gate. The job display name "CI" is the only required check.
# It waits for other pull_request workflow runs on this SHA, including jobs
# that are still queued. New test workflows are included automatically if
# they run on pull_request. Scheduled-only jobs are not part of the PR gate.

on:
  pull_request:

concurrency:
  group: ci-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  gate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Await other pull_request workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          api = "https://api.github.com"

          def req(url):
              r = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "labpics-ci-gate",
              })
              with urllib.request.urlopen(r) as resp:
                  return json.load(resp)

          def workflow_runs():
              url = (
                  f"{api}/repos/{repo}/actions/runs"
                  f"?head_sha={sha}&event=pull_request&per_page=100"
              )
              data = req(url)
              runs = []
              for run in data.get("workflow_runs") or []:
                  path = run.get("path") or ""
                  if path.endswith("ci-gate.yml"):
                      continue
                  runs.append(run)
              return runs

          ok = {"success", "skipped", "neutral"}
          pending = {"queued", "in_progress", "waiting", "requested", "pending"}
          started = time.time()
          empty_polls = 0
          timeout = 85 * 60

          while True:
              elapsed = int(time.time() - started)
              runs = workflow_runs()
              incomplete = [r for r in runs if (r.get("status") or "") in pending]
              failed = [
                  r for r in runs
                  if r.get("status") == "completed"
                  and (r.get("conclusion") or "") not in ok
              ]
              print(
                  f"elapsed={elapsed}s peers={len(runs)} "
                  f"pending={len(incomplete)} failed={len(failed)}",
                  flush=True,
              )
              for r in failed:
                  print(
                      f"FAIL {r.get('name')} conclusion={r.get('conclusion')} "
                      f"path={r.get('path')}",
                      flush=True,
                  )
              if failed:
                  sys.exit(1)
              if runs and not incomplete:
                  print("all other pull_request workflows completed green", flush=True)
                  sys.exit(0)
              if not runs:
                  empty_polls += 1
              else:
                  empty_polls = 0
              if empty_polls >= 8 and elapsed >= 120:
                  print("no other pull_request workflows registered; gate green", flush=True)
                  sys.exit(0)
              if elapsed >= timeout:
                  print("timeout waiting for other workflows", flush=True)
                  for r in incomplete:
                      print(
                          f"PENDING {r.get('name')} status={r.get('status')} "
                          f"path={r.get('path')}",
                          flush=True,
                      )
                  sys.exit(1)
              time.sleep(15)
          PY
