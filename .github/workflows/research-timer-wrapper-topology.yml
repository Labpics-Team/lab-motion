name: Research · timer wrapper topology

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: research-timer-wrapper-topology-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"
  BASE_SHA: fe11daa407de396fad952be7679650f63dabd4dd

jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect whether research is already materialized
        id: state
        shell: bash
        run: |
          set -euo pipefail
          old='setTimeout(() => cb(undefined), 0)'
          count=0
          for f in src/behaviors/index.ts src/flip/index.ts src/gestures/index.ts; do
            n=$(grep -F -c "$old" "$f" || true)
            count=$((count + n))
          done
          if [[ "$count" -eq 3 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$count" -eq 0 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected direct-site wrapper count: $count"
            exit 1
          fi

      - name: Setup Node
        if: steps.state.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        if: steps.state.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify exact baseline source and timer characterization
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          git diff --quiet "$BASE_SHA" -- src package.json pnpm-lock.yaml scripts
          test "$(grep -F -c 'setTimeout(() => cb(undefined), 0)' src/projection/driver.ts)" -eq 1
          node --input-type=module <<'NODE'
          const directArgs = await new Promise((resolve) => {
            setTimeout((...args) => resolve(args.length), 0);
          });
          if (directArgs !== 0) throw new Error(`direct setTimeout callback received ${directArgs} positional args`);
          const mutatedArgs = await new Promise((resolve) => {
            setTimeout(() => resolve(((...args) => args.length)(1)), 0);
          });
          if (mutatedArgs !== 1) throw new Error('positive control failed');
          console.log(JSON.stringify({ node: process.version, directArgs, deliberateMutationArgs: mutatedArgs }));
          NODE

      - name: Build exact baseline and capture all protected representations
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          pnpm build
          cp -a dist "$RUNNER_TEMP/base-dist"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/base-consumers.json"
          import { resolve } from 'node:path';
          import { IMPORT_COST_SCENARIOS, measureScenario } from './scripts/size-gate.mjs';
          const distIndex = resolve('dist/index.js');
          const out = {};
          for (const scenario of IMPORT_COST_SCENARIOS) {
            const row = await measureScenario(scenario, distIndex);
            if (row?.error) throw new Error(`${scenario.name}: ${row.error}`);
            out[scenario.name] = row;
          }
          process.stdout.write(JSON.stringify(out));
          NODE

      - name: Materialize candidate in workspace and prove topology
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = 'setTimeout(() => cb(undefined), 0)'
          new = 'setTimeout(cb, 0)'
          paths = [Path('src/behaviors/index.ts'), Path('src/flip/index.ts'), Path('src/gestures/index.ts')]
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one wrapper, got {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(grep -F -c 'setTimeout(cb, 0)' src/behaviors/index.ts)" -eq 1
          test "$(grep -F -c 'setTimeout(cb, 0)' src/flip/index.ts)" -eq 1
          test "$(grep -F -c 'setTimeout(cb, 0)' src/gestures/index.ts)" -eq 1
          test "$(grep -F -c 'setTimeout(() => cb(undefined), 0)' src/projection/driver.ts)" -eq 1
          total_old=$(grep -R -F 'setTimeout(() => cb(undefined), 0)' src --include='*.ts' | wc -l)
          test "$total_old" -eq 1

      - name: Build candidate and compare every dist artifact plus consumer scenario
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          pnpm build
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/candidate-consumers.json"
          import { resolve } from 'node:path';
          import { IMPORT_COST_SCENARIOS, measureScenario } from './scripts/size-gate.mjs';
          const distIndex = resolve('dist/index.js');
          const out = {};
          for (const scenario of IMPORT_COST_SCENARIOS) {
            const row = await measureScenario(scenario, distIndex);
            if (row?.error) throw new Error(`${scenario.name}: ${row.error}`);
            out[scenario.name] = row;
          }
          process.stdout.write(JSON.stringify(out));
          NODE
          BASE_DIST="$RUNNER_TEMP/base-dist" BASE_CONSUMERS="$RUNNER_TEMP/base-consumers.json" CANDIDATE_CONSUMERS="$RUNNER_TEMP/candidate-consumers.json" node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { createHash } from 'node:crypto';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';

          const baseRoot = process.env.BASE_DIST;
          const candRoot = 'dist';
          const walk = (root, dir=root, out=[]) => {
            for (const name of readdirSync(dir)) {
              const p = join(dir, name);
              const s = statSync(p);
              if (s.isDirectory()) walk(root, p, out);
              else if (name.endsWith('.js') || name.endsWith('.cjs')) out.push(relative(root, p));
            }
            return out;
          };
          const files = walk(baseRoot).sort();
          const candFiles = walk(candRoot).sort();
          if (JSON.stringify(files) !== JSON.stringify(candFiles)) throw new Error('dist file topology changed');
          const metric = (root, file) => {
            const bytes = readFileSync(join(root, file));
            return {
              raw: bytes.length,
              gzip: canonicalGzip(bytes).length,
              brotli: observationalBrotli(bytes).length,
              sha256: createHash('sha256').update(bytes).digest('hex'),
            };
          };
          const rows = files.map((file) => ({ file, base: metric(baseRoot,file), candidate: metric(candRoot,file) }));
          const regressions = rows.filter((r) => ['raw','gzip','brotli'].some((k) => r.candidate[k] > r.base[k]));
          const changed = rows.filter((r) => r.base.sha256 !== r.candidate.sha256);
          if (regressions.length) throw new Error(`dist regressions: ${JSON.stringify(regressions)}`);
          for (const file of ['projection/index.js','projection/index.cjs','smart/index.js','smart/index.cjs']) {
            const row = rows.find((r) => r.file === file);
            if (!row) throw new Error(`missing protected artifact ${file}`);
            if (row.base.sha256 !== row.candidate.sha256) throw new Error(`${file} changed despite topology exclusion`);
          }
          for (const entry of ['behaviors/index.js','behaviors/index.cjs','flip/index.js','flip/index.cjs','gestures/index.js','gestures/index.cjs']) {
            const row = rows.find((r) => r.file === entry);
            if (!row) throw new Error(`missing direct artifact ${entry}`);
            if (row.base.sha256 === row.candidate.sha256) throw new Error(`${entry} did not change`);
          }

          const baseConsumers = JSON.parse(readFileSync(process.env.BASE_CONSUMERS, 'utf8'));
          const candConsumers = JSON.parse(readFileSync(process.env.CANDIDATE_CONSUMERS, 'utf8'));
          const consumerRegressions = [];
          const compare = (name, a, b, path=[]) => {
            if (typeof a === 'number' && typeof b === 'number') {
              if (b > a) consumerRegressions.push({ name, field: path.join('.'), base: a, candidate: b });
              return;
            }
            if (a && b && typeof a === 'object' && typeof b === 'object') {
              for (const key of Object.keys(a)) if (key in b) compare(name, a[key], b[key], [...path,key]);
            }
          };
          for (const name of Object.keys(baseConsumers)) {
            if (!(name in candConsumers)) throw new Error(`missing consumer scenario ${name}`);
            compare(name, baseConsumers[name], candConsumers[name]);
          }
          if (consumerRegressions.length) throw new Error(`consumer regressions: ${JSON.stringify(consumerRegressions)}`);

          const direct = rows.filter((r) => /^(behaviors|flip|gestures)\/index\.(?:js|cjs)$/.test(r.file)).map((r) => ({
            file: r.file,
            base: { raw:r.base.raw, gzip:r.base.gzip, brotli:r.base.brotli },
            candidate: { raw:r.candidate.raw, gzip:r.candidate.gzip, brotli:r.candidate.brotli },
            delta: { raw:r.candidate.raw-r.base.raw, gzip:r.candidate.gzip-r.base.gzip, brotli:r.candidate.brotli-r.base.brotli },
          }));
          const result = {
            baseSha: process.env.BASE_SHA,
            node: process.version,
            structural: { wrapperAllocationsPerNonDrainingDeliveryAtChangedSites: '3 -> 0', wrapperInvocations: '3 -> 0', projectionWrapperRetained: true },
            dist: { totalArtifacts: rows.length, changedArtifacts: changed.map((r)=>r.file), regressions: [], direct },
            consumers: { scenarios: Object.keys(baseConsumers).length, regressions: [] },
          };
          writeFileSync('research-result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Product semantics and size gates
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm size

      - name: Upload immutable research receipt
        if: steps.state.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: timer-wrapper-topology-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: research-result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

      - name: Commit proven production candidate
        if: steps.state.outputs.run == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/behaviors/index.ts src/flip/index.ts src/gestures/index.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'perf(scheduler): убрать лишние timer-wrapper'
          git push origin "HEAD:$HEAD_REF"
