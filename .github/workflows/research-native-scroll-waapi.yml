name: Native scroll WAAPI delivery

on:
  push:
    branches: ["feat/native-scroll-waapi-20260912"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add native-scroll oracle
        shell: bash
        run: |
          cat > test/waapi-scroll-timeline.test.ts <<'TS'
          import { afterEach, describe, expect, it } from 'vitest';
          import {
            animateScrollWaapi,
            supportsScrollTimeline,
          } from '../src/waapi/index.js';

          const host = globalThis as unknown as { ScrollTimeline?: unknown };
          const original = host.ScrollTimeline;
          afterEach(() => {
            if (original === undefined) delete host.ScrollTimeline;
            else host.ScrollTimeline = original;
          });

          describe('waapi: native ScrollTimeline bridge', () => {
            it('SSR/unsupported: fail-closed без host commit', () => {
              delete host.ScrollTimeline;
              let commits = 0;
              const el = { animate: () => { commits++; return {}; } };
              expect(supportsScrollTimeline()).toBe(false);
              expect(animateScrollWaapi(el, {
                property: 'opacity', values: [0, 1],
              }, { source: {} })).toBeUndefined();
              expect(commits).toBe(0);
            });

            it('коммитит один native effect с timeline, без JS scheduler/listener', () => {
              const source = { id: 'scroller' };
              const timelines: unknown[] = [];
              class FakeScrollTimeline {
                constructor(readonly options: unknown) { timelines.push(this); }
              }
              host.ScrollTimeline = FakeScrollTimeline;

              const calls: Array<{ keyframes: unknown; timing: Record<string, unknown> }> = [];
              const animation = { native: true };
              const el = {
                animate(keyframes: unknown, timing: object) {
                  calls.push({ keyframes, timing: timing as Record<string, unknown> });
                  return animation;
                },
              };

              expect(supportsScrollTimeline()).toBe(true);
              const result = animateScrollWaapi(el, {
                property: 'translate',
                values: [0, 100],
                format: value => `${value}px 0`,
              }, { source, axis: 'x' });

              expect(result).toBe(animation);
              expect(timelines).toHaveLength(1);
              expect(calls).toHaveLength(1);
              expect(calls[0]!.keyframes).toEqual([
                { offset: 0, translate: '0px 0' },
                { offset: 1, translate: '100px 0' },
              ]);
              expect(calls[0]!.timing['timeline']).toBe(timelines[0]);
              expect(calls[0]!.timing['duration']).toBe(1);
              expect(calls[0]!.timing['iterations']).toBe(1);
              expect(calls[0]!.timing['direction']).toBe('normal');
              expect(calls[0]!.timing['fill']).toBe('both');
              expect((timelines[0] as { options: unknown }).options).toEqual({ source, axis: 'x' });
            });

            it('WAAPI-цель отсутствует: не конструирует timeline и не эмулирует JS fallback', () => {
              let timelines = 0;
              host.ScrollTimeline = class { constructor() { timelines++; } };
              expect(animateScrollWaapi({} as never, {
                property: 'opacity', values: [0, 1],
              }, { source: {} })).toBeUndefined();
              expect(timelines).toBe(0);
            });
          });
          TS

          cat > browser/24-native-scroll-timeline.spec.ts <<'TS'
          import { expect, test } from './fixtures/harness';

          test('native ScrollTimeline: поддерживаемый host двигает property без listener/rAF Lab Motion', async ({ page }) => {
            const result = await page.evaluate(async () => {
              const { animateScrollWaapi, supportsScrollTimeline } = await import('/dist/waapi/index.js');
              const scroller = document.createElement('div');
              scroller.style.cssText = 'width:200px;height:100px;overflow:auto;position:relative';
              const content = document.createElement('div');
              content.style.cssText = 'height:1000px;position:relative';
              const target = document.createElement('div');
              target.style.cssText = 'position:sticky;top:0;width:20px;height:20px;opacity:0';
              content.append(target);
              scroller.append(content);
              document.body.append(scroller);

              let rafCalls = 0;
              let scrollListeners = 0;
              const nativeRaf = window.requestAnimationFrame;
              const nativeAdd = scroller.addEventListener.bind(scroller);
              window.requestAnimationFrame = ((...args: Parameters<typeof requestAnimationFrame>) => {
                rafCalls++;
                return nativeRaf(...args);
              }) as typeof requestAnimationFrame;
              scroller.addEventListener = ((type: string, ...args: unknown[]) => {
                if (type === 'scroll') scrollListeners++;
                return (nativeAdd as (...args: unknown[]) => void)(type, ...args);
              }) as typeof scroller.addEventListener;

              const supported = supportsScrollTimeline();
              const animation = animateScrollWaapi(target, {
                property: 'opacity', values: [0, 1],
              }, { source: scroller, axis: 'block' }) as Animation | undefined;

              window.requestAnimationFrame = nativeRaf;
              scroller.addEventListener = nativeAdd as typeof scroller.addEventListener;

              if (!supported) {
                const unsupported = animation === undefined && rafCalls === 0 && scrollListeners === 0;
                scroller.remove();
                return { supported, unsupported, top: null, bottom: null, rafCalls, scrollListeners };
              }

              const settle = () => new Promise<void>(resolve => nativeRaf(() => nativeRaf(() => resolve())));
              scroller.scrollTop = 0;
              await settle();
              const top = Number(getComputedStyle(target).opacity);
              scroller.scrollTop = scroller.scrollHeight - scroller.clientHeight;
              await settle();
              const bottom = Number(getComputedStyle(target).opacity);
              animation?.cancel();
              scroller.remove();
              return { supported, unsupported: false, top, bottom, rafCalls, scrollListeners };
            });

            expect(result.rafCalls).toBe(0);
            expect(result.scrollListeners).toBe(0);
            if (result.supported) {
              expect(result.top).not.toBeNull();
              expect(result.bottom).not.toBeNull();
              expect(result.top!).toBeLessThan(0.1);
              expect(result.bottom!).toBeGreaterThan(0.9);
            } else {
              expect(result.unsupported).toBe(true);
            }
          });
          TS

      - name: RED on current main
        shell: bash
        run: |
          set +e
          pnpm vitest run test/waapi-scroll-timeline.test.ts > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -Eq 'animateScrollWaapi|supportsScrollTimeline|No matching export|does not provide an export' /tmp/red.log

      - name: Implement narrow native scroll bridge
        shell: bash
        run: |
          cat >> src/waapi/index.ts <<'TS'

          // ─── Native scroll progress timeline ────────────────────────────────────────

          /** Ось нативного ScrollTimeline; совпадает с CSS Scroll-driven Animations. */
          export type WaapiScrollAxis = 'block' | 'inline' | 'x' | 'y';

          /** Параметры нативной scroll-progress шкалы. JS fallback намеренно отсутствует. */
          export interface WaapiScrollTimelineOptions {
            readonly source: unknown;
            readonly axis?: WaapiScrollAxis;
          }

          /**
           * Scroll-linked эффект использует весь progress timeline; time/repeat-параметры
           * обычной WAAPI-анимации здесь не принадлежат контракту.
           */
          export type WaapiScrollCompileOptions = Omit<
            WaapiCompileOptions,
            'duration' | 'repeat' | 'repeatType' | 'repeatDelay'
          > & { readonly fill?: WaapiCompiled['timing']['fill'] };

          type ScrollTimelineCtor = new (options: {
            source: unknown;
            axis?: WaapiScrollAxis;
          }) => unknown;

          function scrollTimelineCtor(): ScrollTimelineCtor | undefined {
            const ctor = (globalThis as { ScrollTimeline?: unknown }).ScrollTimeline;
            return typeof ctor === 'function' ? ctor as ScrollTimelineCtor : undefined;
          }

          /** Capability probe без UA-sniffing и без DOM-глобалов на import. */
          export function supportsScrollTimeline(): boolean {
            return scrollTimelineCtor() !== undefined;
          }

          /**
           * Отдать связь scroll progress → property браузеру целиком.
           *
           * Возвращает undefined, если target/ScrollTimeline недоступны. Скрытого
           * scroll-listener/rAF fallback нет: caller может явно выбрать headless ./scroll.
           * На native path после единственного commit Lab Motion не выполняет per-frame JS.
           */
          export function animateScrollWaapi(
            el: WaapiAnimatable,
            options: WaapiScrollCompileOptions,
            scroll: WaapiScrollTimelineOptions,
          ): unknown | undefined {
            if (!supportsWaapi(el)) return undefined;
            const Timeline = scrollTimelineCtor();
            if (!Timeline) return undefined;

            const { fill, property, values, times, easing, format, easingPoints } = options;
            const compiled = compileWaapi({
              property,
              values,
              ...(times === undefined ? {} : { times }),
              ...(easing === undefined ? {} : { easing }),
              ...(format === undefined ? {} : { format }),
              ...(easingPoints === undefined ? {} : { easingPoints }),
              // MDN/Web Animations uses a non-zero nominal duration with progress timelines;
              // timeline progress, not wall time, owns the actual animation position.
              duration: 0.001,
            });
            const timeline = new Timeline({ source: scroll.source, axis: scroll.axis ?? 'block' });
            return el.animate(compiled.keyframes, {
              ...compiled.timing,
              duration: 1,
              iterations: 1,
              direction: 'normal',
              fill: fill ?? compiled.timing.fill,
              timeline,
            });
          }
          TS

          python - <<'PY'
          from pathlib import Path

          p = Path('test/waapi-emit.test.ts')
          s = p.read_text()
          old = """      'animateWaapi',\n      'compileWaapi',\n      'easingToLinear',\n      'supportsWaapi',\n"""
          new = """      'animateScrollWaapi',\n      'animateWaapi',\n      'compileWaapi',\n      'easingToLinear',\n      'supportsScrollTimeline',\n      'supportsWaapi',\n"""
          if s.count(old) != 1:
              raise SystemExit('waapi runtime export pin drifted')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/api.md')
          s = p.read_text()
          old = "| `…/waapi` | Низкоуровневый мост: `compileWaapi`/`animateWaapi` (кейфреймы движка → нативный `Element.animate`), `easingToLinear` (любой easing → CSS `linear()`), `supportsWaapi` |"
          new = "| `…/waapi` | Низкоуровневый native-мост: `compileWaapi`/`animateWaapi`; `animateScrollWaapi` отдаёт scroll-progress → property нативному `ScrollTimeline` без собственного покадрового JS и без скрытого fallback; `supportsWaapi`/`supportsScrollTimeline` — capability probes |"
          if s.count(old) != 1:
              raise SystemExit('docs/api waapi row drifted')
          p.write_text(s.replace(old, new, 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          anchor = '### Добавлено\n'
          line = '- `animateScrollWaapi` в `./waapi`: нативная scroll-progress шкала через `ScrollTimeline`; на поддерживаемом host нет scroll-listener/rAF Lab Motion, на неподдерживаемом путь возвращает `undefined` без скрытой JS-эмуляции.\n'
          if s.count(anchor) != 1:
              raise SystemExit('unexpected changelog Added section')
          p.write_text(s.replace(anchor, anchor + line, 1))
          PY

      - name: GREEN unit + contracts
        run: |
          pnpm vitest run test/waapi-scroll-timeline.test.ts test/waapi-emit.test.ts
          pnpm typecheck:native
          pnpm build
          pnpm size

      - name: Commit production slice and remove carrier
        shell: bash
        run: |
          rm .github/workflows/research-native-scroll-waapi.yml
          expected="$(printf '%s\n' CHANGELOG.md browser/24-native-scroll-timeline.spec.ts docs/api.md src/waapi/index.ts test/waapi-emit.test.ts test/waapi-scroll-timeline.test.ts | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md browser/24-native-scroll-timeline.spec.ts docs/api.md src/waapi/index.ts test/waapi-emit.test.ts test/waapi-scroll-timeline.test.ts .github/workflows/research-native-scroll-waapi.yml
          git commit -m 'feat(waapi): отдать scroll progress нативному timeline'
          git push origin HEAD:feat/native-scroll-waapi-20260912
