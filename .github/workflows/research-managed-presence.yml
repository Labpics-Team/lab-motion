name: Managed presence follow-up delivery
on:
  push:
    branches: [research/managed-presence-delivery-20260913]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 51c72c0de78c5466ed8dd453cf6947652f957cc5
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate and create immutable candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,base64,pathlib,hashlib
          base='51c72c0de78c5466ed8dd453cf6947652f957cc5'
          expected='57475df21cb3166c64dc1f77c0aac902115581ad'
          repo='repos/Labpics-Team/lab-motion'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def get(route): return json.loads(subprocess.check_output(['gh','api',repo+route],text=True))
          def post(route,payload):
            return json.loads(subprocess.check_output(['gh','api','--method','POST',repo+route,'--input','-'],input=json.dumps(payload,ensure_ascii=False),text=True))
          assert git('rev-parse','HEAD')==base
          patch=base64.b64decode(get('/git/blobs/31a8911dd741aade8382040d4e8136266c0cdc19')['content'])
          assert hashlib.sha256(patch).hexdigest()=='ae5a9991f4dfd9eaff6ad8d8d0ccb0007a58fcd4208de0ac51b0697f5265e793'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert git('write-tree')==expected
          paths=['docs/recipes.md','src/presence/transition.ts','test/presence-transition.test.ts']
          assert git('diff','--cached','--name-only').splitlines()==paths
          tree=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in paths]})
          assert tree['sha']==expected
          commit=post('/git/commits',{'message':'fix(presence): завершать очистку группы и исполнять корректный диалог','tree':expected,'parents':[base]})
          ref=post('/git/refs',{'ref':'refs/heads/research/presence-followup-20260913','sha':commit['sha']})
          print(json.dumps({'base':base,'tree':expected,'head':commit['sha'],'ref':ref['ref'],'paths':paths},ensure_ascii=False))
          PY
