name: R11 normalized clamp IEEE falsifier
on:
  push:
    branches: [carrier/r11-normalized-clamp-ieee-20260914]
permissions:
  contents: read
jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Run exact normalized candidate against IEEE oracle
        shell: bash
        run: |
          set -euo pipefail
          cp .github/research/r11_normalized_clamp_ieee.test.ts "$RUNNER_TEMP/normalized-clamp-ieee.test.ts"
          git switch --detach 62d94f44c8b5207354d02a30fda7283034e7cdbe
          cp "$RUNNER_TEMP/normalized-clamp-ieee.test.ts" test/research-normalized-clamp-ieee.test.ts
          pnpm typecheck
          pnpm vitest run test/research-normalized-clamp-ieee.test.ts
