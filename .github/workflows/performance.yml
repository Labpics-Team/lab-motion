name: Эксперимент сжатия root

on:
  workflow_call:
    inputs:
      baseline:
        type: string
        required: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Проверить identity baseline
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]

      - name: Получить проверяемый источник
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Получить baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ inputs.baseline }}
          persist-credentials: false
          fetch-depth: 0

      - name: Настроить Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - name: Активировать pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Собрать обе версии
        id: build
        run: |
          pnpm --dir baseline install --frozen-lockfile
          pnpm --dir candidate install --frozen-lockfile
          pnpm --dir baseline build
          pnpm --dir candidate build

      - name: Измерить два варианта root-сжатия на копиях
        env:
          MOTION_BASELINE_SHA: ${{ inputs.baseline }}
        run: node candidate/bench/root-compression-experiment.mjs baseline candidate "$RUNNER_TEMP/motion-compression"

      - name: Сохранить исходные сборки и эксперимент
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-compression-${{ github.sha }}
          path: |
            baseline/dist/
            baseline/package.json
            candidate/dist/
            candidate/package.json
            ${{ runner.temp }}/motion-compression/reports/
            ${{ runner.temp }}/motion-compression/root-output/
          if-no-files-found: error
          retention-days: 5
