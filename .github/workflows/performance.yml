name: Полная стоимость движения

on:
  workflow_call:
    inputs:
      baseline:
        type: string
        required: true
      s5_capture_diagnostic:
        type: boolean
        default: false
      performance_contract_only:
        type: boolean
        default: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Проверить identity baseline
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.s5_capture_diagnostic }}" != true || "${{ inputs.performance_contract_only }}" != true ]]

      - name: Получить проверяемый источник
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Получить baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ inputs.baseline }}
          persist-credentials: false
          fetch-depth: 0

      - name: Проверить неизменность product для S5
        if: ${{ inputs.s5_capture_diagnostic }}
        working-directory: candidate
        shell: bash
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASELINE" HEAD -- src bench/compare/entries

      - name: Настроить Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'

      - name: Активировать pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Собрать обе версии
        id: build
        run: |
          pnpm --dir baseline install --frozen-lockfile
          pnpm --dir candidate install --frozen-lockfile
          pnpm --dir baseline build
          pnpm --dir candidate build

      - name: Измерить каждый публичный root-импорт
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/motion-performance"
          node candidate/bench/consumer-size.mjs baseline candidate "$RUNNER_TEMP/motion-performance/consumer-size.json"

      - name: Сравнить численное ядро easing
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
        run: node candidate/bench/easing-pair.mjs baseline candidate "$RUNNER_TEMP/motion-performance/easing.json"

      - name: Установить зависимости сравнения
        run: pnpm --dir candidate/bench/compare install --frozen-lockfile

      - name: Установить Chromium
        run: pnpm --dir candidate/bench/compare exec playwright install --with-deps chromium

      - name: Сохранить receipt contract-only до запуска контрактов
        if: ${{ inputs.performance_contract_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motion-performance"
          printf 'mode=performance-contract-only\n' > "$RUNNER_TEMP/motion-performance/contract-only.txt"

      - name: Проверить контракты CLI в настоящем Chromium
        if: ${{ !inputs.s5_capture_diagnostic }}
        run: xvfb-run -a node --test candidate/bench/compare/transition-profile.contract.test.mjs

      - name: Проверить адресные контракты S5 и workflow
        if: ${{ inputs.s5_capture_diagnostic }}
        working-directory: candidate
        run: pnpm exec vitest run test/benchmark-cli-contract.test.ts test/ci-workflow-contract.test.ts

      - name: Снять 16 S5 captures с полными raw и PNG
        if: ${{ inputs.s5_capture_diagnostic }}
        working-directory: candidate
        shell: bash
        env:
          S5_CAPTURE_DIAGNOSTIC: '1'
          S5_CAPTURE_DIAGNOSTIC_DIR: ${{ runner.temp }}/motion-performance/s5-capture
        run: |
          set -euo pipefail
          [[ "$S5_CAPTURE_DIAGNOSTIC_DIR" = /* ]]
          mkdir -p "$RUNNER_TEMP/motion-performance"
          xvfb-run -a node bench/compare/conformance-smoke.mjs

      - name: Сравнить spring и JS-исполнение с baseline
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node candidate/bench/compare/transition-profile.mjs candidate "$RUNNER_TEMP/motion-performance/spring" spring-pair baseline
          xvfb-run -a node candidate/bench/compare/transition-profile.mjs candidate "$RUNNER_TEMP/motion-performance/js" js-pair baseline

      - name: Сравнить полную стоимость в одном браузере
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node candidate/bench/compare/transition-profile.mjs candidate "$RUNNER_TEMP/motion-performance/transition" full baseline

      - name: Проверить сравнительные утверждения
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
        working-directory: candidate/bench/compare
        run: xvfb-run -a node bench.mjs

      - name: Измерить потребительские сборки
        if: ${{ !inputs.s5_capture_diagnostic && !inputs.performance_contract_only && !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/motion-performance"
          motion_size_status=0
          node baseline/scripts/size-gate.mjs | tee "$RUNNER_TEMP/motion-performance/baseline-size.txt" || motion_size_status=1
          node candidate/scripts/size-gate.mjs | tee "$RUNNER_TEMP/motion-performance/candidate-size.txt" || motion_size_status=1
          exit "$motion_size_status"

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-performance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/bench/compare/results/
            ${{ runner.temp }}/motion-performance/
          retention-days: 5
          if-no-files-found: error

