name: research-smart-ghost-index

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Assert exact base source and build baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse fe11daa407de396fad952be7679650f63dabd4dd:src/smart/index.ts)" = "56998fa019e7ada0e2588ae96d602785a1aedc09"
          pnpm build
          node --input-type=module <<'NODE' > /tmp/base.json
          import fs from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const out = {};
          for (const f of ['dist/smart/index.js','dist/smart/index.cjs']) {
            const b = fs.readFileSync(f);
            out[f] = { raw: b.length, gzip: canonicalGzip(b).length, brotli: observationalBrotli(b).length };
          }
          console.log(JSON.stringify(out));
          NODE
      - name: Materialize candidate representation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/smart/index.ts')
          s = p.read_text()
          def r(old, new, n=1):
              global s
              c=s.count(old)
              if c != n:
                  raise SystemExit(f'replacement count {c} != {n}: {old[:80]!r}')
              s=s.replace(old,new)
          r("interface _GhostEntry {\n  readonly el: SmartElement;\n  readonly box: _Rect;\n}\n\n", "")
          r("  ghosts: Map<string, _GhostEntry>;\n  ghostEls: Set<SmartElement>;", "  /** Controller-local ghost identity index; payload stays owned by flight. */\n  ghostIndex: Map<SmartElement, string>;")
          r("  ghostEls: Set<SmartElement>,", "  ghostIndex: Map<SmartElement, string>,")
          r("      if (ghostEls.has(child)) continue; // наш ghost — прозрачен для дифа", "      if (ghostIndex.has(child)) continue; // наш ghost — прозрачен для дифа")
          r("    ghosts: new Map(),\n    ghostEls: new Set(),", "    ghostIndex: new Map(),")
          r("  ctrl.ghosts = new Map();\n  ctrl.ghostEls = new Set();", "  ctrl.ghostIndex = new Map();")
          r("  const g = ctrl.ghosts.get(key);\n  if (g === undefined) return;", "  const g = ctrl.flight.get(key);\n  if (g === undefined || !g.isGhost) return;")
          r("  ctrl.ghosts.delete(key);\n  ctrl.ghostEls.delete(g.el);", "  ctrl.ghostIndex.delete(g.el);")
          r("  const structure = _structure(ctrl.root, keyAttr, shadow, ctrl.ghostEls);", "  const structure = _structure(ctrl.root, keyAttr, shadow, ctrl.ghostIndex);", 2)
          r("    if (ctrl.ghosts.has(key)) {", "    if (ctrl.flight.get(key)?.isGhost === true) {")
          r("  for (const [key, g] of ctrl.ghosts) {\n    if (newLive.has(key) || reincarnated.has(key) || desc.has(key)) continue;\n    exitedKeys.push(key);\n    desc.set(key, { kind: 'exit', el: g.el, ghostBox: g.box, newExit: false, parentKey: null });\n  }", "  for (const [el, key] of ctrl.ghostIndex) {\n    if (newLive.has(key) || reincarnated.has(key) || desc.has(key)) continue;\n    const g = ctrl.flight.get(key)!;\n    exitedKeys.push(key);\n    desc.set(key, { kind: 'exit', el, ghostBox: g.ghostBox!, newExit: false, parentKey: null });\n  }")
          r("  const newGhosts = new Map<string, _GhostEntry>(ctrl.ghosts);\n  const newGhostEls = new Set<SmartElement>(ctrl.ghostEls);", "  const newGhostIndex = new Map<SmartElement, string>(ctrl.ghostIndex);")
          r("      newGhosts.set(key, { el, box });\n      newGhostEls.add(el);", "      newGhostIndex.set(el, key);")
          r("  ctrl.ghosts = newGhosts;\n  ctrl.ghostEls = newGhostEls;", "  ctrl.ghostIndex = newGhostIndex;")
          p.write_text(s)
          PY
          cat > test/smart-ghost-ownership.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { captureSmart } from '../src/smart/index.js';
          import { detach, makeClock, makeSmartWorld } from './smart-helpers.js';

          describe('./smart ghost ownership isolation', () => {
            it('hides a live ghost only from its owning root', () => {
              const world = makeSmartWorld();
              const ghost = world.el('ghost', { x: 10, y: 10, width: 10, height: 10 }, { key: 'g' });
              const inner = world.root('inner', { x: 0, y: 0, width: 50, height: 50 }, { children: [ghost] });
              const outer = world.root('outer', { x: 0, y: 0, width: 100, height: 100 }, { children: [inner] });
              const clock = makeClock();
              const options = { requestFrame: clock.requestFrame, getScroll: world.getScroll, getComputedStyle: world.getComputedStyle };

              const before = captureSmart(inner, options);
              detach(inner, ghost);
              const flight = before.animate();

              expect(captureSmart(inner, options).size).toBe(0);
              expect(captureSmart(outer, options).size).toBe(1);

              flight.cancel();
            });
          });
          EOF
      - name: Structural falsifier and targeted semantics
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'interface _GhostEntry' src/smart/index.ts
          ! grep -q 'ghostEls' src/smart/index.ts
          ! grep -q 'ghosts:' src/smart/index.ts
          test "$(grep -c 'ghostIndex: Map<SmartElement, string>' src/smart/index.ts)" -eq 2
          pnpm vitest run test/smart-*.test.ts
          pnpm typecheck
      - name: Build candidate and prove byte Pareto
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm size
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const base = JSON.parse(fs.readFileSync('/tmp/base.json','utf8'));
          const candidate = {};
          let bad = false;
          for (const f of ['dist/smart/index.js','dist/smart/index.cjs']) {
            const b = fs.readFileSync(f);
            candidate[f] = { raw: b.length, gzip: canonicalGzip(b).length, brotli: observationalBrotli(b).length };
            for (const k of ['raw','gzip','brotli']) if (candidate[f][k] > base[f][k]) bad = true;
          }
          const result = { baseSha:'fe11daa407de396fad952be7679650f63dabd4dd', base, candidate, delta:{} };
          for (const f of Object.keys(base)) result.delta[f] = Object.fromEntries(['raw','gzip','brotli'].map(k => [k, candidate[f][k]-base[f][k]]));
          fs.writeFileSync('smart-ghost-index-result.json', JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if (bad) process.exit(23);
          NODE
      - name: Commit candidate after proof
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'lab-motion-research'
          git config user.email '63733699+lemone112@users.noreply.github.com'
          git add src/smart/index.ts test/smart-ghost-ownership.test.ts
          git commit -m 'perf(smart): объединить индексы ghost ownership'
          git push origin HEAD:research/smart-ghost-index-fusion-20260916
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smart-ghost-index-receipt-${{ github.run_id }}
          path: smart-ghost-index-result.json
          if-no-files-found: warn
          retention-days: 7
