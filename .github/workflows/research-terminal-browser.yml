name: Terminal native browser evidence
on:
  push:
    branches: [research/mechanism-20260912-r4]
    paths: [.github/workflows/research-terminal-browser.yml]
permissions:
  contents: read
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'
  BASE: 93278bf9b540f93521c7bd4c02f68db458e5db7a
  CANDIDATE: 43e73632560b6b3b289b0243c122b3e6f4479e8d
jobs:
  exact-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch unchanged authoritative graph on exact reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api repos/Labpics-Team/lab-motion/git/ref/heads/perf/terminal-aggregate-20260912 --jq .object.sha)"
          [[ "$actual" == "$CANDIDATE" ]]
          gh api --method POST repos/Labpics-Team/lab-motion/actions/workflows/ci.yml/dispatches -f ref=perf/terminal-aggregate-20260912
  native-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.20.0'
      - name: Build exact participants and pinned browser
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          mkdir -p evidence
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE"
          git worktree add --detach "$RUNNER_TEMP/measured" 5ef3bfde8b52a7f09f0a418415d7fb6669faf542
          for name in base candidate measured; do
            (cd "$RUNNER_TEMP/$name" && pnpm install --frozen-lockfile && pnpm build) 2>&1 | tee "evidence/$name-build.log"
          done
          diff -qr "$RUNNER_TEMP/measured/dist" "$RUNNER_TEMP/candidate/dist" | tee evidence/shipped-byte-identity.txt
          git diff 5ef3bfde8b52a7f09f0a418415d7fb6669faf542 "$CANDIDATE" -- > evidence/review-delta.diff
          git archive "$CANDIDATE" | gzip -n > evidence/candidate-source.tar.gz
          (cd "$RUNNER_TEMP/candidate" && pnpm exec playwright install --with-deps chromium)
          cp research/terminal-ownership/browser.mjs evidence/browser.mjs
          { printf 'base=%s\ncandidate=%s\n' "$BASE" "$CANDIDATE"; node --version; uname -a; lscpu; } > evidence/environment.txt
      - name: Real DOM and native Element.animate retention differential
        run: node research/terminal-ownership/browser.mjs "$RUNNER_TEMP/base" "$RUNNER_TEMP/candidate" evidence
      - name: Seal receipts
        if: always()
        run: find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: terminal-browser-${{ env.CANDIDATE }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
