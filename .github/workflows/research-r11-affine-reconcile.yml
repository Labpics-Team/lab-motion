name: R11 affine reconcile
on:
  push:
    branches: [carrier/r11-safe-structural-matrix-20260915]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Materialize full affine hardening on exact R11 base
        shell: bash
        run: |
          set -euo pipefail
          cp .github/research/r11_affine_reconcile.py "$RUNNER_TEMP/reconcile.py"
          cp .github/research/r11_affine_projector.test.ts "$RUNNER_TEMP/projector-affine.test.ts"
          cp .github/research/r11_safe_dom_state.test.ts "$RUNNER_TEMP/dom-state.test.ts"
          git show origin/carrier/r11-geometry-inline-state-20260914:.github/research/r11_geometry_clamp_search.test.ts > "$RUNNER_TEMP/clamp-search.test.ts"
          git show origin/carrier/r11-normalized-clamp-endpoint-lerp-20260914:.github/research/r11_normalized_clamp_ieee_harden.test.ts > "$RUNNER_TEMP/ieee.test.ts"
          git show origin/fix/projection-affine-overflow-20260914:test/projection-affine-overflow.test.ts > "$RUNNER_TEMP/affine.test.ts"
          git switch --detach d87d45399797d8954b6decbeeaf3c57ec97345db
          cp "$RUNNER_TEMP/projector-affine.test.ts" test/research-r11-affine-projector.test.ts
          cp "$RUNNER_TEMP/dom-state.test.ts" test/research-r11-safe-dom-state.test.ts
          cp "$RUNNER_TEMP/clamp-search.test.ts" test/research-projection-clamp-search.test.ts
          cp "$RUNNER_TEMP/ieee.test.ts" test/research-normalized-clamp-ieee.test.ts
          cp "$RUNNER_TEMP/affine.test.ts" test/research-affine-overflow.test.ts
          set +e
          pnpm vitest run test/research-r11-affine-projector.test.ts > "$RUNNER_TEMP/red.log" 2>&1
          red=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [[ "$red" -eq 0 ]]; then
            echo 'expected pre-fix projector radii RED' >&2
            exit 1
          fi
          python3 "$RUNNER_TEMP/reconcile.py"
          git diff --check
      - name: Verify reconciled semantic class
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm vitest run \
            test/projection-dom.test.ts \
            test/projection-vector-retarget.test.ts \
            test/projection-vector-clamp.test.ts \
            test/projection-driver.test.ts \
            test/projection-geometry.test.ts \
            test/projection-finiteness-fuzz.test.ts \
            test/motion-contract-v1.test.ts \
            test/projection-api-surface-pin.test.ts \
            test/research-projection-clamp-search.test.ts \
            test/research-normalized-clamp-ieee.test.ts \
            test/research-affine-overflow.test.ts \
            test/research-r11-affine-projector.test.ts \
            test/research-r11-safe-dom-state.test.ts
          rm test/research-projection-clamp-search.test.ts \
             test/research-normalized-clamp-ieee.test.ts \
             test/research-affine-overflow.test.ts \
             test/research-r11-affine-projector.test.ts \
             test/research-r11-safe-dom-state.test.ts
          pnpm build
          node scripts/size-gate.mjs 2>&1 | tee "$RUNNER_TEMP/size.log" || true
          grep -E 'projection-dom-one-liner|projection-core-only|projection\s|size-gate:' "$RUNNER_TEMP/size.log" || true
