name: PROFILE-01 one-shot null/control pilot
# Acquisition runs only when the exact PR head commit carries [profile-pilot].
# Trigger revision 2 follows the corrected synchronous C0 handoff oracle.

on:
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate one-shot pilot packet
        id: gate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s "$HEAD_SHA")"
          if [[ "$subject" == *"[profile-pilot]"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No [profile-pilot] marker on exact head; evidence acquisition is intentionally skipped."
          fi
      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        if: steps.gate.outputs.run == 'true'
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install exact research dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir bench/compare install --frozen-lockfile
          pnpm --dir bench/compare exec playwright install --with-deps chromium firefox webkit
      - name: Build frozen baseline
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/profile-baseline" fe11daa407de396fad952be7679650f63dabd4dd
          pnpm --dir "$RUNNER_TEMP/profile-baseline" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/profile-baseline" build
      - name: Capture one-shot scenario null/control pilot
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          PROFILE_HARNESS_REVISION: ${{ github.event.pull_request.head.sha }}
          PROFILE_PILOT_ID: desktop-heavy-scenes-null-control-${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profile-evidence"
          node bench/profile/capture-desktop.mjs > "$RUNNER_TEMP/profile-evidence/inventory.json"
          set +e
          PROFILE_BASELINE_DIR="$RUNNER_TEMP/profile-baseline" \
            PROFILE_INVENTORY_PATH="$RUNNER_TEMP/profile-evidence/inventory.json" \
            PROFILE_PILOT_OUTPUT="$RUNNER_TEMP/profile-evidence/pilot.json" \
            node bench/profile/pilot-desktop.mjs
          pilot_rc=$?
          set -e
          (cd "$RUNNER_TEMP/profile-evidence" && sha256sum ./*.json > SHA256SUMS)
          exit "$pilot_rc"
      - name: Upload immutable evidence packet
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-01-pilot-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-evidence/
          if-no-files-found: warn
          retention-days: 14
