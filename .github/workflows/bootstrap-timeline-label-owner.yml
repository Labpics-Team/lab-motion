name: Bootstrap timeline label owner candidate

on:
  push:
    branches: ["perf/timeline-label-owner-fusion-20260915"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply exact preregistered mechanism
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/timeline/index.ts')
          s = p.read_text()
          replacements = [
            (
              "function buildSegments(configs: readonly SegmentConfig[], initialLabels: Map<string, number> = new Map()): ComputedSegment[] {",
              "function buildSegments(configs: readonly SegmentConfig[], labels: ReadonlyMap<string, number>): ComputedSegment[] {",
            ),
            (
              "  const labels = new Map(initialLabels); // copy for this build\n\n  // First pass: collect numeric labels from segments if they define at as pure number with label intent (simple: we resolve later)\n  // For creation labels we support via initialLabels.\n",
              "  // Метки только читаются при компиляции: start/endTime материализуются значениями,\n  // поэтому последующие runtime-мутации этого же Map не меняют готовые сегменты.\n",
            ),
            (
              "function resolvePosition(p: string, l: Map<string, number>, e: number, s: number): number {",
              "function resolvePosition(p: string, l: ReadonlyMap<string, number>, e: number, s: number): number {",
            ),
            (
              "  const initialLabels = new Map<string, number>();\n",
              "  const _labels = new Map<string, number>();\n",
            ),
            (
              "        initialLabels.set(k, v);",
              "        _labels.set(k, v);",
            ),
            (
              "  const segments = buildSegments(segConfigs, initialLabels);",
              "  const segments = buildSegments(segConfigs, _labels);",
            ),
            (
              "  /** Метки (имя -> время). Поддержка label() + seek('name') + позиций в at (шаг 2). */\n  const _labels = new Map<string, number>(initialLabels);\n\n",
              "",
            ),
            (
              "    label(name: string, at?: number | string): void {\n      if (!name || typeof name !== 'string') return;\n      let t: number;\n      if (at === undefined) {\n        t = _vt;\n      } else if (typeof at === 'number') {\n        t = Number.isFinite(at) ? Math.max(0, at) : _vt;\n      } else if (typeof at === 'string') {\n        t = _labels.has(at) ? _labels.get(at)! : _vt;\n      } else {\n        t = _vt;\n      }\n      _labels.set(name, t);\n    },",
              "    label,",
            ),
          ]
          for old, new in replacements:
            n = s.count(old)
            if n != 1:
              raise SystemExit(f'expected exactly one replacement, found {n}: {old[:100]!r}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
          cat > test/timeline-label-owner-allocation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { createTimeline } from '../src/timeline/index.js';

          const NativeMap = Map;

          function countConstructionMaps(withLabels: boolean, positiveControl = false): number {
            let count = 0;
            class CountingMap<K, V> extends NativeMap<K, V> {
              constructor(iterable?: Iterable<readonly [K, V]> | null) {
                super(iterable as Iterable<readonly [K, V]> | undefined);
                count++;
              }
            }
            const descriptor = Object.getOwnPropertyDescriptor(globalThis, 'Map')!;
            Object.defineProperty(globalThis, 'Map', { ...descriptor, value: CountingMap });
            try {
              if (positiveControl) new Map();
              const tl = createTimeline({
                segments: [{ from: 0, to: 1, duration: 1, ...(withLabels ? { at: 'origin' } : {}) }],
                ...(withLabels ? { labels: { origin: 0 } } : {}),
                requestFrame: () => 1,
              });
              tl.cancel();
            } finally {
              Object.defineProperty(globalThis, 'Map', descriptor);
            }
            return count;
          }

          describe('timeline label ownership allocation ceiling', () => {
            it('keeps construction to one Map with and without initial labels', () => {
              expect(countConstructionMaps(false)).toBeLessThanOrEqual(1);
              expect(countConstructionMaps(true)).toBeLessThanOrEqual(1);
            });

            it('runtime label mutation does not rewrite compiled segment positions', () => {
              const tl = createTimeline({
                segments: [{ from: 0, to: 1, duration: 1, at: 'origin' }],
                labels: { origin: 2 },
                requestFrame: () => 1,
              });
              expect(tl.totalDuration).toBe(3);
              tl.label('origin', 0);
              expect(tl.totalDuration).toBe(3);
              tl.seek('origin');
              expect(tl.time).toBe(0);
              tl.cancel();
            });

            it('detects a deliberate extra retained-shape Map', () => {
              const normal = countConstructionMaps(false);
              expect(countConstructionMaps(false, true)).toBe(normal + 1);
            });
          });
          EOF
          test "$(grep -c '^  const _labels = new Map<string, number>();$' src/timeline/index.ts)" -eq 1
          test "$(grep -c '^  function label(name: string, at?: number | string): void {$' src/timeline/index.ts)" -eq 1
          test "$(grep -c '^    label,$' src/timeline/index.ts)" -eq 1
      - name: Verify exact candidate before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm vitest run test/timeline*.test.ts
          pnpm build
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const frozenBase = {
            'dist/timeline/index.js': { raw: 3590, gzip: 1641, brotli: 1503 },
            'dist/timeline/index.cjs': { raw: 3597, gzip: 1644, brotli: 1503 },
          };
          let improved = false;
          for (const [path, base] of Object.entries(frozenBase)) {
            const b = readFileSync(path);
            const candidate = { raw: b.length, gzip: canonicalGzip(b).length, brotli: observationalBrotli(b).length };
            console.log('PACKED', path, JSON.stringify({ base, candidate }));
            for (const k of ['raw', 'gzip', 'brotli']) {
              if (candidate[k] > base[k]) throw new Error(`${path} ${k} regressed ${base[k]} -> ${candidate[k]}`);
              if (candidate[k] < base[k]) improved = true;
            }
          }
          if (!improved) throw new Error('candidate has no shipped-size improvement');
          EOF
      - name: Commit product candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/timeline/index.ts test/timeline-label-owner-allocation.test.ts
          git commit -m 'perf(timeline): unify label state ownership'
          git push origin HEAD:perf/timeline-label-owner-fusion-20260915
