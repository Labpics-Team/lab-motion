name: R11 geometry DOM compaction
on:
  push:
    branches: [carrier/r11-geometry-dom-compact-20260914]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded DOM compaction and measure
        shell: bash
        run: |
          set -euo pipefail
          cp .github/research/r11_geometry_dom_compact.py "$RUNNER_TEMP/materialize.py"
          git switch --detach 62d94f44c8b5207354d02a30fda7283034e7cdbe
          # The original materializer correctly found one missed consumer after
          # converting FlightEntry to SavedInline. Let it materialize the rest,
          # then close that exact consumer before typecheck.
          python3 - "$RUNNER_TEMP/materialize.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "for needle in ('savedTransform', 'savedOrigin', 'savedRadius', 'm.cap', 'm.last', 'm.radiiLast'):"
          new = "for needle in ('savedOrigin', 'savedRadius', 'm.cap', 'm.last', 'm.radiiLast'):"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          python3 "$RUNNER_TEMP/materialize.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/projection/dom.ts')
          s = p.read_text()
          old = "restoreProp(style, 'transform', entry.savedTransform);"
          new = "restoreProp(style, 'transform', entry.saved[0]);"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          for needle in ('savedTransform', 'savedOrigin', 'savedRadius', 'm.cap', 'm.last', 'm.radiiLast'):
              assert needle not in s, needle
          p.write_text(s)
          PY
          pnpm typecheck
          pnpm vitest run test/projection-*.test.ts
          pnpm build
          set +e
          node scripts/size-gate.mjs 2>&1 | tee "$RUNNER_TEMP/size.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'projection-dom-one-liner|projection-core-only|projection\s|size-gate:' "$RUNNER_TEMP/size.log" || true
          echo "SIZE_RC=$rc"
          git diff --check
          exit "$rc"
