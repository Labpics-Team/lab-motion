name: Carrier R11 geometry vector fix
on:
  push:
    branches: [carrier/r11-geometry-vector-fix-20260914]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize geometry contract comment
        shell: bash
        env:
          TARGET_BRANCH: geometry/r11-vector-retarget-20260914
          TARGET_SHA: 9263e021ccf59d8a399aaf79d7800e2168548060
        run: |
          set -euo pipefail
          cp .github/scripts/carrier-r11-geometry-comment-fix.py /tmp/r11-geometry-comment-fix.py
          git switch --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 /tmp/r11-geometry-comment-fix.py
          git diff --check
          git add src/projection/driver.ts
          git commit -m 'docs(projection): align vector retarget contract'
          final="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" origin "$final:refs/heads/$TARGET_BRANCH"
          printf 'comment_head=%s\n' "$final"
