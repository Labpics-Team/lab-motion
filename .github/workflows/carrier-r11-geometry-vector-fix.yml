name: Carrier R11 geometry vector fix
on:
  push:
    branches: [carrier/r11-geometry-vector-fix-20260914]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Measure exact contract baseline
        shell: bash
        env:
          TARGET_SHA: e5833d01551f5f8e7cbd67850fe5d00c55751889
        run: |
          set -euo pipefail
          git switch --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm size
