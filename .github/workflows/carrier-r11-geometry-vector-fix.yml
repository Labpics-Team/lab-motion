name: Carrier R11 geometry vector fix
on:
  push:
    branches: [carrier/r11-geometry-vector-fix-20260914]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Test indexed vector-state variant
        shell: bash
        env:
          TARGET_SHA: f2971c3ee487c79de146c1882884386e89dc11be
        run: |
          set -euo pipefail
          cp .github/scripts/carrier-r11-geometry-indexed-state.py /tmp/indexed-state.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/indexed-state.py')
          s = p.read_text()
          s = s.replace(
              "s = one(s, \"startRun(projector, v0);\", \"startRun(projector, v0, positionBasis !== undefined);\", 'play startRun')",
              "s = s.replace(\"startRun(projector, v0);\", \"startRun(projector, v0, positionBasis !== undefined);\", 1)",
          )
          s = s.replace(
              "s = one(s, \"startRun(projector, v0);\", \"startRun(projector, v0, false);\", 'release startRun')",
              "s = s.replace(\"startRun(projector, v0);\", \"startRun(projector, v0, false);\", 1)",
          )
          p.write_text(s)
          PY
          git switch --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 /tmp/indexed-state.py
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm vitest run test/projection-vector-clamp.test.ts test/projection-vector-retarget.test.ts test/projection-driver.test.ts test/projection-geometry.test.ts test/projection-finiteness-fuzz.test.ts test/motion-contract-v1.test.ts
          git diff --check
          pnpm build
          pnpm size
