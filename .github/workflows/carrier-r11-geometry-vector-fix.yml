name: Carrier R11 geometry vector fix
on:
  push:
    branches: [carrier/r11-geometry-vector-fix-20260914]
permissions:
  contents: read
jobs:
  prove-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run exact vector cancellation witness
        shell: bash
        env:
          TARGET_SHA: 92731e6bf9e01531c423270e557531d7048c8a63
        run: |
          set -euo pipefail
          git switch --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          pnpm vitest run test/projection-vector-retarget.test.ts
