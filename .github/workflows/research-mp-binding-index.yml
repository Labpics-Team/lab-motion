name: research · MotionProgram binding ownership resume

on:
  push:
    branches: ["research/mp-binding-index-run11"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile

      - name: Reconstitute exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/internal/motion-program.ts')
          text = path.read_text()
          old = '''  const writers = new Set<string>();
            const surfaceOwners = new Map<string, number>();
            const transformMasks = new Map<number, number>();
            for (let i = 0; i < raw.length; i++) {
              const tuple = snapshotExact(raw[i], 3);
              const subjectSlot = unsignedInteger(tuple[0], UINT16_MAX);
              const channel = parseChannel(tuple[1], stringsLength, features);
              const writerKey = typeof channel === 'number'
                ? `${subjectSlot}:s${channel}`
                : `${subjectSlot}:h${channel[1]}`;
              if (writers.has(writerKey)) fail('LMP_CANONICAL');
              writers.add(writerKey);
              const ownerGroup = unsignedInteger(tuple[2], UINT16_MAX);
              const surface = typeof channel === 'number'
                ? `s${MOTION_PROGRAM_CHANNEL_SURFACE_V1[channel]}`
                : `h${channel[1]}`;
              const surfaceKey = `${subjectSlot}:${surface}`;
              const previousOwner = surfaceOwners.get(surfaceKey);
              if (previousOwner !== undefined && previousOwner !== ownerGroup) fail('LMP_CANONICAL');
              surfaceOwners.set(surfaceKey, ownerGroup);
              if (
                typeof channel === 'number' &&
                channel >= MOTION_PROGRAM_STANDARD_CHANNEL_V1.translateX &&
                channel <= MOTION_PROGRAM_STANDARD_CHANNEL_V1.skewY
              ) {
                const bit = 1 << (channel - MOTION_PROGRAM_STANDARD_CHANNEL_V1.translateX);
                transformMasks.set(subjectSlot, (transformMasks.get(subjectSlot) ?? 0) | bit);
              }
              bindings[i] = Object.freeze([subjectSlot, channel, ownerGroup] as const);
            }
            for (const mask of transformMasks.values()) {
              if (mask !== 0x7f) fail('LMP_CANONICAL');
            }'''
          new = '''  const writers = new Set<number>();
            // Standard writer keys are negative; escaped host keys are non-negative.
            // Both domains are exact integers throughout the complete uint16 input box.
            const transformState = new Map<number, number>();
            for (let i = 0; i < raw.length; i++) {
              const tuple = snapshotExact(raw[i], 3);
              const subjectSlot = unsignedInteger(tuple[0], UINT16_MAX);
              const channel = parseChannel(tuple[1], stringsLength, features);
              const writerKey = typeof channel === 'number'
                ? -(subjectSlot * 12 + channel + 1)
                : subjectSlot * 0x10000 + channel[1];
              if (writers.has(writerKey)) fail('LMP_CANONICAL');
              writers.add(writerKey);
              const ownerGroup = unsignedInteger(tuple[2], UINT16_MAX);
              if (
                typeof channel === 'number' &&
                channel >= MOTION_PROGRAM_STANDARD_CHANNEL_V1.translateX &&
                channel <= MOTION_PROGRAM_STANDARD_CHANNEL_V1.skewY
              ) {
                const bit = 1 << (channel - MOTION_PROGRAM_STANDARD_CHANNEL_V1.translateX);
                const state = transformState.get(subjectSlot);
                if (state !== undefined && (state >>> 7) !== ownerGroup) fail('LMP_CANONICAL');
                transformState.set(subjectSlot, (ownerGroup << 7) | (state ?? 0) | bit);
              }
              bindings[i] = Object.freeze([subjectSlot, channel, ownerGroup] as const);
            }
            for (const state of transformState.values()) {
              if ((state & 0x7f) !== 0x7f) fail('LMP_CANONICAL');
            }'''
          if text.count(old) != 1:
              raise SystemExit(f'candidate application site count={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cp src/internal/motion-program.ts /tmp/candidate-motion-program.ts
          git diff --check

      - name: Numeric writer-key domain oracle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const std = (subject, channel) => -(subject * 12 + channel + 1);
          const host = (subject, index) => subject * 0x10000 + index;
          const seenStandard = new Set();
          for (let subject = 0; subject <= 0xffff; subject++) {
            for (let channel = 0; channel < 12; channel++) {
              const key = std(subject, channel);
              if (!Number.isSafeInteger(key) || key >= 0 || seenStandard.has(key)) throw new Error(`std collision ${subject}/${channel}`);
              seenStandard.add(key);
            }
            for (const index of [0, 1, 0xfffe, 0xffff]) {
              const key = host(subject, index);
              if (!Number.isSafeInteger(key) || key < 0) throw new Error(`host domain ${subject}/${index}`);
              if (subject > 0 && key <= host(subject - 1, 0xffff)) throw new Error(`host interval overlap ${subject}/${index}`);
            }
          }
          if (std(0xffff, 11) === host(0, 0) || std(0, 0) === host(0xffff, 0xffff)) throw new Error('domain collision');
          if (host(0xffff, 0xffff) !== 0xffffffff) throw new Error('host maximum drift');
          console.log(`KEY_ORACLE=GREEN standardKeys=${seenStandard.size} hostMax=${host(0xffff, 0xffff)}`);
          NODE

      - name: Candidate semantic proof
        shell: bash
        run: |
          set -euo pipefail
          pnpm vitest run --reporter=verbose \
            test/motion-program-core-v1.test.ts \
            test/motion-program-semantics-v1.test.ts \
            test/motion-program-wire-v1.test.ts \
            test/compiler-nano-lowering.test.ts
          pnpm typecheck

      - name: Positive control must turn RED
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/internal/motion-program.ts')
          text = path.read_text()
          old = "if (state !== undefined && (state >>> 7) !== ownerGroup) fail('LMP_CANONICAL');"
          new = "if (false) fail('LMP_CANONICAL');"
          if text.count(old) != 1:
              raise SystemExit('positive-control mutation site missing')
          path.write_text(text.replace(old, new))
          PY
          set +e
          pnpm vitest run test/motion-program-core-v1.test.ts -t 'делает transform одним полным surface и не допускает двух owners' > /tmp/mutant.log 2>&1
          status=$?
          set -e
          cat /tmp/mutant.log
          if [[ $status -eq 0 ]]; then
            echo '::error::positive-control mutant survived'
            exit 1
          fi
          echo 'POSITIVE_CONTROL=RED'
          cp /tmp/candidate-motion-program.ts src/internal/motion-program.ts
          git diff --check

      - name: Full local authority
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:static
          pnpm audit --audit-level=high
          pnpm build
          pnpm test
          pnpm size
          pnpm pack:smoke
          pnpm pack:compat

      - name: Publish clean candidate commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = 'research/mp-binding-index-run11'
          rm .github/workflows/research-mp-binding-index.yml
          git add src/internal/motion-program.ts .github/workflows/research-mp-binding-index.yml
          git diff --cached --check
          git config user.name 'Labpics Autoresearch'
          git config user.email 'lemone112@users.noreply.github.com'
          git commit -m 'perf(motion-program): compact binding ownership index'
          git push origin HEAD:research/mp-binding-index-run11
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
