name: R11 reorder orthogonal no-op RED
on:
  push:
    branches: [research/r11-reorder-axis-noop-red-20260914]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/reorder-axis-noop-review.test.ts
