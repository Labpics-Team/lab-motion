name: Presence current candidate source
on:
  push:
    branches: ["research/presence-delivery-381"]
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9d2da978dcdbab8ae9f28a7b0a7fde5c6ce58f9e
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source without writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9d2da978dcdbab8ae9f28a7b0a7fde5c6ce58f9e
          mkdir "$RUNNER_TEMP/presence-source"
          git bundle create "$RUNNER_TEMP/presence-source/source.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/presence-source/revision.txt"
          cd "$RUNNER_TEMP/presence-source"
          sha256sum source.bundle revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: presence-current-source-9d2da978
          path: ${{ runner.temp }}/presence-source/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          overwrite: false
