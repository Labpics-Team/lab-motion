name: R11 reorder projection frame ownership
on:
  push:
    branches: [research/r11-reorder-frame-owner-20260914]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/r11-wave-b-378
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "06e870c6184ba39324957dbb1583c2d55f5c19a0"
          git fetch --no-tags --depth=1 origin 8c068e5a93f86157b32ac062f884166368f6b212
          git show 8c068e5a93f86157b32ac062f884166368f6b212:scripts/research-r11-reorder-frame-owner.py > /tmp/reorder-fix.py
          python3 /tmp/reorder-fix.py
          git diff --check
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: Verify affected closure
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run test/projection-driver.test.ts test/projection-dom.test.ts test/reorder.test.ts
          pnpm typecheck
      - name: Commit exact fix to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/projection/driver.ts test/projection-driver.test.ts
          git commit -m 'fix(projection): coalesce retarget frame reservation'
          git push origin HEAD:integrate/r11-wave-b-378
