  tag:
    name: Create verified re lease tag
    needs: [resolve, verify]
    if : >-
      github.repository == 'Labpics-Team /lab-motion' && !cancelled() &&
      needs.r esolve.result == 'success' && needs.verify.re sult == 'success'
    runs-on: ubuntu-latest
     timeout-minutes: 5
    permissions:
      c ontents: write
    env:
      RELEASE_TAG: ${ { needs.resolve.outputs.release_tag }}
       EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs .source_sha }}

    steps:
      # После  всех гейтов, но до выдач� � OIDC, фиксируем точный ref.
       # Сбой npm оставит пров� �ренный тег, который безо пасно переиспользует rerun .
      - name: Create or verify tag idempote ntly
        shell: bash
        env:
           GH_TOKEN: ${{ github.token }}
        run:  |
          OWNER="${GITHUB_REPOSITORY%%/*}" 
          REPOSITORY_NAME="${GITHUB_REPOSITO RY#*/}"
          EXISTING_REF=$(
             # $owner/$name/$qualifiedName ниже пр� �надлежат GraphQL, а не shell.
             # shellcheck disable=SC2016
             gh api graphql \
              -f query=' query($owner: String!, $name: String!, $quali fiedName: String!) {
                reposito ry(owner: $owner, name: $name) {
                   ref(qualifiedName: $qualifiedName) { ta rget { __typename oid } }
                }
               }' \
              -F owner="$OW NER" \
              -F name="$REPOSITORY_NAM E" \
              -F qualifiedName="refs/tag s/$RELEASE_TAG" \
              --jq '(.data. repository.ref.target // empty) | [.__typenam e, .oid] | @tsv'
          )
          if [[  -z "$EXISTING_REF" ]]; then
            # К� �нкурентный job мог создат ь ref после lookup. В любом ис� �оде
            # create перечиты ваем серверное состояни� � и принимаем только наш S HA.
            if ! gh api "repos/$GITHUB_RE POSITORY/git/refs" \
              -f ref="re fs/tags/$RELEASE_TAG" -f sha="$EXPECTED_SOURC E_SHA"; then
              echo "::warning::� �оздание $RELEASE_TAG не подтв� �рждено; проверяем итого� �ый ref"
            fi
            # refs  API не гарантирует read-after-wr ite: свежий ref может
             # читаться как 404 с реплик и (падение run 30892921662). Огра ниченный
            # retry сохр аняет fail-closed: после исчер пания попыток шаг падает .
            for _ in {1..5}; do
               if EXISTING_REF=$(gh api "repos/$GITHUB_RE POSITORY/git/ref/tags/$RELEASE_TAG" \
                 --jq '[.object.type, .object.sha] |  @tsv' 2>/dev/null); then
                brea k
              fi
              sleep 0.5
             done
            [[ -n "$EXISTING_R EF" ]] \
              || { echo "::error::$R ELEASE_TAG создан, но не читае тся после повторных попы ток"; exit 1; }
          fi

          re ad -r OBJECT_TYPE OBJECT_SHA <<< "$EXISTING_R EF"
          case "$OBJECT_TYPE" in
             Commit) OBJECT_TYPE=commit ;;
             Tag) OBJECT_TYPE=tag ;;
          esac
           for _ in {1..8}; do
            if [[ "$ OBJECT_TYPE" == "commit" ]]; then
               EXISTING="$OBJECT_SHA"
              break 
            fi
            [[ "$OBJECT_TYPE"  == "tag" ]] \
              || { echo "::err or::тег указывает на недоп устимый объект $OBJECT_TYPE"; ex it 1; }
            read -r OBJECT_TYPE OBJEC T_SHA < <(
              gh api "repos/$GITHU B_REPOSITORY/git/tags/$OBJECT_SHA" \
                 --jq '[.object.type, .object.sha] | @ tsv'
            )
          done
          [ [ "${EXISTING:-}" == "$EXPECTED_SOURCE_SHA" ] ] \
            || { echo "::error::$RELEASE_ TAG указывает на ${EXISTING:-unkno wn}"; exit 1; }
          echo "$RELEASE_TAG  зафиксирован на провере� �ном коммите"

