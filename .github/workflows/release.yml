name: Release

on:
  workflow_dispatch:
    i nputs:
      version:
        description: "� �ерсия x.y.z — тег v<version> бу� �ет создан из HEAD main"
        re quired: true
        type: string

# Кажд ый job объявляет только со бственные полномочия.
perm issions: {}

concurrency:
  # Весь пак ет имеет одну очередь: ра зные версии не должны го� �яться за npm latest.
  group: release -labpics-motion
  cancel-in-progress: false

 env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
   COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  # � �начала фиксируем намере ние релиза без права мен� �ть репозиторий.
  resolve:
     if: github.repository == 'Labpics-Team/lab-mo tion'
    runs-on: ubuntu-latest
    timeout-mi nutes: 5
    permissions:
      contents: rea d
    outputs:
      release_tag: ${{ steps.r esolve.outputs.release_tag }}
      release_d ate: ${{ steps.resolve.outputs.release_date } }
      version: ${{ steps.resolve.outputs.ve rsion }}
      source_sha: ${{ steps.resolve. outputs.source_sha }}
    steps:
      - name : Resolve and validate version
        id: re solve
        env:
          INPUT_VERSION: $ {{ inputs.version }}
          GH_TOKEN: ${{  github.token }}
        run: |
          VERS ION="$INPUT_VERSION"
          [[ "$GITHUB_RE F" == "refs/heads/main" ]] \
            || {  echo "::error::релиз разрешён � �олько ручным запуском с  main, получено: $GITHUB_REF"; exit 1;  }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+ \.[0-9]+$ ]] \
            || { echo "::error ::version обязана быть x.y.z, по лучено: $VERSION"; exit 1; }
           RELEASE_TAG="v$VERSION"
          SOURCE_SHA= "$GITHUB_SHA"
          # Повторный  диспатч после сбоя downstream -job: существующий тег —
           # источник истины рел иза (теги v*.*.* неизменяем� � ruleset).
          # HEAD main мог уй ти вперёд: расхождение с  тегом — не ошибка, а rerun.
           TAG_REF=$(gh api "repos/$GITHUB_REPO SITORY/git/ref/tags/$RELEASE_TAG" \
             --jq '[.object.type, .object.sha] | @tsv'  2>/dev/null || true)
          if [[ -n "$TAG _REF" ]]; then
            read -r OBJECT_TYP E OBJECT_SHA <<< "$TAG_REF"
            for _  in {1..8}; do
              if [[ "$OBJECT_T YPE" == "commit" ]]; then
                TAG _SOURCE_SHA="$OBJECT_SHA"
                bre ak
              fi
              [[ "$OBJECT _TYPE" == "tag" ]] \
                || { ech o "::error::$RELEASE_TAG указывает � �а недопустимый объект $OB JECT_TYPE"; exit 1; }
              read -r O BJECT_TYPE OBJECT_SHA < <(
                gh  api "repos/$GITHUB_REPOSITORY/git/tags/$OBJE CT_SHA" \
                  --jq '[.object.ty pe, .object.sha] | @tsv'
              )
             done
            [[ -n "${TAG_SOURCE_ SHA:-}" ]] \
              || { echo "::error ::$RELEASE_TAG не раскрывается  в commit"; exit 1; }
            if [[ "$TAG _SOURCE_SHA" != "$GITHUB_SHA" ]]; then
               echo "::warning::$RELEASE_TAG уже  существует на $TAG_SOURCE_SHA; р елиз сверяется с тегом в� �есто HEAD main $GITHUB_SHA"
             fi
            SOURCE_SHA="$TAG_SOURCE_SHA"
           fi
          {
            echo "rel ease_tag=$RELEASE_TAG"
            echo "rele ase_date=$(date -u +%F)"
            echo "ve rsion=$VERSION"
            echo "source_sha= $SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
 
  verify:
    name: Verify and seal npm pack age
    needs: [resolve]
    if: >-
      git hub.repository == 'Labpics-Team/lab-motion' & & !cancelled() &&
      needs.resolve.result  == 'success'
    runs-on: ubuntu-latest
    tim eout-minutes: 45
    permissions:
      conte nts: read
    env:
      RELEASE_TAG: ${{ nee ds.resolve.outputs.release_tag }}
      RELEA SE_DATE: ${{ needs.resolve.outputs.release_da te }}
      EXPECTED_SOURCE_SHA: ${{ needs.re solve.outputs.source_sha }}
    outputs:
       source_sha: ${{ steps.source.outputs.source _sha }}
      artifact_name: ${{ steps.source .outputs.artifact_name }}
      tarball_name:  ${{ steps.seal.outputs.tarball_name }}
       tarball_sha256: ${{ steps.seal.outputs.tarba ll_sha256 }}
      package_identity: ${{ step s.seal.outputs.package_identity }}
      arti fact_id: ${{ steps.upload.outputs.artifact-id  }}
      artifact_digest: ${{ steps.upload.o utputs.artifact-digest }}

    steps:
      -  name: Checkout
        uses: actions/checkou t@3d3c42e5aac5ba805825da76410c181273ba90b1 #  v7.0.1
        with:
          ref: ${{ needs .resolve.outputs.source_sha }}
          fetc h-depth: 0
          persist-credentials: fal se

      - name: Setup Node
        uses: ac tions/setup-node@820762786026740c76f36085b0ef c47a31fe5020 # v7.0.0
        with:
           node-version: "24"
          package-manager -cache: false

      - name: Activate pinned  pnpm
        run: |
          corepack enable 
          corepack install --global pnpm@11. 11.0

      # Проверяем фактич ески извлечённый коммит  до появления релизного т ега.
      - name: Verify release source
         id: source
        run: |
          gi t fetch origin main --quiet
          SOURCE_ SHA=$(git rev-parse HEAD)
          [[ "$SOUR CE_SHA" == "$EXPECTED_SOURCE_SHA" ]] \
             || { echo "::error::извлечён $S OURCE_SHA вместо ожидаемого $ EXPECTED_SOURCE_SHA"; exit 1; }
          git  merge-base --is-ancestor "$SOURCE_SHA" origi n/main \
            || { echo "::error::ре лизный коммит находится  вне main"; exit 1; }
          echo "sourc e_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
           echo "artifact_name=npm-package-$SOURCE_S HA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$G ITHUB_OUTPUT"

      - name: Install dependen cies
        run: pnpm install --frozen-lockf ile

      - name: Static contract
        ru n: pnpm check:static

      - name: Verify re lease identity
        run: node scripts/chec k-release.mjs "$RELEASE_TAG" "$RELEASE_DATE"
 
      - name: Issue forms schema
        run : node scripts/check-issue-forms.mjs

      -  name: Build
        run: pnpm build

      -  name: Install browser conformance engines
         run: pnpm exec playwright install --wit h-deps chromium firefox webkit

      - name:  Browser conformance
        run: pnpm test:b rowser:all

      - name: Factual documentati on drift
        run: node scripts/check-docs -facts.mjs

      - name: Test
        run: p npm test

      - name: Fuzz finiteness gate
         run: pnpm vitest run --reporter=verbo se test/*finiteness-fuzz.test.ts

      - nam e: Size gate
        run: pnpm size

      #  Кандидат создаётся один  раз. Все следующие прове� �ки читают именно его;
       # повторная упаковка пер ед publish запрещена.
      - name : Pack release candidate once
        id: pac k
        shell: bash
        run: |
           mkdir release-artifact
          pnpm pack  --pack-destination release-artifact
           shopt -s nullglob
          archives=(releas e-artifact/*.tgz)
          [[ ${#archives[@] } -eq 1 ]] \
            || { echo "::error:: ожидался ровно один tgz, н� �йдено: ${#archives[@]}"; exit 1; }
           echo "tarball_name=$(basename "${archiv es[0]}")" >> "$GITHUB_OUTPUT"

      - name:  Pack smoke on release candidate
        env:
           TARBALL: release-artifact/${{ steps .pack.outputs.tarball_name }}
        run: no de scripts/pack-smoke.mjs "$TARBALL"

      -  name: Consumer compatibility on release cand idate
        env:
          TARBALL: release -artifact/${{ steps.pack.outputs.tarball_name  }}
        run: node scripts/pack-compat.mjs  "$TARBALL"

      # pnpm 11 сам треб� �ет более новый patch Node 22, п оэтому floor-проверка
      # � �олучает уже собранный tgz  и исполняет только consumer  runtime.
      - name: Setup exact consumer N ode floor
        uses: actions/setup-node@82 0762786026740c76f36085b0efc47a31fe5020 # v7.0 .0
        with:
          node-version: "22. 0.0"
          package-manager-cache: false

       - name: Exact Node 22.0 artifact smoke
         env:
          TARBALL: release-artif act/${{ steps.pack.outputs.tarball_name }}
         run: node scripts/pack-smoke.mjs "$TARB ALL"

      # После consumer-гейто� � фиксируем идентичность  ровно тех байтов, которы е
      # upload-artifact передаст p ublish-job.
      - name: Seal release artifa ct identity
        id: seal
        env:
           SOURCE_SHA: ${{ steps.source.outputs.s ource_sha }}
          TARBALL: release-artif act/${{ steps.pack.outputs.tarball_name }}
         run: |
          node scripts/check-rel ease-artifact.mjs \
            "$TARBALL" "$ RELEASE_TAG" "$SOURCE_SHA" \
            rele ase-artifact/release-manifest.json >> "$GITHU B_OUTPUT"

      - name: Upload sealed packag e
        id: upload
        uses: actions/up load-artifact@043fb46d1a93c77aae656e7c1c64a87 5d1fc6a0a # v7.0.1
        with:
          na me: ${{ steps.source.outputs.artifact_name }} 
          path: release-artifact/
           if-no-files-found: error
          retention- days: 7
          compression-level: 0
           overwrite: false
          include-hidden -files: false

  publish:
    name: Publish s ealed npm package
    concurrency:
      grou p: npm-publish-${{ needs.resolve.outputs.rele ase_tag }}
      cancel-in-progress: false
     needs: [resolve, verify, tag]
    if: >-
       github.repository == 'Labpics-Team/lab-mo tion' && !cancelled() &&
      needs.resolve. result == 'success' && needs.verify.result ==  'success' &&
      needs.tag.result == 'succ ess'
    runs-on: ubuntu-latest
    timeout-min utes: 10
    environment: npm
    permissions :
      actions: read
      contents: read
       id-token: write
    env:
      RELEASE_TA G: ${{ needs.resolve.outputs.release_tag }}
       EXPECTED_SOURCE_SHA: ${{ needs.verify.ou tputs.source_sha }}
      EXPECTED_TARBALL_NA ME: ${{ needs.verify.outputs.tarball_name }}
       EXPECTED_TARBALL_SHA256: ${{ needs.veri fy.outputs.tarball_sha256 }}
      EXPECTED_P ACKAGE_IDENTITY: ${{ needs.verify.outputs.pac kage_identity }}
      EXPECTED_ARTIFACT_ID:  ${{ needs.verify.outputs.artifact_id }}
       EXPECTED_ARTIFACT_NAME: ${{ needs.verify.out puts.artifact_name }}
      EXPECTED_ARTIFACT _DIGEST: ${{ needs.verify.outputs.artifact_di gest }}

    steps:
      - name: Setup Node  for npm trusted publishing
        uses: acti ons/setup-node@820762786026740c76f36085b0efc4 7a31fe5020 # v7.0.0
        with:
          n ode-version: "24"
          registry-url: htt ps://registry.npmjs.org
          package-man ager-cache: false

      - name: Download sea led package by artifact ID
        uses: acti ons/download-artifact@3e5f45b2cfb9172054b4087 a40e8e0b5a5461e7c # v8.0.1
        with:
           artifact-ids: ${{ needs.verify.outputs. artifact_id }}
          path: release-artifa ct
          merge-multiple: true
          d igest-mismatch: error

      # Хеш арх� �ва GitHub защищает транспо� �т, хеш tgz — публикуемые б айты.
      - name: Verify artifact trans port, digest and identity
        shell: bash 
        env:
          GH_TOKEN: ${{ github. token }}
        run: |
          [[ "$EXPECT ED_ARTIFACT_ID" =~ ^[0-9]+$ ]] \
             || { echo "::error::некорректный  идентификатор артефакта "; exit 1; }
          [[ "$EXPECTED_ARTIFACT _DIGEST" =~ ^[0-9a-f]{64}$ ]] \
            | | { echo "::error::некорректный � �еш артефакта"; exit 1; }
           IFS=$'\t' read -r API_DIGEST API_NAME < <(
             gh api "repos/$GITHUB_REPOSITORY/ actions/artifacts/$EXPECTED_ARTIFACT_ID" \
               --jq '[.digest // "", .name // "" ] | @tsv'
          )
          [[ "${API_DIG EST#sha256:}" == "$EXPECTED_ARTIFACT_DIGEST"  ]] \
            || { echo "::error::хеш � �ртефакта в API не совпада� �т с выходом verify job"; exit 1; }
           [[ "$API_NAME" == "$EXPECTED_ARTIFA CT_NAME" ]] \
            || { echo "::error: :имя артефакта в API не сов падает с выходом verify job"; e xit 1; }

          mapfile -t files < <(find  release-artifact -type f -print | sort)
           [[ ${#files[@]} -eq 2 ]] \
             || { echo "::error::артефакт обяз ан содержать ровно tgz и м� �нифест"; exit 1; }
          [[ -z "$( find release-artifact -type l -print -quit)"  ]] \
            || { echo "::error::арте факт не должен содержать  ссылки"; exit 1; }
          [[ ! -L r elease-artifact/release-manifest.json ]] \
             || { echo "::error::манифес� � не может быть ссылкой"; e xit 1; }
          TARBALL="release-artifact/ $EXPECTED_TARBALL_NAME"
          [[ -f "$TAR BALL" && ! -L "$TARBALL" ]] \
            ||  { echo "::error::ожидаемый tgz от� �утствует или является с� �ылкой"; exit 1; }
          ACTUAL_SHA2 56=$(sha256sum "$TARBALL" | cut -d' ' -f1)
           [[ "$ACTUAL_SHA256" == "$EXPECTED_TAR BALL_SHA256" ]] \
            || { echo "::er ror::SHA-256 tgz не совпадает с � �роверенным"; exit 1; }

           node --input-type=module <<'NODE'
          i mport { readFileSync } from 'node:fs';

           const fail = (message) => {
             console.error(`::error::${message}`);
             process.exit(1);
          };
           const manifest = JSON.parse(readFileSync('rel ease-artifact/release-manifest.json', 'utf8') );
          if (manifest.schema !== 1) fail( 'неподдерживаемая схема  release-манифеста');
          if (m anifest.release?.tag !== process.env.RELEASE_ TAG) fail('тег манифеста не с� �впадает');
          if (manifest.rel ease?.sourceSha !== process.env.EXPECTED_SOUR CE_SHA) fail('source SHA манифеста � �е совпадает');
          if (manif est.package?.identity !== process.env.EXPECTE D_PACKAGE_IDENTITY) fail('идентично� �ть пакета не совпадает'); 
          if (manifest.artifact?.file !== pr ocess.env.EXPECTED_TARBALL_NAME) fail('имя  tgz манифеста не совпадае т');
          if (manifest.artifact?.sha256  !== process.env.EXPECTED_TARBALL_SHA256) fai l('digest tgz манифеста не сов� �адает');
          NODE

      - name:  Verify npm supports trusted publishing
         shell: bash
        run: |
          node - -input-type=module <<'NODE'
          import  { execFileSync } from 'node:child_process';
           const raw = execFileSync('npm', ['-- version'], { encoding: 'utf8' }).trim();
           const [major, minor, patch] = raw.split ('.').map(Number);
          const supported  = major > 11 || (major === 11 && (minor > 5 | | (minor === 5 && patch >= 1)));
          if  (!supported) {
            console.error(`np m ${raw} не поддерживает truste d publishing; требуется >= 11.5.1`); 
            process.exit(1);
          }
           console.log(`npm ${raw}: trusted publi shing поддержан`);
          NODE

       # Tag-job уже зафиксирова� � ref без OIDC. Перед публика� �ией
      # повторно читаем  серверное состояние и п� �инимаем только наш SHA.
       - name: Verify locked release tag binding
         shell: bash
        env:
          GH_ TOKEN: ${{ github.token }}
        run: |
           OWNER="${GITHUB_REPOSITORY%%/*}"
           REPOSITORY_NAME="${GITHUB_REPOSITORY#*/} "
          EXISTING_REF=$(
            # $ow ner/$name/$qualifiedName ниже прина� �лежат GraphQL, а не shell.
             # shellcheck disable=SC2016
            gh  api graphql \
              -f query='query( $owner: String!, $name: String!, $qualifiedNa me: String!) {
                repository(own er: $owner, name: $name) {
                   ref(qualifiedName: $qualifiedName) { target {  __typename oid } }
                }
               }' \
              -F owner="$OWNER" \ 
              -F name="$REPOSITORY_NAME" \
               -F qualifiedName="refs/tags/$REL EASE_TAG" \
              --jq '(.data.reposi tory.ref.target // empty) | [.__typename, .oi d] | @tsv'
          )
          if [[ -z "$E XISTING_REF" ]]; then
            echo "::err or::$RELEASE_TAG не создан tag-job"
             exit 1
          fi

          rea d -r OBJECT_TYPE OBJECT_SHA <<< "$EXISTING_RE F"
          case "$OBJECT_TYPE" in
             Commit) OBJECT_TYPE=commit ;;
             Tag) OBJECT_TYPE=tag ;;
          esac
           for _ in {1..8}; do
            if [[ "$O BJECT_TYPE" == "commit" ]]; then
               EXISTING="$OBJECT_SHA"
              break
             fi
            [[ "$OBJECT_TYPE"  == "tag" ]] \
              || { echo "::erro r::тег указывает на недоп� �стимый объект $OBJECT_TYPE"; exi t 1; }
            read -r OBJECT_TYPE OBJECT _SHA < <(
              gh api "repos/$GITHUB _REPOSITORY/git/tags/$OBJECT_SHA" \
                 --jq '[.object.type, .object.sha] | @t sv'
            )
          done
          [[  -n "${EXISTING:-}" ]] \
            || { ech o "::error::не удалось раскры� �ь $RELEASE_TAG до commit"; exit 1; }
           [[ "$EXISTING" == "$EXPECTED_SOURCE_SHA " ]] \
            || { echo "::error::$RELEA SE_TAG уже указывает на $EXISTI NG"; exit 1; }
          echo "$RELEASE_TAG � �же указывает на провере� �ный коммит"

      - name: Publish  or reconcile verified tarball through npm OID C
        env:
          TARBALL: ./release-a rtifact/${{ needs.verify.outputs.tarball_name  }}
        run: |
          node --input-typ e=module <<'NODE'
          import { execFile Sync } from 'node:child_process';
          i mport { createHash } from 'node:crypto';
           import { readFileSync } from 'node:fs'; 
          import { setTimeout as delay } fro m 'node:timers/promises';

          const fa il = (message) => {
            throw new Err or(message);
          };
          const ide ntity = process.env.EXPECTED_PACKAGE_IDENTITY ;
          const separator = identity.lastIn dexOf('@');
          if (separator <= 0) fai l(`некорректная идентичн� �сть пакета: ${identity}`);
           const name = identity.slice(0, separator);
           const version = identity.slice(sepa rator + 1);
          const integrity = `sha5 12-${createHash('sha512')
            .update (readFileSync(process.env.TARBALL))
             .digest('base64')}`;
          const prove nanceType = 'https://slsa.dev/provenance/v1'; 
          const packageUrl = `https://regist ry.npmjs.org/${encodeURIComponent(name)}`;
           const registryUrl = `${packageUrl}/${ encodeURIComponent(version)}`;

          fun ction stableVersion(value, label) {
             const match = /^(\d+)\.(\d+)\.(\d+)$/.exec (value);
            if (!match) fail(`${labe l} не является стабильной  версией x.y.z: ${String(value)}`);
             return match.slice(1).map((part) =>  BigInt(part));
          }

          functi on compareVersions(left, right) {
             for (let index = 0; index < left.length; ind ex++) {
              if (left[index] < right [index]) return -1;
              if (left[in dex] > right[index]) return 1;
            }
             return 0;
          }

           const candidate = stableVersion(version, 'к� �ндидат');

          async function lo okupLatest() {
            const response = a wait fetch(`${packageUrl}?latest=${Date.now() }`, {
              cache: 'no-store',
               headers: { accept: 'application/json'  },
            });
            if (response. status === 404) return null;
            if ( !response.ok) fail(`npm packument ответ� �л ${response.status}`);
            const p ackument = await response.json();
             const raw = packument['dist-tags']?.latest;
             if (typeof raw !== 'string') fail ('npm packument не содержит dist-ta gs.latest');
            return { raw, parsed : stableVersion(raw, 'npm latest') };
           }

          async function lookupVersion( ) {
            const response = await fetch( `${registryUrl}?reconcile=${Date.now()}`, {
               cache: 'no-store',
               headers: { accept: 'application/json' },
             });
            if (response.status  === 404) return null;
            if (!respon se.ok) fail(`npm registry ответил ${re sponse.status}`);
            return response .json();
          }

          function asse rtPublishPreflight(latest) {
            if ( latest === null) return;
            if (comp areVersions(candidate, latest.parsed) <= 0) { 
              fail(`новый кандид� �т ${version} должен быть стро го выше npm latest ${latest.raw} и н� � может откатить npm latest`);
             }
          }

          async fun ction reconcile(attempts, mode) {
             if (mode !== 'idempotent' && mode !== 'publi shed') fail(`неизвестный режи� � reconcile: ${mode}`);
            for (let  attempt = 1; attempt <= attempts; attempt++)  {
              const [metadata, latest] = aw ait Promise.all([lookupVersion(), lookupLates t()]);
              if (metadata !== null) { 
                const published = metadata.d ist?.integrity;
                if (published  !== integrity) {
                  fail(`в� �рсия уже существует с др угим integrity: ${String(published)}`);
                 }
                const proven anceReady =
                  metadata.dist?. attestations?.provenance?.predicateType === p rovenanceType &&
                  typeof met adata.dist?.attestations?.url === 'string';
                 if (latest !== null) {
                   const comparison = compareVersions (latest.parsed, candidate);
                   if (mode === 'published') {
                     if (comparison >= 0 && provenanceReady) { 
                      if (comparison > 0) {
                         console.log(
                           `${identity}: моното� �ная конкурентная публик ация подняла npm latest ` +
                           `до ${latest.raw}; ка ндидат ${version} проверен и � �е требует retag`,
                         );
                      }
                       return true;
                    }
                   }
                  if (mod e === 'idempotent') {
                    if  (comparison < 0) {
                      fail (`idempotent latest ниже кандидат а: ${latest.raw} < ${version}`);
                     }
                    if (provenance Ready) return true;
                  }
                 }
              }
              if  (attempt < attempts) await delay(5_000);
             }
            return false;
           }

          const existing = await lookupV ersion();
          if (existing !== null) {
             if (await reconcile(12, 'idempote nt')) {
              console.log(`${identity } уже опубликован с прове ренными байтами, provenance и  latest не ниже кандидата`);
               process.exit(0);
            }
             fail(`${identity}: idempotent regis try state не подтвердился`);
           }

          await assertPublishPrefl ight(await lookupLatest());

          let pu blishError;
          try {
            execF ileSync(
              'npm',
              [ 'publish', process.env.TARBALL, '--registry=h ttps://registry.npmjs.org', '--tag', 'latest' , '--access', 'public', '--provenance', '--ig nore-scripts'],
              { stdio: 'inher it' },
            );
          } catch (erro r) {
            publishError = error;
           }

          if (await reconcile(12, 'pub lished')) {
            console.log(`${identi ty}: registry integrity, provenance и мон отонный latest подтвержден� �`);
            process.exit(0);
          } 
          if (publishError) throw publishErr or;
          fail(`${identity}: registry н� � подтвердил integrity, provenance  и монотонный latest после npm  publish`);
          NODE

      - name: Ver ify registry provenance statement and signatu res
        env:
          EXPECTED_RUN_SHA:  ${{ github.sha }}
          GH_TOKEN: ${{ git hub.token }}
          TARBALL: ./release-art ifact/${{ needs.verify.outputs.tarball_name } }
        run: |
          node --input-type= module <<'NODE'
