name: Documentation

on:
  workflow_call:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"
  DOCS_BASE: /docs-preview/

jobs:
  reader:
    name: build and reader journeys
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        shell: bash
        run: pnpm docs:build

      # Браузеры и системные зависимости уже есть в закреплённом runtime.
      - name: Reader journeys
        shell: bash
        run: pnpm docs:test

