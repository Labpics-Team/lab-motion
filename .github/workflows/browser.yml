name: Browser conformance

# Browser matrix (issue #102, фаза D): сверка СОБРАННОГО dist с реальным
# поведением трёх движков (Chromium/Firefox/WebKit). Гейт запускается для каждого
# PR через граф ci.yml; результат входит в общий required check. Артефакты
# (trace/video) выгружаются только при сбое.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  conformance:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Токен не нужен после checkout (пуша нет) — не оставляем его на диске
          # перед pnpm install (postinstall-скрипты третьих сторон). SAST: artipacked.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Устанавливаем ТОЛЬКО нужный движок матрицы (+ системные зависимости).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Типопроверка browser-спеков (отдельный tsconfig: DOM lib + /dist/*→src/*
      # path-mapping) — специфичный tsc не входит в основной `pnpm typecheck`.
      - name: Typecheck browser specs
        run: pnpm typecheck:browser

      # Спеки грузят СОБРАННЫЕ library dist и showcase site/dist — канонический
      # producer обязан завершиться до Playwright в каждом движке матрицы.
      - name: Build library and showcase
        run: pnpm site:build

      - name: Run conformance (${{ matrix.browser }})
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      # Temporary PROFILE-01 evidence carrier inside the already-required browser
      # graph. It is removed after the raw receipt is captured.
      - name: PROFILE-01 coarse differential pilot
        if: ${{ matrix.browser == 'chromium' && github.event_name == 'pull_request' && github.event.pull_request.number == 412 }}
        shell: bash
        env:
          PROFILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROFILE_PREREG_SHA: a64353ca458ff7cb43f636f5217ca6b2a501f477
          PROFILE_BASELINE_SHA: fe11daa407de396fad952be7679650f63dabd4dd
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/profile-differential-evidence"
          baseline="$RUNNER_TEMP/profile-baseline"
          mkdir -p "$out"
          printf '%s\n' "$PROFILE_HEAD_SHA" > "$out/research-head.txt"
          printf '%s\n' "$PROFILE_PREREG_SHA" > "$out/prereg-head.txt"
          printf '%s\n' "$PROFILE_BASELINE_SHA" > "$out/baseline-head.txt"

          git fetch --no-tags origin "$PROFILE_PREREG_SHA" "$PROFILE_BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$PROFILE_HEAD_SHA"
          git merge-base --is-ancestor "$PROFILE_PREREG_SHA" "$PROFILE_HEAD_SHA"
          git diff --exit-code "$PROFILE_PREREG_SHA" "$PROFILE_HEAD_SHA" -- bench/profile/differential-preregistration.mjs

          pnpm --dir bench/compare install --frozen-lockfile
          pnpm --dir bench/compare exec playwright install --with-deps chromium firefox webkit
          node bench/profile/capture-desktop.mjs > "$out/inventory.json"

          git worktree add --detach "$baseline" "$PROFILE_BASELINE_SHA"
          (
            cd "$baseline"
            test "$(git rev-parse HEAD)" = "$PROFILE_BASELINE_SHA"
            corepack enable
            corepack install --global pnpm@11.11.0
            pnpm install --frozen-lockfile
            pnpm build
          )

          PROFILE_INVENTORY_PATH="$out/inventory.json" \
          PROFILE_BASELINE_DIR="$baseline" \
          PROFILE_DIFFERENTIAL_OUTPUT="$out/differential-pilot.json" \
          PROFILE_HARNESS_REVISION="$PROFILE_HEAD_SHA" \
          PROFILE_DIFFERENTIAL_PREREG_REVISION="$PROFILE_PREREG_SHA" \
            node bench/profile/differential-pilot-desktop.mjs > "$out/differential-pilot.stdout.json"

          sha256sum "$out/inventory.json" "$out/differential-pilot.json" > "$out/SHA256SUMS"

      - name: Upload PROFILE-01 coarse differential raw evidence
        if: ${{ always() && matrix.browser == 'chromium' && github.event_name == 'pull_request' && github.event.pull_request.number == 412 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-01-coarse-differential-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-differential-evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          overwrite: false

      # Trace/video/screenshot пишутся только on-failure (playwright.config) —
      # выгружаем их лишь когда шаг упал.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-conformance-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
