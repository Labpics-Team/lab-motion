name: Browser conformance

# Browser matrix (issue #102, фаза D): сверка СОБРАННОГО dist с реальным
# поведением трёх движков (Chromium/Firefox/WebKit). Гейт запускается для каждого
# PR через граф ci.yml; результат входит в общий required check. Артефакты
# (trace/video) выгружаются только при сбое.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  conformance:
    name: ${{ matrix.browser }} · ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Один browser worker на машине сохраняет изоляцию freeze/RAF-проверок.
      # Делим только измеренный критический путь; полный CI занимает до 8 jobs одновременно.
      max-parallel: 4
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 1 }
          - { browser: firefox, shard: 1, shards: 1 }
          - { browser: webkit, shard: 1, shards: 2 }
          - { browser: webkit, shard: 2, shards: 2 }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен не нужен после checkout (пуша нет) — не оставляем его на диске
          # перед pnpm install (postinstall-скрипты третьих сторон). SAST: artipacked.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Устанавливаем ТОЛЬКО нужный движок матрицы (+ системные зависимости).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Типопроверка browser-спеков (отдельный tsconfig: DOM lib + /dist/*→src/*
      # path-mapping) — специфичный tsc не входит в основной `pnpm typecheck`.
      - name: Typecheck browser specs
        run: pnpm typecheck:browser

      - name: Build library
        run: pnpm build

      - name: Run conformance (${{ matrix.browser }})
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --fail-on-flaky-tests

      # Trace/video/screenshot пишутся только on-failure (playwright.config) —
      # выгружаем их лишь когда шаг упал.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-conformance-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
