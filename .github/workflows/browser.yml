name: Browser conformance

# Browser matrix ( issue #102, фаза D): сверка СОБ� �АННОГО dist с реальным
# по ведением трёх движков (Chr omium/Firefox/WebKit). Гейт запуск� �ется для каждого
# PR: require d check не должен исчезать и з-за paths-фильтра. Артефак� �ы
# (trace/video) выгружаются т олько при сбое.

on:
  push:
     branches: ["main"]
  pull_request:
    branch es: ["main"]
  merge_group:
  workflow_dispat ch:

permissions:
  contents: read

concurren cy:
  group: browser-${{ github.workflow }}-$ {{ github.event.pull_request.number || github .ref }}
  cancel-in-progress: ${{ github.ref  != 'refs/heads/main' }}

env:
  COREPACK_ENAB LE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO _LATEST: "0"

jobs:
  conformance:
    name:  ${{ matrix.browser }}
    runs-on: self-hoste d
    timeout-minutes: 25
    strategy:
       fail-fast: false
      matrix:
        brows er: [chromium, firefox, webkit]

    steps:
       - name: Checkout
        uses: actions/c heckout@3d3c42e5aac5ba805825da76410c181273ba9 0b1 # v7
        with:
          # Токен  не нужен после checkout (пуш� � нет) — не оставляем его  на диске
          # перед pnpm i nstall (postinstall-скрипты треть их сторон). SAST: artipacked.
           persist-credentials: false

      - name:  Setup Node
        uses: actions/setup-node@8 20762786026740c76f36085b0efc47a31fe5020 # v6
         with:
          node-version: "24"

       - name: Activate pinned pnpm
        run : |
          corepack enable
          corep ack install --global pnpm@11.11.0

      - na me: Install dependencies
        run: pnpm in stall --frozen-lockfile

      # Устана вливаем ТОЛЬКО нужный дв ижок матрицы (+ системные  зависимости).
      - name: Insta ll Playwright browser
        run: pnpm exec  playwright install --with-deps ${{ matrix.bro wser }}

      # Типопроверка bro wser-спеков (отдельный tsconfi g: DOM lib + /dist/*→src/*
      # path-map ping) — специфичный tsc не в� �одит в основной `pnpm typecheck `.
      - name: Typecheck browser specs
         run: pnpm typecheck:browser

      # Сп еки грузят СОБРАННЫЕ librar y dist и showcase site/dist — канони ческий
      # producer обязан з авершиться до Playwright в ка� �дом движке матрицы.
      -  name: Build library and showcase
        run:  pnpm site:build

      - name: Run conforman ce (${{ matrix.browser }})
        run: pnpm  exec playwright test --project=${{ matrix.bro wser }}

      # Trace/video/screenshot пи� �утся только on-failure (playwright .config) —
      # выгружаем их  лишь когда шаг упал.
      -  name: Upload failure artifacts
        if: fa ilure()
        uses: actions/upload-artifact @043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v 7
        with:
          name: browser-confo rmance-${{ matrix.browser }}-${{ github.run_i d }}
          path: |
            test-resul ts/
            playwright-report/
           if-no-files-found: ignore
          retention -days: 7
 