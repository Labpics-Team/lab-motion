name: Mutation

on:
  # A relevant PR pays only for the bounded driver campaign. The broad numerical
  # core remains scheduled/manual because it is intentionally much heavier.
  pull_request:
    paths:
      - "src/driver.ts"
      - "test/driver-*.test.ts"
      - "test/reduced-motion-policy.test.ts"
      - "test/reduce-short-circuits.test.ts"
      - "test/helpers/reduced-motion.ts"
      - "stryker.driver.config.mjs"
      - "vitest.stryker.driver.config.ts"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Каждый job объявляет только собственные полномочия.
permissions: {}

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  core:
    name: critical numerical core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Последний exact-main run дошёл до прежнего 60m потолка и был cancelled,
    # поэтому тот timeout не являлся доказательством test failure. Даём кампании
    # закончиться; driver ниже идёт параллельно и не увеличивает critical path.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Mutation gate
        run: pnpm mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-core-report-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  driver:
    name: critical driver semantics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Driver mutation gate
        run: pnpm exec stryker run stryker.driver.config.mjs

      - name: Upload driver mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-driver-report-${{ github.run_id }}
          path: reports/mutation/driver/
          if-no-files-found: ignore
          retention-days: 14

  # Право записи issues существует только в job без кода репозитория и зависимостей.
  report-failure:
    name: Report scheduled mutation failure
    needs: [core, driver]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.core.result != 'success' || needs.driver.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RESULT: ${{ needs.core.result }}
          DRIVER_RESULT: ${{ needs.driver.result }}
        run: |
          title="mutation: ночной прогон красный ($(date -u +%F))"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --label "type:hardening,priority:P1" \
            --body "Ночной mutation-прогон не завершился успешно: core=$CORE_RESULT, driver=$DRIVER_RESULT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — требуется разобрать причину до ослабления mutation-гейта."
