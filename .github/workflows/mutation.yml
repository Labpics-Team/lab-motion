name: Mutation

on:
  schedule:
    - cron: " 17 3 * * 1"
  workflow_dispatch:

# Кажд� �й job объявляет только со� �ственные полномочия.
permi ssions: {}

concurrency:
  group: mutation-${ { github.ref }}
  cancel-in-progress: true

e nv:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
   COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  core :
    name: critical numerical core
    runs- on: self-hosted
    timeout-minutes: 60
    p ermissions:
      contents: read

    steps:
       - name: Checkout
        uses: actions/ checkout@3d3c42e5aac5ba805825da76410c181273ba 90b1 # v7.0.1
        with:
          persist -credentials: false

      - name: Setup Node 
        uses: actions/setup-node@82076278602 6740c76f36085b0efc47a31fe5020 # v7.0.0
         with:
          node-version: "24"

      -  name: Activate pinned pnpm
        run: |
           corepack enable
          corepack in stall --global pnpm@11.11.0

      - name: In stall dependencies
        run: pnpm install  --frozen-lockfile

      - name: Build
         run: pnpm build

      - name: Mutation gat e
        run: pnpm mutation

      - name: U pload mutation report
        if: always()
         uses: actions/upload-artifact@043fb46d1 a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
         with:
          name: mutation-report-${{  github.run_id }}
          path: reports/mut ation/
          if-no-files-found: ignore
           retention-days: 14

  # Право з аписи issues существует тол ько в job без кода репозит� �рия и зависимостей.
  report -failure:
    name: Report scheduled mutation  failure
    needs: [core]
    if: always() & & github.event_name == 'schedule' && needs.co re.result != 'success'
    runs-on: self-host ed
    timeout-minutes: 5
    permissions:
       issues: write
    steps:
      - name: Cr eate failure issue
        env:
          GH_ TOKEN: ${{ github.token }}
        run: |
           title="mutation: ночной прог он красный ($(date -u +%F))"
           gh issue create --repo "$GITHUB_REPOSITORY " --title "$title" \
            --label "typ e:hardening,priority:P1" \
            --body  "Ночной mutation-прогон не з� �вершился успешно: $GITHUB_SER VER_URL/$GITHUB_REPOSITORY/actions/runs/$GITH UB_RUN_ID — требуется разобр ать причину до ослаблени я mutation-гейта."
 