name: Research implicit identity HW PMU v21

on:
  push:
    branches: ["research/implicit-identity-hwpmu-v21-20260915"]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"
  BASE_SHA: fe11daa407de396fad952be7679650f63dabd4dd
  CANDIDATE_SHA: 778cd43ee2428c86cca52d1c02e719fcb62a811a

jobs:
  hw-pmu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout research carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "11.11.0"

      - name: Reconstruct exact product artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main refs/pull/380/head
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          base_dir="$RUNNER_TEMP/lm-base-hwpmu-v21"
          candidate_dir="$RUNNER_TEMP/lm-candidate-hwpmu-v21"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          git worktree add --detach "$candidate_dir" "$CANDIDATE_SHA"
          for dir in "$base_dir" "$candidate_dir"; do
            pnpm --dir "$dir" install --frozen-lockfile --prefer-offline
            pnpm --dir "$dir" build
          done
          base_entry="$base_dir/dist/keyframes/index.js"
          candidate_entry="$candidate_dir/dist/keyframes/index.js"
          printf 'base_dir=%s\ncandidate_dir=%s\nbase_entry=%s\ncandidate_entry=%s\n' \
            "$base_dir" "$candidate_dir" "$base_entry" "$candidate_entry" >> "$GITHUB_ENV"

      - name: Exact artifact Pareto gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-hwpmu-v21
          cat > "$base_dir/.exact-size-compare.mjs" <<'EOF'
          import { readFileSync, readdirSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { createHash } from 'node:crypto';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const [baseDir, candidateDir, outFile] = process.argv.slice(2);
          const walk = (root, dir = root, out = []) => {
            for (const ent of readdirSync(dir, { withFileTypes: true })) {
              const p = join(dir, ent.name);
              if (ent.isDirectory()) walk(root, p, out);
              else if (/\.(?:js|cjs)$/.test(ent.name)) out.push(relative(root, p));
            }
            return out;
          };
          const baseDist = join(baseDir, 'dist');
          const candidateDist = join(candidateDir, 'dist');
          const a = walk(baseDist).sort();
          const b = walk(candidateDist).sort();
          const sameSet = JSON.stringify(a) === JSON.stringify(b);
          const sha = (x) => createHash('sha256').update(x).digest('hex');
          const rows = [];
          let pass = sameSet;
          if (sameSet) {
            for (const path of a) {
              const base = readFileSync(join(baseDist, path));
              const candidate = readFileSync(join(candidateDist, path));
              const row = {
                path,
                base: { raw: base.length, gzip: canonicalGzip(base).length, brotli: observationalBrotli(base).length, sha256: sha(base) },
                candidate: { raw: candidate.length, gzip: canonicalGzip(candidate).length, brotli: observationalBrotli(candidate).length, sha256: sha(candidate) },
              };
              row.changed = row.base.sha256 !== row.candidate.sha256;
              row.delta = {
                raw: row.candidate.raw - row.base.raw,
                gzip: row.candidate.gzip - row.base.gzip,
                brotli: row.candidate.brotli - row.base.brotli,
              };
              row.pass = row.delta.raw <= 0 && row.delta.gzip <= 0 && row.delta.brotli <= 0;
              if (!row.pass) pass = false;
              rows.push(row);
            }
          }
          const changed = rows.filter((x) => x.changed);
          const result = {
            schema: 1,
            base: process.env.BASE_SHA,
            candidate: process.env.CANDIDATE_SHA,
            node: process.version,
            sameSet,
            totalEntries: rows.length,
            changedEntries: changed.length,
            pass,
            verdict: pass ? 'PASS-SIZE-PARETO' : 'FAIL-SIZE-PARETO',
            changed,
          };
          writeFileSync(outFile, JSON.stringify(result, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_ENV, `SIZE_PASS=${pass ? 'true' : 'false'}\n`);
          console.log(JSON.stringify(result, null, 2));
          EOF
          (cd "$base_dir" && node .exact-size-compare.mjs "$base_dir" "$candidate_dir" "$GITHUB_WORKSPACE/evidence-hwpmu-v21/size-result.json")

      - name: Build and record grouped HW-PMU helper
        if: env.SIZE_PASS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat /proc/sys/kernel/perf_event_paranoid)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          after="$(cat /proc/sys/kernel/perf_event_paranoid)"
          allowed="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          cpu="${allowed%%,*}"
          cpu="${cpu%%-*}"
          [[ "$cpu" =~ ^[0-9]+$ ]]
          helper="$RUNNER_TEMP/hwpmu-v21"
          cc -std=c11 -O2 -Wall -Wextra -Werror scripts/research-hwpmu-v21.c -o "$helper"
          printf 'RESEARCH_CPU=%s\nHWPMU_HELPER=%s\n' "$cpu" "$helper" >> "$GITHUB_ENV"
          {
            echo "node=$(node --version)"
            echo "v8=$(node -p 'process.versions.v8')"
            echo "pnpm=$(pnpm --version)"
            echo "kernel=$(uname -srvm)"
            echo "arch=$(uname -m)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "carrier=$GITHUB_SHA"
            echo "base=$BASE_SHA"
            echo "candidate=$CANDIDATE_SHA"
            echo "perf_event_paranoid_before=$before"
            echo "perf_event_paranoid_after=$after"
            echo "cpus_allowed_list=$allowed"
            echo "research_cpu=$cpu"
            cc --version | head -1
            sha256sum "$base_entry" "$candidate_entry" \
              scripts/research-hwpmu-v21.c \
              scripts/research-implicit-identity-hwpmu-v21.mjs \
              "$helper"
          } > evidence-hwpmu-v21/environment.txt

      - name: Run preregistered grouped HW-PMU experiment
        if: env.SIZE_PASS == 'true'
        shell: bash
        run: |
          set +e
          RESEARCH_CPU="$RESEARCH_CPU" HWPMU_HELPER="$HWPMU_HELPER" \
            node --allow-natives-syntax scripts/research-implicit-identity-hwpmu-v21.mjs \
            "$base_entry" "$candidate_entry" evidence-hwpmu-v21 | tee evidence-hwpmu-v21/stdout.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" | tee evidence-hwpmu-v21/exit-status.txt
          exit 0

      - name: Materialize size failure verdict
        if: env.SIZE_PASS != 'true'
        shell: bash
        run: |
          cp evidence-hwpmu-v21/size-result.json evidence-hwpmu-v21/result.json
          printf 'HW-PMU skipped by preregistered size falsifier\n' > evidence-hwpmu-v21/hwpmu-skipped.txt

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence-hwpmu-v21/size-result.json
          test -f evidence-hwpmu-v21/result.json
          find evidence-hwpmu-v21 -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence-hwpmu-v21/SHA256SUMS
          sha256sum --check evidence-hwpmu-v21/SHA256SUMS
          cat evidence-hwpmu-v21/size-result.json
          cat evidence-hwpmu-v21/result.json

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implicit-identity-hwpmu-v21-${{ github.sha }}
          path: evidence-hwpmu-v21
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
