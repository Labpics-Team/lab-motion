name: Implicit identity setup precision v8

on:
  push:
    branches: ["research/implicit-identity-precision-v8-20260913"]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 93278bf9b540f93521c7bd4c02f68db458e5db7a
          path: base
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 0b01ae2b34db2b78c11acf9c4242e73538717c95
          path: candidate
          persist-credentials: false

      - name: Checkout immutable v7 measurement mechanism
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a1b0e59752d6927ee0628c9e1d7fff0b6be32622
          path: v7-proof
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"

      - name: Build immutable sides
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          test "$(git -C base rev-parse HEAD)" = 93278bf9b540f93521c7bd4c02f68db458e5db7a
          test "$(git -C candidate rev-parse HEAD)" = 0b01ae2b34db2b78c11acf9c4242e73538717c95
          test "$(git -C candidate rev-parse HEAD^{tree})" = 69fc191b8f7c9e3503e1c1b64b280c00eb219311
          test "$(git -C v7-proof rev-parse HEAD)" = a1b0e59752d6927ee0628c9e1d7fff0b6be32622
          printf '%s  %s\n' \
            6c0936ff1b53b0c59597bf801766e213ae4879ad5eb72a0b23949b05a70d1cb0 v7-proof/research/implicit-identity-v7/measure-child.mjs \
            | sha256sum --check
          (cd base && pnpm install --frozen-lockfile && pnpm build)
          (cd candidate && pnpm install --frozen-lockfile && pnpm build)
          printf '%s  %s\n' \
            8f3ef89364b35b9fb8fb4277e99709a26cefa827f88611587265d3fb40465ff7 base/dist/keyframes/index.js \
            4f58d7f47bc7767d336b2771990f64fa52e4dd1df0f550fff30bdfc7ff1035be candidate/dist/keyframes/index.js \
            | sha256sum --check

      - name: Fresh setup precision qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp research/implicit-identity-v8/qualify.mjs evidence/
          node -p 'JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch})' > evidence/environment.json
          lscpu > evidence/cpu.txt
          uname -a > evidence/uname.txt
          sha256sum \
            research/implicit-identity-v8/qualify.mjs \
            v7-proof/research/implicit-identity-v7/measure-child.mjs \
            base/bench/compare/methodology.mjs \
            base/dist/keyframes/index.js \
            candidate/dist/keyframes/index.js \
            > evidence/protocol-sha256.txt
          node research/implicit-identity-v8/qualify.mjs 2>&1 | tee evidence/qualification-v8.log

      - name: Immutable evidence manifest
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: implicit-identity-setup-precision-v8
          path: evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: false
