name: Transition comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bench/compare/**'
      - '.github/workflows/compare.yml'

permissions:
  contents: read

concurrency:
  group: comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      COREPACK_DEFAULT_TO_LATEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Установить закреплённые инструменты
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          pnpm --dir bench/compare install --frozen-lockfile
          pnpm --dir bench/compare exec playwright install --with-deps chromium
      - name: Собрать кандидат
        run: pnpm build
      - name: Сравнить законченные переходы
        run: xvfb-run -a node bench/compare/run-transition-comparison.mjs
      - name: Сохранить измерения и отказы
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transition-comparison-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: bench/compare/results/transition-comparison/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
