name: Implicit identity composite v6

on:
  push:
    branches:
      - research/implicit-identity-composite-v6-20260913

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 93278bf9b540f93521c7bd4c02f68db458e5db7a
          path: base
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0b01ae2b34db2b78c11acf9c4242e73538717c95
          path: candidate
          persist-credentials: false

      - name: Checkout calibrated v4 carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bc3f6e114d25910d7ec94d457e1080af1e018238
          path: v4carrier
          persist-credentials: false

      - name: Checkout calibrated v5 carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 52a5d84234af620c6a167516e665933321c863ef
          path: v5carrier
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          check-latest: false

      - name: Build immutable sides
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          test "$(git -C base rev-parse HEAD)" = 93278bf9b540f93521c7bd4c02f68db458e5db7a
          test "$(git -C candidate rev-parse HEAD)" = 0b01ae2b34db2b78c11acf9c4242e73538717c95
          test "$(git -C candidate rev-parse HEAD^{tree})" = 69fc191b8f7c9e3503e1c1b64b280c00eb219311
          test "$(git -C v4carrier rev-parse HEAD)" = bc3f6e114d25910d7ec94d457e1080af1e018238
          test "$(git -C v5carrier rev-parse HEAD)" = 52a5d84234af620c6a167516e665933321c863ef
          (cd base && pnpm install --frozen-lockfile && pnpm build)
          (cd candidate && pnpm install --frozen-lockfile && pnpm build)
          printf '%s  %s\n' \
            8f3ef89364b35b9fb8fb4277e99709a26cefa827f88611587265d3fb40465ff7 base/dist/keyframes/index.js \
            4f58d7f47bc7767d336b2771990f64fa52e4dd1df0f550fff30bdfc7ff1035be candidate/dist/keyframes/index.js \
            | sha256sum --check

      - name: Composite A/B qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node -p 'JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch})' > evidence/environment.json
          lscpu > evidence/cpu.txt
          git rev-parse HEAD > evidence/carrier-sha.txt
          sha256sum \
            research/implicit-identity-v6/qualify.mjs \
            v4carrier/research/implicit-identity-v4/measure-child.mjs \
            v5carrier/research/implicit-identity-v5/measure-pair.mjs \
            base/bench/compare/methodology.mjs \
            base/dist/keyframes/index.js \
            candidate/dist/keyframes/index.js \
            > evidence/protocol-sha256.txt
          node research/implicit-identity-v6/qualify.mjs 2>&1 | tee evidence/qualification-v6.log

      - name: Immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: implicit-identity-composite-v6
          path: evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
