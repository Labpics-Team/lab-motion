name: Cascade immutable delivery proof

on:
  push:
    branches: ["research/state-cascade-proof-20260912"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"
      - name: Materialize immutable source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/research/state-cascade-proof-20260912
          test "$(git diff 0720e23960cfe53e88689028b21a589fd58be016 --name-only)" = .github/workflows/research-cascade-proof-deliver.yml
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, zlib
          sha = 'dd03e42a2a252f2da973684f57926e4de0cf7bb4'
          request = urllib.request.Request(
              'https://api.github.com/repos/Labpics-Team/lab-motion/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          raw = base64.b64decode(result['content'])
          def blob(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          assert blob(raw) == sha, 'transport blob mismatch'
          # One observed transcription insertion in the opaque base64 carrier.
          # Restore the registered payload and verify both Git identity and patch SHA256.
          encoded = base64.b64encode(raw).decode()
          assert encoded[1160] == 'h', 'unexpected transport insertion'
          encoded = (encoded[:1160] + encoded[1161:]).rstrip('=')
          encoded += '=' * ((-len(encoded)) % 4)
          compressed = base64.b64decode(encoded)
          assert blob(compressed) == '9585a9d0ff9623457b497b2c74a89d1b9960eb14'
          patch = zlib.decompress(compressed)
          assert len(patch) == 60557
          assert hashlib.sha256(patch).hexdigest() == '0296ceff5896b2bee812da3e47d83ad0fcada3a75a599b8415ca143d908a4cca'
          pathlib.Path('/tmp/cascade.patch').write_bytes(patch)
          PY
          git apply --index /tmp/cascade.patch
          git rm .github/workflows/research-cascade-proof-deliver.yml
          test "$(git write-tree)" = 958e3b97ba2cb0dad47d9a8d167daaf31e950afc
          python - <<'PY'
          from pathlib import Path
          p = Path('test/behaviors-state-cascade-lifecycle.test.ts')
          s = p.read_text()
          anchor = "['null', () => null]"
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, "['null', (): null => null]"))
          PY
          git add test/behaviors-state-cascade-lifecycle.test.ts
          test "$(git write-tree)" = ec43a3ad2fad56d9f24ea525f8a8f1c66eeb44ed
          git diff --exit-code
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: RED on original cascade implementation
        shell: bash
        run: |
          set -euo pipefail
          restore() { git show :src/behaviors/state-cascade.ts > src/behaviors/state-cascade.ts; }
          trap restore EXIT
          git show 0720e23960cfe53e88689028b21a589fd58be016:src/behaviors/state-cascade.ts > src/behaviors/state-cascade.ts
          set +e
          NO_COLOR=1 pnpm exec vitest run test/behaviors-state-cascade-lifecycle.test.ts -t 'порядок коммитов' > /tmp/cascade-red.log 2>&1
          status=$?
          set -e
          cat /tmp/cascade-red.log
          test "$status" -ne 0
          grep -q 'AssertionError' /tmp/cascade-red.log
          grep -q '7 failed' /tmp/cascade-red.log
          restore
          trap - EXIT
          git diff --exit-code
      - name: GREEN and unchanged budgets
        run: |
          pnpm exec vitest run test/behaviors-*.test.ts test/decay*.test.ts
          pnpm typecheck:native
          pnpm exec tsc --noEmit -p tsconfig.browser.json
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --target ES2022 test/behaviors-state-cascade-lifecycle.test.ts test/behaviors-state-cascade-model.test.ts test/decay-rest-projection.test.ts
          pnpm build
          pnpm size
      - name: Commit only the proven source tree to research branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = ec43a3ad2fad56d9f24ea525f8a8f1c66eeb44ed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(behaviors): атомарный каскад и минимальная decay-проекция'
          test "$(git rev-parse HEAD^{tree})" = ec43a3ad2fad56d9f24ea525f8a8f1c66eeb44ed
          git push origin HEAD:research/state-cascade-proof-20260912
