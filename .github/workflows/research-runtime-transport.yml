name: Research runtime transport
on:
  push:
    branches: [research/runtime-lifetime-proof-20260911]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Pinned package manager
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          test "$(pnpm --version)" = 11.11.0
          executable="$(find "$HOME/.cache/node/corepack" -name pnpm.cjs -type f -print -quit)"
          test -n "$executable"
          mkdir transport
          tar -czf transport/pnpm.tgz -C "$(dirname "$(dirname "$executable")")" .
          sha256sum transport/pnpm.tgz > transport/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pinned-pnpm
          path: transport/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
