name: RDP exact proof
on:
  push:
    branches: [research/runtime-lifetime-proof-20260911]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: e25063e2db3bd0ccf45a3bf9fcb1e910b7f882d9
      BASE_SHA: 5f375cff2e978914cfb6ffed4c0ae2d573d1415f
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      COREPACK_DEFAULT_TO_LATEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Immutable inputs and canonical builds
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          git worktree add --detach baseline "$BASE_SHA"
          git worktree add --detach candidate "$CANDIDATE_SHA"
          test "$(git -C candidate hash-object src/compositor/segmenter.ts)" = 0802c530bef1b1d3ae36fb85a682421067c5cea3
          test "$(git -C candidate hash-object test/compositor-rdp-frontier.test.ts)" = 7eab4732665ee524d7203d26146cd661a125e0cc
          for side in baseline candidate; do
            (cd "$side" && pnpm install --frozen-lockfile && pnpm build && pnpm size) > "$side-build-size.log" 2>&1
            git -C "$side" diff --exit-code
            (cd "$side" && find dist -type f -print0 | sort -z | xargs -0 sha256sum) > "$side-dist.sha256"
          done
          git branch rdp-evidence-candidate "$CANDIDATE_SHA"
          git bundle create candidate.bundle rdp-evidence-candidate
          sha256sum "$(command -v node)" > node.sha256
          cp candidate/scripts/compression-oracle.mjs compression-oracle-source.txt
      - name: Public complete cold compile with controls
        run: node rdp-timing.mjs > timing.log
      - name: Fresh-process observable retention and positive controls
        run: node --expose-gc rdp-retention.mjs > retention.log
      - name: Exact all-format size vector
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { canonicalGzip, observationalBrotli } from './candidate/scripts/compression-oracle.mjs';
          const rows=[];
          for (const path of fs.readdirSync('baseline/dist',{recursive:true}).filter(p=>p.endsWith('.js')||p.endsWith('.cjs'))) {
            const a=fs.readFileSync('baseline/dist/'+path),b=fs.readFileSync('candidate/dist/'+path);
            const vector=x=>[x.length,canonicalGzip(x).length,observationalBrotli(x).length];
            const av=vector(a),bv=vector(b);
            for(let i=0;i<3;i++) assert(bv[i]<=av[i],path+' metric '+i);
            rows.push({path,base:av,candidate:bv,identical:a.equals(b)});
          }
          fs.writeFileSync('size-vector.json',JSON.stringify(rows,null,2));
          JS
          (cd baseline && find dist -type f -print0 | sort -z | xargs -0 sha256sum) | diff - baseline-dist.sha256
          (cd candidate && find dist -type f -print0 | sort -z | xargs -0 sha256sum) | diff - candidate-dist.sha256
          sha256sum *.json *.log *.mjs *.heapsnapshot *.bundle *.sha256 > RECEIPTS.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rdp-proof-${{ env.CANDIDATE_SHA }}
          path: |
            *.json
            *.log
            *.mjs
            *.heapsnapshot
            *.bundle
            *.sha256
            compression-oracle-source.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
