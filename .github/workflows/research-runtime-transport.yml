name: RDP confirmatory tail proof
on:
  push:
    branches: [research/runtime-lifetime-proof-20260911]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 5629067244f912f2b381d454cf9c2ac1bc3ebb0b
      BASE_SHA: 5f375cff2e978914cfb6ffed4c0ae2d573d1415f
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      COREPACK_DEFAULT_TO_LATEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Exact sources and canonical builds
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          git worktree add --detach baseline "$BASE_SHA"
          git worktree add --detach candidate "$CANDIDATE_SHA"
          test "$(git -C candidate hash-object src/compositor/segmenter.ts)" = 0802c530bef1b1d3ae36fb85a682421067c5cea3
          test "$(git -C candidate hash-object test/compositor-rdp-frontier.test.ts)" = 55fc3ba61d64ea5294510967ab381e55f9135d50
          for side in baseline candidate; do
            (cd "$side" && pnpm install --frozen-lockfile && pnpm build) > "$side-build.log" 2>&1
            git -C "$side" diff --exit-code
            (cd "$side" && find dist -type f -print0 | sort -z | xargs -0 sha256sum) > "$side-dist.sha256"
          done
          git branch rdp-confirmatory-candidate "$CANDIDATE_SHA"
          git bundle create candidate.bundle rdp-confirmatory-candidate
      - name: Preregistered single 512-block confirmatory pass
        run: node rdp-tail.mjs > tail.log
      - name: Preserve exact evidence
        shell: bash
        run: |
          (cd baseline && find dist -type f -print0 | sort -z | xargs -0 sha256sum) | diff - baseline-dist.sha256
          (cd candidate && find dist -type f -print0 | sort -z | xargs -0 sha256sum) | diff - candidate-dist.sha256
          sha256sum *.json *.log rdp-tail.mjs *.bundle *.sha256 > RECEIPTS.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rdp-confirmatory-${{ env.CANDIDATE_SHA }}
          path: |
            tail-confirmatory.json
            tail.log
            *-build.log
            rdp-tail.mjs
            candidate.bundle
            *.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
