name: Release Compose

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native Maven version x.y.z from main'
        type: string
        required: true

permissions: {}
concurrency:
  group: release-motion-compose
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/native-compose.yml
    with:
      publication_version: ${{ inputs.version }}
      release_artifacts: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: compose-maven-*
          merge-multiple: true
          path: native/compose/build/repository
      - name: Verify the complete published dependency graph
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node native/compose/scripts/seal-repository.mjs native/compose/build/repository "$VERSION" "$GITHUB_SHA"
          bash native/compose/gradlew -p native/compose/consumer run --args=--verify \
            -PmotionRepository="$GITHUB_WORKSPACE/native/compose/build/repository" -PmotionVersion="$VERSION" --console=plain
      - name: Atomically publish immutable source and Maven tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_tag="compose-v$VERSION"
          maven_tag="maven-compose-v$VERSION"
          if git rev-parse --verify "refs/tags/$source_tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$source_tag")" == "$GITHUB_SHA" ]]
            git show "$maven_tag:source.json" > "$RUNNER_TEMP/compose-source.json"
            node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));if(s.sourceSha!==process.env.GITHUB_SHA||s.version!==process.env.VERSION)throw Error("Immutable release identity differs")' "$RUNNER_TEMP/compose-source.json"
          else
            ! git rev-parse --verify "refs/tags/$maven_tag" >/dev/null 2>&1
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            export GIT_INDEX_FILE="$RUNNER_TEMP/compose-maven.index"
            git read-tree --empty
            git --work-tree="$GITHUB_WORKSPACE/native/compose/build/repository" add --all
            tree=$(git write-tree)
            commit=$(printf 'Maven distribution %s from %s\n' "$VERSION" "$GITHUB_SHA" | git commit-tree "$tree")
            unset GIT_INDEX_FILE
            git tag "$source_tag" "$GITHUB_SHA"
            git tag "$maven_tag" "$commit"
            git push --atomic origin "refs/tags/$source_tag" "refs/tags/$maven_tag"
          fi
      - name: Install from the public Maven endpoint
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash native/compose/gradlew -p native/compose/consumer run --args=--verify \
            -PmotionRepository="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/maven-compose-v$VERSION/" \
            -PmotionVersion="$VERSION" --refresh-dependencies --console=plain
      - name: Publish release notes and fallback archive
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git archive --format=zip "maven-compose-v$VERSION" -o "$RUNNER_TEMP/motion-compose-maven.zip"
          (cd "$RUNNER_TEMP" && sha256sum motion-compose-maven.zip > motion-compose-maven.zip.sha256)
          cat > "$RUNNER_TEMP/compose-notes.md" <<EOF
          Kotlin Multiplatform Motion adapter: typed values, shared Compose clock, interruptible spring/effect controls.

          Maven repository: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/maven-compose-v$VERSION/

          Dependency: pics.lab:motion-compose:$VERSION

          Source: $GITHUB_SHA. Android AAR, iOS arm64/simulator klib, desktop JVM, common metadata and sources. Contract tests execute on JVM and iOS simulator; a real Compose desktop window verifies retarget, reduced motion and disposal. Physical mobile-device UI qualification belongs to the consuming application.
          EOF
          if gh release view "compose-v$VERSION" >/dev/null 2>&1; then
            gh release upload "compose-v$VERSION" "$RUNNER_TEMP/motion-compose-maven.zip" "$RUNNER_TEMP/motion-compose-maven.zip.sha256" --clobber
          else
            gh release create "compose-v$VERSION" --verify-tag --title "Motion Compose $VERSION" --notes-file "$RUNNER_TEMP/compose-notes.md" \
              "$RUNNER_TEMP/motion-compose-maven.zip" "$RUNNER_TEMP/motion-compose-maven.zip.sha256"
          fi
