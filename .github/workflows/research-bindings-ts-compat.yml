name: Bindings TypeScript compatibility delivery
on:
  push:
    branches: [research/semantic-binding-delivery-20260913]
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 347d7bc1f27bd82a9ad212c1f72e1043346dd25c
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Reconstruct exact two-file candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
          gh api 'repos/Labpics-Team/lab-motion/contents/proofs/noinfer-removal.patch?ref=research/semantic-binding-delivery-20260913' --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/noinfer-removal.patch"
          echo 'aac85f512f6040110549c6eeedde80bd1302457f074afc5a68d04b4f2dc274b6  '"$RUNNER_TEMP/noinfer-removal.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/noinfer-removal.patch"
          git diff --check
          test "$(git diff --cached --name-only | sort)" = $'src/bindings/index.ts\ntest/semantic-motion-binding-consumer.test.ts'
          pnpm build
          pnpm exec vitest run test/semantic-motion-binding-consumer.test.ts test/semantic-motion-binding-runtime.test.ts
          current="$(gh api repos/Labpics-Team/lab-motion/git/ref/heads/feat/semantic-motion-bindings-383 --jq .object.sha)"
          test "$current" = 347d7bc1f27bd82a9ad212c1f72e1043346dd25c
          base_tree="$(gh api repos/Labpics-Team/lab-motion/git/commits/347d7bc1f27bd82a9ad212c1f72e1043346dd25c --jq .tree.sha)"
          jq -n --arg base "$base_tree" --rawfile source src/bindings/index.ts --rawfile testfile test/semantic-motion-binding-consumer.test.ts '{base_tree:$base,tree:[{path:"src/bindings/index.ts",mode:"100644",type:"blob",content:$source},{path:"test/semantic-motion-binding-consumer.test.ts",mode:"100644",type:"blob",content:$testfile}]}' > "$RUNNER_TEMP/tree.json"
          tree="$(gh api --method POST repos/Labpics-Team/lab-motion/git/trees --input "$RUNNER_TEMP/tree.json" --jq .sha)"
          payload="$(jq -n --arg message 'fix(bindings): не требовать NoInfer в публичных типах' --arg tree "$tree" --arg parent 347d7bc1f27bd82a9ad212c1f72e1043346dd25c '{message:$message,tree:$tree,parents:[$parent]}')"
          commit="$(printf '%s' "$payload" | gh api --method POST repos/Labpics-Team/lab-motion/git/commits --input - --jq .sha)"
          refpayload="$(jq -n --arg ref 'refs/heads/research/bindings-noinfer-final-20260913' --arg sha "$commit" '{ref:$ref,sha:$sha}')"
          printf '%s' "$refpayload" | gh api --method POST repos/Labpics-Team/lab-motion/git/refs --input - >/dev/null
          printf '%s\n%s\n' "$commit" "$tree" | tee "$RUNNER_TEMP/candidate.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bindings-noinfer-final-candidate
          path: ${{ runner.temp }}/candidate.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
