name: Cascade documentation transport
on:
  push:
    branches: ["research/cascade-source-20260913"]
permissions:
  contents: write
jobs:
  deliver-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 271f60a06594933e247138c0831b9a789c549cb0
          fetch-depth: 0
      - name: Materialize and verify exact documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 271f60a06594933e247138c0831b9a789c549cb0
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          sha = 'd063fda1b28109c101d8727d82844a48ec486494'
          request = urllib.request.Request('https://api.github.com/repos/Labpics-Team/lab-motion/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          source = base64.b64decode(blob['content'])
          if hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() != sha: raise RuntimeError('source identity mismatch')
          before = pathlib.Path('docs/recipes.md').read_text()
          exec(compile(source, '<owned-docs-update>', 'exec'))
          after = pathlib.Path('docs/recipes.md').read_text()
          def recipe(text): return text.split('## Каскад состояний взаимодействия без гонок')[1].split('```ts\n')[1].split('```')[0]
          if recipe(before) != recipe(after): raise RuntimeError('executable recipe changed')
          actual = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if actual != ['CHANGELOG.md', 'docs/behaviors.md', 'docs/recipes.md']: raise RuntimeError('unexpected paths: ' + repr(actual))
          print('PASS documentation-only paths and byte-identical runnable recipe')
          PY
          git add -- CHANGELOG.md docs/behaviors.md docs/recipes.md
          git diff --cached --check
          test "$(git write-tree)" = 71b278823120c4abc181b965067c686861681372
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(behaviors): сократить русский контракт без потери семантики'
          test "$(git rev-parse HEAD^)" = 271f60a06594933e247138c0831b9a789c549cb0
          git push origin HEAD:refs/heads/research/cascade-docs-candidate-20260913
          git rev-parse HEAD HEAD^{tree}
