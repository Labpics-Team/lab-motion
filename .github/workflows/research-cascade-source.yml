name: Cascade immutable candidate proof
on:
  push:
    branches: ["research/cascade-source-20260913"]
permissions:
  contents: write
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a164691a24eb1c92dfdf9aeb80af4594dfb30faa
          fetch-depth: 0
      - name: Reconstruct and authenticate owned patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a164691a24eb1c92dfdf9aeb80af4594dfb30faa
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          chunks = ['6c65b668a23159127bfa62fe4cf33a620be3a7ed', '682f24c0f43e5ee1196b9b1effabb4fedf8d3dcf', '8070fe02057cf507c29ac1f8b898d55d2c9872e2', '56c102048050a9d9b538062963e1a4ca84a3bc7f']
          data = []
          for sha in chunks:
              request = urllib.request.Request('https://api.github.com/repos/Labpics-Team/lab-motion/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob['sha'] != sha or blob['encoding'] != 'base64': raise RuntimeError('blob identity mismatch')
              part = base64.b64decode(blob['content'])
              if hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() != sha: raise RuntimeError('blob bytes mismatch')
              data.append(part)
          patch = gzip.decompress(b''.join(data))
          expected = 'dbcf907a22292afeb206700cdcb58cb23e939a1a60c192aea83d89cc33b57972'
          if hashlib.sha256(patch).hexdigest() != expected: raise RuntimeError('patch digest mismatch')
          pathlib.Path('/tmp/cascade-batch.patch').write_bytes(patch)
          print('verified patch SHA256', expected)
          PY
          git apply --check /tmp/cascade-batch.patch
          git apply --index /tmp/cascade-batch.patch
          git diff --cached --check
          test "$(git write-tree)" = 16cea62a87cf60d3eea69167e93bb4445e5ed90c
          git diff --cached --stat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
      - name: Install exact toolchain
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: Semantic tests and native types
        run: |
          pnpm vitest run test/behaviors-state-cascade.test.ts test/behaviors-state-cascade-lifecycle.test.ts test/behaviors-state-cascade-model.test.ts test/behaviors-state-cascade-batch.test.ts test/decay-rest-projection.test.ts
          pnpm typecheck:native
          pnpm exec tsc --noEmit -p tsconfig.browser.json
          pnpm exec tsc --ignoreConfig --noEmit --target es2022 --module nodenext --moduleResolution nodenext --skipLibCheck --strict test/behaviors-state-cascade-batch.test.ts
      - name: Build and unchanged size gates
        run: |
          pnpm build
          pnpm size
      - name: Publish only verified immutable candidate on isolated ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 16cea62a87cf60d3eea69167e93bb4445e5ed90c
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(behaviors): группировать смену намерений в один визуальный переход'
          test "$(git rev-parse HEAD^{tree})" = 16cea62a87cf60d3eea69167e93bb4445e5ed90c
          test "$(git rev-parse HEAD^)" = a164691a24eb1c92dfdf9aeb80af4594dfb30faa
          git push origin HEAD:refs/heads/research/cascade-batch-candidate-20260913
          git rev-parse HEAD HEAD^{tree}
