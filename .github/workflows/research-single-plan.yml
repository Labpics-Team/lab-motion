name: Single-plan paired proof
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: single-plan-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof:
    if: github.head_ref == 'perf/compiler-single-plan-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          COREPACK_DEFAULT_TO_LATEST: '0'
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: Paired canonical builds and differential proof
        run: node scripts/research-single-plan.mjs
      - name: Preserve exact proof receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: single-plan-proof-${{ github.event.pull_request.head.sha }}
          path: single-plan-evidence/
          if-no-files-found: error
          retention-days: 30
