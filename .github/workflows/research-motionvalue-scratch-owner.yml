name: research-motionvalue-scratch-owner

on:
  push:
    branches: ["research/motionvalue-scratch-owner"]

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build exact base
        run: pnpm build
      - name: Record base bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/base.json"
          import { readFileSync } from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const metric = (path) => {
            const bytes = readFileSync(path);
            return { raw: bytes.length, gzip: canonicalGzip(bytes).length, brotli: observationalBrotli(bytes).length };
          };
          console.log(JSON.stringify({ esm: metric('dist/index.js'), cjs: metric('dist/index.cjs') }));
          NODE
      - name: Materialize candidate and semantic oracle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/motion-value.ts')
          text = path.read_text()
          anchor = 'const EPSILON = 1e-10;\n'
          replacement = "const EPSILON = 1e-10;\n\n/** Синхронный output-сcratch солвера: _tick копирует оба числа до callback-границы. */\nconst solverSample = { value: 0, velocity: 0 };\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement)
          owned = '  /** Caller-owned result солвера: один объект на значение вместо одного на кадр. */\n  private readonly _solved = { value: 0, velocity: 0 };\n'
          assert text.count(owned) == 1
          text = text.replace(owned, '')
          assert text.count('this._solved') == 1
          text = text.replace('this._solved', 'solverSample')
          path.write_text(text)
          PY
          cat > test/motion-value-shared-scratch.test.ts <<'TEST'
          import { describe, expect, it } from 'vitest';
          import { MotionValue } from '../src/motion-value.js';

          function makeClock() {
            const queue: Array<(ts?: number) => void> = [];
            return {
              requestFrame(cb: (ts?: number) => void): number {
                queue.push(cb);
                return queue.length;
              },
              step(ts: number): void {
                const cb = queue.shift();
                if (cb !== undefined) cb(ts);
              },
            };
          }

          describe('MotionValue: изоляция синхронного solver scratch', () => {
            it('реентерабельный кадр второго значения не меняет пару value/velocity первого', () => {
              const springA = { mass: 1, stiffness: 210, damping: 17 };
              const springB = { mass: 2, stiffness: 90, damping: 36 };
              const aClock = makeClock();
              const bClock = makeClock();
              const refClock = makeClock();
              const a = new MotionValue({ initial: 0, spring: springA, clamp: false, requestFrame: aClock.requestFrame });
              const b = new MotionValue({ initial: 30, spring: springB, clamp: false, requestFrame: bClock.requestFrame });
              const ref = new MotionValue({ initial: 0, spring: springA, clamp: false, requestFrame: refClock.requestFrame });
              let reentered = false;
              a.onChange((value) => {
                if (!reentered && value !== 0) {
                  reentered = true;
                  bClock.step(1000 / 60);
                }
              });
              a.setTarget(100);
              b.setTarget(-40);
              ref.setTarget(100);
              aClock.step(0);
              bClock.step(0);
              refClock.step(0);
              aClock.step(1000 / 60);
              refClock.step(1000 / 60);
              expect(reentered).toBe(true);
              expect(a.value).toBe(ref.value);
              expect(a.velocity).toBe(ref.velocity);
              a.destroy();
              b.destroy();
              ref.destroy();
            });
          });
          TEST
          rm .github/workflows/research-motionvalue-scratch-owner.yml
          git add src/motion-value.ts test/motion-value-shared-scratch.test.ts .github/workflows/research-motionvalue-scratch-owner.yml
          git -c user.name='Labpics Research' -c user.email='research@users.noreply.github.com' commit -m 'perf: убрать per-instance scratch MotionValue'
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha"
      - name: Structural allocation oracle with positive control
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('src/motion-value.ts', 'utf8');
          const oracle = (text) =>
            !text.includes('private readonly _solved =')
            && (text.match(/const solverSample = \{ value: 0, velocity: 0 \};/g) ?? []).length === 1
            && text.includes('solveSpring(this._spring, this._elapsed, this._v0Normalized, solverSample)');
          if (!oracle(source)) throw new Error('candidate structural oracle failed');
          const mutant = source.replace('export class MotionValue {', 'export class MotionValue {\n  private readonly _solved = { value: 0, velocity: 0 };');
          if (oracle(mutant)) throw new Error('positive control was not detected');
          console.log('structural oracle: per-instance 1→0; module scratch=1; positive control RED');
          NODE
      - name: Targeted semantics
        run: pnpm vitest run test/motion-value.test.ts test/motion-value-listener-isolation.test.ts test/motion-value-shared-scratch.test.ts
      - name: Build candidate
        run: pnpm build
      - name: Size gate
        run: pnpm size
      - name: Compare protected root bytes
        shell: bash
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/candidate.json"
          import { readFileSync } from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const metric = (path) => {
            const bytes = readFileSync(path);
            return { raw: bytes.length, gzip: canonicalGzip(bytes).length, brotli: observationalBrotli(bytes).length };
          };
          console.log(JSON.stringify({ esm: metric('dist/index.js'), cjs: metric('dist/index.cjs') }));
          NODE
          BASE="$RUNNER_TEMP/base.json" CANDIDATE="$RUNNER_TEMP/candidate.json" SHA_FILE="$RUNNER_TEMP/candidate-sha" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = JSON.parse(readFileSync(process.env.BASE, 'utf8'));
          const candidate = JSON.parse(readFileSync(process.env.CANDIDATE, 'utf8'));
          for (const format of ['esm', 'cjs']) for (const metric of ['raw', 'gzip', 'brotli']) {
            if (candidate[format][metric] > base[format][metric]) {
              throw new Error(`${format}.${metric} regressed ${base[format][metric]}→${candidate[format][metric]}`);
            }
          }
          const evidence = {
            baseSha: 'fe11daa407de396fad952be7679650f63dabd4dd',
            candidateSha: readFileSync(process.env.SHA_FILE, 'utf8').trim(),
            node: process.version,
            base,
            candidate,
            delta: Object.fromEntries(['esm','cjs'].map((f) => [f, Object.fromEntries(['raw','gzip','brotli'].map((m) => [m, candidate[f][m]-base[f][m]]))])),
            structural: 'per-instance solver result object 1→0; module scratch=1; deliberate field reintroduction detected',
            targetedSemantics: 'green',
            sizeGate: 'green'
          };
          writeFileSync('motionvalue-scratch-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - name: Push exact candidate
        run: git push origin HEAD:research/motionvalue-scratch-owner
      - name: Upload immutable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: motionvalue-scratch-evidence-${{ github.run_id }}
          path: motionvalue-scratch-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
