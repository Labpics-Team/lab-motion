name: autoresearch-qemu-ir-415

on:
  push:
    branches:
      - autoresearch/qemu-ir-415-20260916

permissions:
  contents: read

jobs:
  qemu-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - name: Exact product-source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD df7aaced646116f34135083dbfbf62ee40265657)" = "df7aaced646116f34135083dbfbf62ee40265657"
          git diff --exit-code df7aaced646116f34135083dbfbf62ee40265657 -- src test package.json pnpm-lock.yaml
      - name: Install research execution plane
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user gcc pkg-config libglib2.0-dev curl
          qemu-x86_64 --version | tee qemu-version.txt
          qemu-x86_64 -help 2>&1 | grep -q -- '-plugin'
          mkdir -p /tmp/qemu-include
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/qemu/qemu/v8.2.2/include/qemu/qemu-plugin.h \
            -o /tmp/qemu-include/qemu-plugin.h
          gcc -O2 -shared -fPIC -fvisibility=hidden \
            $(pkg-config --cflags glib-2.0) -I/tmp/qemu-include \
            .github/research/qemu-ir-415/plugin.c -o /tmp/lm-qemu-plugin.so
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$NODE_ROOT/include/node/node_api.h"
          gcc -O2 -shared -fPIC -I"$NODE_ROOT/include/node" \
            .github/research/qemu-ir-415/marker.c -o /tmp/lm-marker.node
          file /tmp/lm-qemu-plugin.so /tmp/lm-marker.node
      - name: Build exact mechanism bundles
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          git worktree add --detach /tmp/lm-base fe11daa407de396fad952be7679650f63dabd4dd
          git worktree add --detach /tmp/lm-candidate df7aaced646116f34135083dbfbf62ee40265657
          pnpm exec esbuild /tmp/lm-base/src/animate/channels.ts \
            --bundle --platform=node --format=esm --target=node24 --outfile=/tmp/lm-base.mjs
          pnpm exec esbuild /tmp/lm-candidate/src/animate/channels.ts \
            --bundle --platform=node --format=esm --target=node24 --outfile=/tmp/lm-candidate.mjs
          sha256sum /tmp/lm-base.mjs /tmp/lm-candidate.mjs /tmp/lm-qemu-plugin.so /tmp/lm-marker.node \
            .github/research/qemu-ir-415/harness.mjs \
            .github/research/qemu-ir-415/evaluate.py | tee hashes.txt
      - name: Acquire frozen guest-instruction counts
        id: acquire
        continue-on-error: true
        shell: bash
        env:
          LM_QEMU_MARKER: /tmp/lm-marker.node
        run: |
          set -euo pipefail
          printf 'side\tcase\tmode\trep\tcount\tchecksum\tstatusBefore\tstatusAfter\n' > counts.tsv
          : > raw.log

          run_one() {
            local side="$1" case_name="$2" mode="$3" rep="$4" bundle="$5"
            echo "=== side=$side case=$case_name mode=$mode rep=$rep ===" | tee -a raw.log
            set +e
            out=$(timeout 180s qemu-x86_64 -cpu max -plugin file=/tmp/lm-qemu-plugin.so \
              "$(command -v node)" \
              --allow-natives-syntax --single-threaded --predictable \
              --no-concurrent-recompilation --random-seed=20260916 \
              .github/research/qemu-ir-415/harness.mjs "$bundle" "$case_name" "$mode" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out" | tee -a raw.log
            if [ "$rc" -ne 0 ]; then
              echo "execution rc=$rc side=$side case=$case_name mode=$mode rep=$rep" > acquisition_failure.txt
              return 1
            fi
            count=$(printf '%s\n' "$out" | sed -n 's/.*QEMU_IR vcpu=[0-9][0-9]* count=\([0-9][0-9]*\).*/\1/p')
            line=$(printf '%s\n' "$out" | grep '^HARNESS ' || true)
            if [ "$(printf '%s\n' "$count" | sed '/^$/d' | wc -l)" -ne 1 ] || [ -z "$line" ]; then
              echo "missing/duplicate receipt side=$side case=$case_name mode=$mode rep=$rep" > acquisition_failure.txt
              return 1
            fi
            checksum=$(printf '%s\n' "$line" | sed -n 's/.*checksum=\([^ ]*\).*/\1/p')
            before=$(printf '%s\n' "$line" | sed -n 's/.*statusBefore=\([^ ]*\).*/\1/p')
            after=$(printf '%s\n' "$line" | sed -n 's/.*statusAfter=\([^ ]*\).*/\1/p')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$side" "$case_name" "$mode" "$rep" "$count" "$checksum" "$before" "$after" >> counts.tsv
          }

          run_one candidate settled-single floor 1 /tmp/lm-candidate.mjs
          run_one candidate settled-single floor 2 /tmp/lm-candidate.mjs

          for case_name in settled-single all-seven live-single; do
            for rep in 1 2 3 4; do
              run_one base "$case_name" product "$rep" /tmp/lm-base.mjs
              run_one candidate "$case_name" product "$rep" /tmp/lm-candidate.mjs
            done
            for rep in 1 2; do
              run_one candidate "$case_name" positive "$rep" /tmp/lm-candidate.mjs
            done
          done
      - name: Evaluate frozen falsifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f acquisition_failure.txt ]; then
            REASON="$(cat acquisition_failure.txt)" python3 -c 'import json,os; r={"verdict":"BLOCKED_UNPROVEN","execution_failure":os.environ["REASON"]}; open("result.json","w").write(json.dumps(r,indent=2,sort_keys=True)+"\n"); print(json.dumps(r,indent=2,sort_keys=True))'
          else
            python3 .github/research/qemu-ir-415/evaluate.py counts.tsv || true
          fi
          {
            echo "base=fe11daa407de396fad952be7679650f63dabd4dd"
            echo "candidate=df7aaced646116f34135083dbfbf62ee40265657"
            echo "carrier=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "kernel=$(uname -srvmo)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
            qemu-x86_64 --version | head -1
          } | tee environment.txt
          sha256sum result.json counts.tsv raw.log environment.txt hashes.txt qemu-version.txt | tee receipt-sha256.txt
      - name: Upload immutable research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ir-415-receipt
          path: |
            result.json
            counts.tsv
            raw.log
            environment.txt
            hashes.txt
            qemu-version.txt
            receipt-sha256.txt
            acquisition_failure.txt
          if-no-files-found: warn
          retention-days: 30
