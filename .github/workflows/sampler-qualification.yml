# Временный bounded falsifier; удалить после решения о кандидате.
name: Sampler first interval qualification
on:
  push:
    branches: [perf/sampler-first-interval-01a1b3b1]
permissions:
  contents: read
concurrency:
  group: sampler-first-interval-qualification
  cancel-in-progress: false
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2985f84c6897dee743305f95e02d2e70c7e93fbc
          path: baseline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Pinned toolchain
        working-directory: candidate
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: Bind the lookup-only source
        working-directory: candidate
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C ../baseline rev-parse HEAD)" = 2985f84c6897dee743305f95e02d2e70c7e93fbc
          git diff --exit-code 2985f84c6897dee743305f95e02d2e70c7e93fbc HEAD -- src ':!src/motion/program.ts' package.json pnpm-lock.yaml
          printf '%s  %s\n' 'ba0f3485bfbe38b9c200f1078a2f5ab3ccb83858025ee9cd80d4e1e3d6749745' src/motion/program.ts | sha256sum --check --strict
          printf '%s  %s\n' '54c82e9151c81e8a1e85ba21eee0257c6b29109478870ee0643fcbb04265df8c' ../baseline/src/motion/program.ts | sha256sum --check --strict
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Full sampler differential and paired CPU wall
        working-directory: candidate
        run: node scripts/sampler-qualification.mjs ../baseline "$RUNNER_TEMP/sampler-qualification"
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sampler-first-interval-qualification
          path: ${{ runner.temp }}/sampler-qualification
          if-no-files-found: error
          retention-days: 14
