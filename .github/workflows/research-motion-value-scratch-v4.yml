name: Research · MotionValue solver-owned scratch v4

on:
  push:
    branches: ["research/motion-value-solver-scratch-20260916"]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: fe11daa407de396fad952be7679650f63dabd4dd
      CANDIDATE_SHA: 9c568fa752d34ece34583d78f70a88e76bbbdcaf
    steps:
      - name: Checkout carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install once
        run: pnpm install --frozen-lockfile
      - name: Materialize exact base and candidate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/candidate/node_modules"
      - name: Candidate semantics and package gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          pnpm typecheck
          pnpm build
          pnpm vitest run test/motion-value*.test.ts test/core-solver-buffer.test.ts test/spring*.test.ts
          pnpm size
          pnpm pack:smoke
      - name: Structural owner oracle with positive control
        shell: bash
        run: |
          set -euo pipefail
          base_mv="$RUNNER_TEMP/base/src/motion-value.ts"
          cand_mv="$RUNNER_TEMP/candidate/src/motion-value.ts"
          base_solver="$RUNNER_TEMP/base/src/internal/solver.ts"
          cand_solver="$RUNNER_TEMP/candidate/src/internal/solver.ts"
          grep -Fq 'private readonly _solved = { value: 0, velocity: 0 };' "$base_mv"
          ! grep -Fq 'private readonly _solved = { value: 0, velocity: 0 };' "$cand_mv"
          grep -Fq 'const basisSample = { value: 0, velocity: 0 };' "$base_solver"
          grep -Fq 'export const springSample = { value: 0, velocity: 0 };' "$cand_solver"
          grep -Fq 'solveSpring(params, t, 0, springSample, out);' "$cand_solver"
          grep -Fq 'solveSpring(this._spring, this._elapsed, this._v0Normalized, springSample);' "$cand_mv"
          mutated="$RUNNER_TEMP/mutated-motion-value.ts"
          sed '/Animation run state/i\  private readonly _solved = { value: 0, velocity: 0 };' "$cand_mv" > "$mutated"
          grep -Fq 'private readonly _solved = { value: 0, velocity: 0 };' "$mutated"
          printf 'baseline_instance_scratch=1\ncandidate_instance_scratch=0\nbaseline_solver_singleton=1\ncandidate_solver_singleton=1\npositive_control=RED-capable\n' > "$RUNNER_TEMP/structural.txt"
      - name: Build exact base
        run: cd "$RUNNER_TEMP/base" && pnpm build
      - name: Cross-instance and basis-overwrite differential
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/reentry.mjs" <<'EOF'
          import { pathToFileURL } from 'node:url';
          const { MotionValue } = await import(pathToFileURL(process.argv[2]).href);
          const spring = { mass: 1, stiffness: 180, damping: 18 };
          const makeClock = () => {
            const queue = [];
            return {
              requestFrame(cb) { queue.push(cb); return 1; },
              flush(ts) { const cb = queue.shift(); if (!cb) throw new Error('empty clock'); cb(ts); },
              pending() { return queue.length; },
            };
          };
          const ca = makeClock(), cb = makeClock();
          const a = new MotionValue({ initial: 0, spring, clamp: false, requestFrame: ca.requestFrame });
          const b = new MotionValue({ initial: -1, spring, clamp: false, requestFrame: cb.requestFrame });
          const trace = [];
          let nested = false;
          a.onChange((v) => {
            trace.push(['a', v, a.velocity]);
            if (!nested && v !== 0) {
              nested = true;
              b.setTarget(2);
              cb.flush(16);
              cb.flush(32);
            }
          });
          b.onChange((v) => trace.push(['b', v, b.velocity]));
          a.setTarget(1);
          ca.flush(16); ca.flush(32);
          for (let i = 0; i < 8; i++) {
            if (ca.pending()) ca.flush(48 + i * 16);
            if (cb.pending()) cb.flush(48 + i * 16);
          }
          a.setTarget(-0.25);
          if (ca.pending()) ca.flush(192);
          a.snapTo(0.5);
          b.stop(); a.destroy(); b.destroy();
          console.log(JSON.stringify(trace));
          EOF
          node "$RUNNER_TEMP/reentry.mjs" "$RUNNER_TEMP/base/dist/index.js" > "$RUNNER_TEMP/base-trace.json"
          node "$RUNNER_TEMP/reentry.mjs" "$RUNNER_TEMP/candidate/dist/index.js" > "$RUNNER_TEMP/candidate-trace.json"
          cmp "$RUNNER_TEMP/base-trace.json" "$RUNNER_TEMP/candidate-trace.json"
      - name: Frozen all-entry raw gzip Brotli differential
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/candidate/.research-bytes.mjs" <<'EOF'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const baseDir = process.env.RUNNER_TEMP + '/base/dist';
          const candidateDir = process.env.RUNNER_TEMP + '/candidate/dist';
          const walk = (root, dir = root, out = []) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(root, path, out);
              else if (name.endsWith('.js') || name.endsWith('.cjs')) out.push(relative(root, path));
            }
            return out.sort();
          };
          const baseFiles = walk(baseDir), candidateFiles = walk(candidateDir);
          if (JSON.stringify(baseFiles) !== JSON.stringify(candidateFiles)) throw new Error('runtime entry set changed');
          const metrics = (x) => ({ raw: x.length, gzip: canonicalGzip(x).length, brotli: observationalBrotli(x).length });
          const rows = {};
          for (const file of candidateFiles) {
            const base = readFileSync(`${baseDir}/${file}`), candidate = readFileSync(`${candidateDir}/${file}`);
            if (Buffer.compare(base, candidate) === 0) continue;
            const b = metrics(base), c = metrics(candidate);
            rows[file] = { base: b, candidate: c, delta: { raw: c.raw-b.raw, gzip: c.gzip-b.gzip, brotli: c.brotli-b.brotli } };
            for (const key of ['raw', 'gzip', 'brotli']) if (c[key] > b[key]) throw new Error(`${file} ${key} regressed: ${b[key]} -> ${c[key]}`);
          }
          if (!Object.keys(rows).length) throw new Error('candidate changed no runtime entry');
          const result = { base: process.env.BASE_SHA, candidate: process.env.CANDIDATE_SHA, node: process.version, changedRuntimeEntries: Object.keys(rows).length, rows, structural: { baselineInstanceScratch: 1, candidateInstanceScratch: 0, baselineSolverSingleton: 1, candidateSolverSingleton: 1 }, reentrantDifferential: 'exact-match' };
          writeFileSync(process.env.RUNNER_TEMP + '/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          EOF
          node "$RUNNER_TEMP/candidate/.research-bytes.mjs"
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: motion-value-solver-owned-scratch-${{ github.sha }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/structural.txt
            ${{ runner.temp }}/base-trace.json
            ${{ runner.temp }}/candidate-trace.json
          if-no-files-found: error
          retention-days: 7
