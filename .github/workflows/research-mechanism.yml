name: Mechanism research evidence
on:
  push:
    branches: [research/mechanism-20260912-r4]
    paths: [.github/workflows/research-mechanism.yml]
permissions: {}
concurrency:
  group: research-mechanism-20260912-r4
  cancel-in-progress: false
jobs:
  authoritative-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch unchanged authoritative graph on exact owned candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Labpics-Team/lab-motion
          CANDIDATE: 5ef3bfde8b52a7f09f0a418415d7fb6669faf542
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$REPO/git/ref/heads/perf/terminal-aggregate-20260912" --jq .object.sha)"
          [[ "$actual" == "$CANDIDATE" ]]
          gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=perf/terminal-aggregate-20260912
          printf 'Dispatched original ci.yml on exact head %s\n' "$CANDIDATE"
