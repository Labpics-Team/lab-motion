name: Mechanism research evidence
on:
  push:
    branches: [research/mechanism-20260912-r4]
    paths: [.github/workflows/research-mechanism.yml]
permissions: {}
concurrency:
  group: research-mechanism-review-fix
  cancel-in-progress: false
jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 5ef3bfde8b52a7f09f0a418415d7fb6669faf542
          fetch-depth: 0
          persist-credentials: false
      - name: Исправить подтверждённые замечания без исполнения зависимостей
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == count, (path, s.count(old), old)
              p.write_text(s.replace(old, new, count))

          replace('src/animate/index.ts',
            '// Последний permit принадлежит commit-фазе: synchronous unit completion\n  // не может завершить aggregate до публикации всех owners и Promise.',
            '// Последний пропуск принадлежит фазе фиксации: синхронное завершение юнита\n  // не может завершить группу до публикации всех владельцев и Promise.')
          replace('src/animate/index.ts',
            '// Terminal controls больше не владеют execution graph. Обнуляется и\n    // options: пользовательский callback может замыкать те же DOM-цели.',
            '// Завершённые controls больше не владеют внутренним графом исполнения. Снимается и\n    // ссылка на параметры: пользовательский обработчик может замыкать те же DOM-цели.')
          replace('src/animate/index.ts',
            '// Thenable-adoption сохраняет прежний публичный microtask order.',
            '// Ассимиляция thenable сохраняет прежний публичный порядок микрозадач.')
          replace('src/animate/index.ts',
            '// Host reporter не владеет завершением и освобождением ресурсов.',
            '// Средство отчётности среды не владеет завершением и освобождением ресурсов.')

          replace('CHANGELOG.md',
            '- `./animate`: завершённые controls освобождают граф юнитов и ссылки на\n  пользовательские options, включая замкнутые callback-ами DOM-цели. Одна\n  completion-защёлка сохраняет порядок `finished`/`onComplete`, синхронный\n  commit и C¹-подхват; методы завершённого controls остаются no-op.\n',
            '- `./animate`: завершённый объект управления освобождает внутренний граф\n  юнитов и ссылки на пользовательские параметры, включая DOM-цели в замыканиях\n  обработчиков. Единая защёлка сохраняет порядок `finished`/`onComplete`,\n  синхронную фазу фиксации и C¹-подхват; после завершения методы ничего не делают.\n')

          replace('test/animate-terminal-retention-gc.test.ts',
            "import { mkdtempSync, rmSync } from 'node:fs';",
            "import { existsSync, mkdtempSync, rmSync } from 'node:fs';")
          replace('test/animate-terminal-retention-gc.test.ts',
            "describe('завершённые animate controls не владеют execution graph', () => {",
            "describe('завершённый результат animate не удерживает внутренний граф', () => {")
          replace('test/animate-terminal-retention-gc.test.ts',
            "    it(`${entry}: release после natural/cancel/reduced и live-owner positive control`, async () => {\n      const work = mkdtempSync(join(tmpdir(), 'labmotion-animate-gc-'));",
            "    it(`${entry}: освобождение после завершения и контроль живого владельца`, async () => {\n      const packed = entry === 'source'\n        ? undefined\n        : resolve(ROOT, `dist/animate/index.${entry === 'cjs' ? 'cjs' : 'js'}`);\n      if (packed !== undefined && !existsSync(packed)) {\n        throw new Error(`нет собранного артефакта ${packed}: выполните сборку перед тестом`);\n      }\n      const work = mkdtempSync(join(tmpdir(), 'labmotion-animate-gc-'));")
          replace('test/animate-terminal-retention-gc.test.ts',
            '          // Каждый формат исполняет РЕАЛЬНЫЙ dist, без повторной минификации:\n          // inlining может вернуть общий closure context и скрыто восстановить retention.',
            '          // Каждый формат исполняет реальный собранный артефакт без повторной минификации:\n          // встраивание может вернуть общий контекст замыкания и снова скрыто удерживать цель.')
          replace('test/animate-terminal-retention-gc.test.ts',
            "                path: pathToFileURL(resolve(ROOT, `dist/animate/index.${entry === 'cjs' ? 'cjs' : 'js'}`)).href,",
            '                path: pathToFileURL(packed!).href,')

          replace('test/fixtures/animate-terminal-retention-gc.probe.ts',
            '// Main-thread использует другой owner и отложенный rAF-drain, но тот же\n// закон terminal-агрегата. Очередь стенда не должна удерживать снятый batch.',
            '// Главный поток использует другого владельца и отложенное опустошение rAF, но тот же\n// закон завершения. Очередь стенда не должна удерживать снятый пакет.')
          replace('test/fixtures/animate-terminal-retention-gc.probe.ts',
            '// Положительный контроль: GC не должен стирать достижимую цель активного owner.',
            '// Положительный контроль: GC не должен стирать достижимую цель активного владельца.')
          replace('test/fixtures/animate-terminal-retention-gc.probe.ts',
            '// Завершённый handle остаётся полноценным no-op API, а не «уничтоженным» объектом.',
            '// Завершённый объект управления сохраняет API, но его методы ничего не делают.')

          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only 5ef3bfde8b52a7f09f0a418415d7fb6669faf542)
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 4 ]]
          printf '%s\n' "${changed[@]}" | sort | diff -u - <(printf '%s\n' CHANGELOG.md src/animate/index.ts test/animate-terminal-retention-gc.test.ts test/fixtures/animate-terminal-retention-gc.probe.ts | sort)
          git add -- "${changed[@]}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(animate): замкнуть локальную проверку удержания'
          git rev-parse HEAD > candidate-head.txt
      - name: Опубликовать только ветку кандидата
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:refs/heads/perf/terminal-aggregate-20260912
          cat candidate-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-review-fix-${{ github.run_id }}
          path: candidate-head.txt
          if-no-files-found: error
          retention-days: 7
