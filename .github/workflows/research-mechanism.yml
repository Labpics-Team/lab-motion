name: Mechanism research evidence
on:
  push:
    branches: [research/mechanism-20260912-r4]
    paths: [.github/workflows/research-mechanism.yml]
permissions: {}
concurrency:
  group: research-mechanism-final-seal
  cancel-in-progress: false
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'
  BASE: 93278bf9b540f93521c7bd4c02f68db458e5db7a
  PRE_REVIEW: 5ef3bfde8b52a7f09f0a418415d7fb6669faf542
  CANDIDATE: 43e73632560b6b3b289b0243c122b3e6f4479e8d
jobs:
  seal-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.20.0'
      - name: Проверить неизменность исполняемого артефакта после замечаний ревью
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.11.0
          mkdir -p evidence
          git worktree add --detach "$RUNNER_TEMP/pre" "$PRE_REVIEW"
          git worktree add --detach "$RUNNER_TEMP/final" "$CANDIDATE"
          for name in pre final; do
            (cd "$RUNNER_TEMP/$name" && pnpm install --frozen-lockfile && pnpm build) > "evidence/$name-build.log" 2>&1
          done
          cmp "$RUNNER_TEMP/pre/dist/animate/index.js" "$RUNNER_TEMP/final/dist/animate/index.js"
          cmp "$RUNNER_TEMP/pre/dist/animate/index.cjs" "$RUNNER_TEMP/final/dist/animate/index.cjs"
          sha256sum "$RUNNER_TEMP/pre/dist/animate/index.js" "$RUNNER_TEMP/final/dist/animate/index.js" > evidence/animate-esm.sha256
          sha256sum "$RUNNER_TEMP/pre/dist/animate/index.cjs" "$RUNNER_TEMP/final/dist/animate/index.cjs" > evidence/animate-cjs.sha256
          cd "$RUNNER_TEMP/final"
          pnpm vitest run test/animate-terminal-retention-gc.test.ts | tee "$GITHUB_WORKSPACE/evidence/gc-test.log"
          pnpm size | tee "$GITHUB_WORKSPACE/evidence/size.log"
          git status --porcelain > "$GITHUB_WORKSPACE/evidence/status.txt"
          test ! -s "$GITHUB_WORKSPACE/evidence/status.txt"
          {
            printf 'base=%s\npre_review=%s\ncandidate=%s\n' "$BASE" "$PRE_REVIEW" "$CANDIDATE"
            node --version
            pnpm --version
            uname -a
          } > "$GITHUB_WORKSPACE/evidence/environment.txt"
      - name: Запустить неизменённый authoritative CI на точной ревизии
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Labpics-Team/lab-motion
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$REPO/git/ref/heads/perf/terminal-aggregate-20260912" --jq .object.sha)"
          [[ "$actual" == "$CANDIDATE" ]]
          gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=perf/terminal-aggregate-20260912
          printf 'dispatched exact candidate %s\n' "$CANDIDATE" | tee evidence/dispatch.txt
      - name: Запечатать квитанции
        if: always()
        run: find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: terminal-final-seal-${{ env.CANDIDATE }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
