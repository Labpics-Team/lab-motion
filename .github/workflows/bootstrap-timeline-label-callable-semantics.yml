name: Bootstrap timeline label callable semantics

on:
  push:
    branches: ["perf/timeline-label-owner-fusion-20260915"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Add callable-semantics oracle and prove RED
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('test/timeline-label-owner-allocation.test.ts')
          s = p.read_text()
          marker = "  it('detects a deliberate extra retained-shape Map', () => {\n"
          block = """  it('keeps the public label control non-constructable', () => {\n    const tl = createTimeline({\n      segments: [{ from: 0, to: 1, duration: 1 }],\n      requestFrame: () => 1,\n    });\n    expect(Object.hasOwn(tl.label, 'prototype')).toBe(false);\n    expect(() => Reflect.construct(tl.label as unknown as Function, [])).toThrow(TypeError);\n    tl.cancel();\n  });\n\n"""
          if s.count(marker) != 1:
            raise SystemExit('test insertion marker mismatch')
          p.write_text(s.replace(marker, block + marker))
          PY
          set +e
          pnpm vitest run test/timeline-label-owner-allocation.test.ts > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -F "keeps the public label control non-constructable" /tmp/red.log
      - name: Preserve callable semantics without restoring duplicate implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/timeline/index.ts')
          s = p.read_text()
          old = """  function label(name: string, at?: number | string): void {\n    if (!name || typeof name !== 'string') return;\n    let t: number;\n    if (at === undefined) {\n      t = _vt;\n    } else if (typeof at === 'number') {\n      t = Number.isFinite(at) ? Math.max(0, at) : _vt;\n    } else if (typeof at === 'string') {\n      t = _labels.has(at) ? _labels.get(at)! : _vt;\n    } else {\n      t = _vt;\n    }\n    _labels.set(name, t);\n  }\n"""
          new = """  const label = (name: string, at?: number | string): void => {\n    if (!name || typeof name !== 'string') return;\n    let t: number;\n    if (at === undefined) {\n      t = _vt;\n    } else if (typeof at === 'number') {\n      t = Number.isFinite(at) ? Math.max(0, at) : _vt;\n    } else if (typeof at === 'string') {\n      t = _labels.has(at) ? _labels.get(at)! : _vt;\n    } else {\n      t = _vt;\n    }\n    _labels.set(name, t);\n  };\n"""
          if s.count(old) != 1:
            raise SystemExit('label function block mismatch')
          p.write_text(s.replace(old, new))
          PY
          grep -F "const label = (name: string, at?: number | string): void =>" src/timeline/index.ts
          test "$(grep -c '^    label,$' src/timeline/index.ts)" -eq 1
      - name: Verify hardened candidate and strict Pareto
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm vitest run test/timeline*.test.ts
          pnpm build
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';
          const frozenBase = {
            'dist/timeline/index.js': { raw: 3590, gzip: 1641, brotli: 1503 },
            'dist/timeline/index.cjs': { raw: 3597, gzip: 1644, brotli: 1503 },
          };
          let improved = false;
          for (const [path, base] of Object.entries(frozenBase)) {
            const b = readFileSync(path);
            const candidate = { raw: b.length, gzip: canonicalGzip(b).length, brotli: observationalBrotli(b).length };
            console.log('PACKED', path, JSON.stringify({ base, candidate }));
            for (const k of ['raw', 'gzip', 'brotli']) {
              if (candidate[k] > base[k]) throw new Error(`${path} ${k} regressed ${base[k]} -> ${candidate[k]}`);
              if (candidate[k] < base[k]) improved = true;
            }
          }
          if (!improved) throw new Error('candidate has no shipped-size improvement');
          EOF
      - name: Commit product hardening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/timeline/index.ts test/timeline-label-owner-allocation.test.ts
          git commit -m 'test(timeline): preserve label callable semantics'
          git push origin HEAD:perf/timeline-label-owner-fusion-20260915
