name: Surface delivery blob receipt
on:
  push:
    branches: [research/surface-delivery-receipt-20260912-audit]
permissions:
  contents: write
jobs:
  document-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7585687593d5cb726855b6f6daa0aac2ece56908
          persist-credentials: false
      - name: Produce only the registered changelog blob, never a branch or commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = '2dbfdb22fd1b8984e5791698b7d4a8931e5b8131'
          test "$(git hash-object CHANGELOG.md)" = 'a6fbaae472a30989562cdabd09c743bf05ba6e60'
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '### Изменено\n'
          addition = ('- Компилятор `motionCompiler()` больше не разбирает повторно собственные\n'
                      '  Surface CSS-артефакты: удалены лишние проходы и промежуточные массивы,\n'
                      '  уменьшен размер входа `compiler/vite`. Публичное поведение сохранено (#368).\n')
          assert text.count(marker) == 1 and addition not in text
          p.write_text(text.replace(marker, marker + addition, 1))
          Path('/tmp/surface-changelog-blob.json').write_text(json.dumps({'content': p.read_text(), 'encoding': 'utf-8'}))
          PY
          test "$(git hash-object CHANGELOG.md)" = '91b01f1bad39b6bd588f71d412442979b0e0102e'
          git diff --check
          test "$(git diff --name-only)" = 'CHANGELOG.md'
          git diff -- CHANGELOG.md
          result=$(gh api --method POST repos/Labpics-Team/lab-motion/git/blobs --input /tmp/surface-changelog-blob.json --jq .sha)
          test "$result" = '91b01f1bad39b6bd588f71d412442979b0e0102e'
          printf 'VERIFIED_CHANGELOG_BLOB=%s\n' "$result"
