name: PROFILE-01 CDP calibration (temporary)

on:
  push:
    branches: ["research/r11-profile-prereg-20260915"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cdp-calibration-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  calibrate:
    name: Chromium · frozen A/A + deliberate 2x
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --dir bench/compare exec playwright install --with-deps chromium

      - name: Build exact package and showcase
        run: pnpm site:build

      - name: Acquire calibration receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench/profile/out
          node browser/fixtures/server.mjs 6182 >bench/profile/out/server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error http://127.0.0.1:6182/site/dist/index.html >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent --show-error http://127.0.0.1:6182/site/dist/index.html >/dev/null
          set +e
          PROFILE_CDP_BASE_URL=http://127.0.0.1:6182 \
          PROFILE_CDP_OUTPUT=bench/profile/out/cdp-sampling-calibration.json \
            node bench/profile/calibrate-cdp-sampling.mjs \
            >bench/profile/out/acquisition.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" >bench/profile/out/exit-code.txt
          if [[ -f bench/profile/out/cdp-sampling-calibration.json ]]; then
            sha256sum bench/profile/out/cdp-sampling-calibration.json >bench/profile/out/SHA256SUMS
          fi

      - name: Upload immutable calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-cdp-calibration-${{ github.sha }}-${{ github.run_id }}
          path: bench/profile/out/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Enforce calibration verdict
        shell: bash
        run: |
          set -euo pipefail
          [[ -f bench/profile/out/exit-code.txt ]]
          [[ "$(cat bench/profile/out/exit-code.txt)" == "0" ]]
