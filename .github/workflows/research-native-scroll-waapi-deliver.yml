name: Native scroll WAAPI delivery fix

on:
  push:
    branches: ["feat/native-scroll-waapi-20260912"]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.20.0"
      - run: |
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm install --frozen-lockfile
      - name: Reapply already-proven deterministic slice from carrier
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import YAML from 'yaml';
          const workflow = YAML.parse(readFileSync('.github/workflows/research-native-scroll-waapi.yml', 'utf8'));
          for (const name of ['Add native-scroll oracle', 'Implement narrow native scroll bridge']) {
            const step = workflow.jobs['red-green'].steps.find(step => step.name === name);
            if (!step?.run) throw new Error(`missing carrier step: ${name}`);
            const path = `/tmp/${name.replaceAll(/[^a-z0-9]/gi, '-')}.sh`;
            writeFileSync(path, `set -euo pipefail\n${step.run}\n`);
            execFileSync('bash', [path], { stdio: 'inherit' });
          }
          NODE
      - name: Reverify GREEN and budgets
        run: |
          pnpm vitest run test/waapi-scroll-timeline.test.ts test/waapi-emit.test.ts
          pnpm typecheck:native
          pnpm build
          pnpm size
      - name: Commit only owned slice and clean carriers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/research-native-scroll-waapi.yml
          rm .github/workflows/research-native-scroll-waapi-deliver.yml

          mapfile -t changed < <(git diff --name-only)
          printf 'changed paths:\n'; printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/research-native-scroll-waapi.yml|\
              .github/workflows/research-native-scroll-waapi-deliver.yml|\
              CHANGELOG.md|\
              browser/24-native-scroll-timeline.spec.ts|\
              docs/api.md|\
              src/waapi/index.ts|\
              test/waapi-emit.test.ts|\
              test/waapi-scroll-timeline.test.ts) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done

          for required in \
            CHANGELOG.md \
            browser/24-native-scroll-timeline.spec.ts \
            docs/api.md \
            src/waapi/index.ts \
            test/waapi-emit.test.ts \
            test/waapi-scroll-timeline.test.ts; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "missing required product path: $required" >&2
              exit 1
            }
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(waapi): отдать scroll progress нативному timeline'
          git push origin HEAD:feat/native-scroll-waapi-20260912
