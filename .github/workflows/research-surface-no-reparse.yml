name: Surface batch boundary diagnosis
on:
  push:
    branches: [research/surface-no-reparse-phase-20260912-9f6c]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Download immutable prior inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '10292153698'
          github-token: ${{ github.token }}
          repository: Labpics-Team/lab-motion
          run-id: '34676904520'
          path: seed/evidence
          digest-mismatch: error
      - name: Verify input lineage and diagnose baseline only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence seed/source
          (cd seed && sha256sum --check evidence/manifest.sha256)
          printf '%s  %s\n' '89af8424dd53e560b1933f87ba650d8bf57c83ca5a04600eefb31f416aabbae7' "$(command -v node)" | sha256sum --check
          tar -xzf seed/evidence/built-entries.tar.gz -C seed/evidence
          tar -xzf seed/evidence/base-source.tar.gz -C seed/source
          cp seed/source/package.json seed/evidence/baseline/package.json
          cp seed/source/package.json seed/evidence/candidate/package.json
          (cd seed/evidence && sha256sum --check compiler-dist.sha256)
          printf '%s\n' "$GITHUB_SHA" > evidence/carrier-sha.txt
          sha256sum harness/.research/surface-batch-diagnosis.mjs > evidence/research-inputs.sha256
          SEED_DIR="$PWD/seed/evidence" EVIDENCE_DIR="$PWD/evidence" node harness/.research/surface-batch-diagnosis.mjs | tee evidence/diagnosis.log
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          find evidence -maxdepth 1 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence/manifest.sha256
      - name: Upload immutable diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface-batch-diagnosis-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
