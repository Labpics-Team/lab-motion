name: Surface public proof
on:
  push:
    branches: [research/surface-continuation-20260912]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6076e9a4ec43ad49ae8245b48ba6bf24dbc10e51
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7d09c6dc5a496a24efa3682c8cbb8c827b9f2ba7
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6008d916ac053bc104050d9c75aad69b04d4a878
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Одна физическая frozen toolchain при равных dependency inputs
        run: |
          set -euo pipefail
          cmp baseline/pnpm-lock.yaml candidate/pnpm-lock.yaml
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('baseline/package.json'));
          const b=JSON.parse(readFileSync('candidate/package.json'));
          for(const key of ['dependencies','devDependencies','optionalDependencies','peerDependencies','packageManager']) assert.deepEqual(a[key],b[key],key);
          JS
          corepack enable
          corepack install --global pnpm@11.11.0
          pnpm --dir baseline install --frozen-lockfile
          test ! -e candidate/node_modules
          ln -s "$PWD/baseline/node_modules" candidate/node_modules
      - name: Единственный пререгистрированный public comparison
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node harness/scripts/bench-surface-pair.mjs --base "$PWD/baseline" --candidate "$PWD/candidate" --out "$RUNNER_TEMP/surface-proof" 2>&1 | tee "$RUNNER_TEMP/surface-proof.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/surface-proof-exit.txt"
          if [[ -f "$RUNNER_TEMP/surface-proof/raw.sha256.json" ]]; then
            node harness/scripts/bench-surface-pair.mjs --verify "$RUNNER_TEMP/surface-proof" | tee "$RUNNER_TEMP/surface-proof-replay.json"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: surface-public-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/surface-proof
            ${{ runner.temp }}/surface-proof.log
            ${{ runner.temp }}/surface-proof-exit.txt
            ${{ runner.temp }}/surface-proof-replay.json
          if-no-files-found: error
          retention-days: 30
