name: Research compact RDP emitter

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: research-compact-rdp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.head_ref == 'research/compositor-compact-rdp-emitter' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply preregistered candidate
        run: node scripts/research-compact-rdp.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Static and native types
        run: |
          pnpm check:static
          pnpm typecheck:native

      - name: Build candidate
        run: pnpm build

      - name: Focused semantic and ownership oracles
        run: >-
          pnpm vitest run
          test/animate-spring-cache.test.ts
          test/compositor-compile-work.test.ts
          test/compositor-webkit-execution.test.ts
          test/compositor-serialized-execution.test.ts
          test/compositor-compile.test.ts
          test/compositor-error-bound.test.ts
          test/compositor-velocity-budget.test.ts

      - name: Candidate canonical protected size vector
        run: |
          echo '=== CANDIDATE SIZE ==='
          pnpm size
          cp -a dist /tmp/candidate-dist

      - name: Exact-base paired size vector
        shell: bash
        run: |
          set -euo pipefail
          BASE=93278bf9b540f93521c7bd4c02f68db458e5db7a
          git worktree add --detach /tmp/lab-motion-base "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/lab-motion-base/node_modules
          pnpm --dir /tmp/lab-motion-base build
          echo '=== EXACT BASE SIZE ==='
          pnpm --dir /tmp/lab-motion-base size
          BASE_DIR=/tmp/lab-motion-base CANDIDATE_DIST=/tmp/candidate-dist node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { canonicalGzip, observationalBrotli } from './scripts/compression-oracle.mjs';

          const baseDir = process.env.BASE_DIR + '/dist';
          const candidateDir = process.env.CANDIDATE_DIST;
          const files = [];
          function walk(root, dir = root) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) walk(root, path);
              else if (/\.(?:js|cjs)$/.test(entry.name)) files.push(relative(root, path));
            }
          }
          walk(baseDir);
          let regressions = 0;
          console.log('=== EXACT DIST DELTAS candidate-base (raw/gzip/brotli bytes) ===');
          for (const file of files.sort()) {
            const base = readFileSync(join(baseDir, file));
            const candidate = readFileSync(join(candidateDir, file));
            const delta = [
              candidate.length - base.length,
              canonicalGzip(candidate).length - canonicalGzip(base).length,
              observationalBrotli(candidate).length - observationalBrotli(base).length,
            ];
            if (delta.some(Boolean)) console.log(`${file}: ${delta.join('/')}`);
            if (delta.some((value) => value > 0)) regressions++;
          }
          console.log(`protected-dist-files-with-any-positive-delta=${regressions}`);
          NODE

      - name: Commit admitted source candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src test; then
            echo "candidate already materialized"
            exit 0
          fi
          git config user.name "lab-motion-research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/compositor/segmenter.ts \
            src/compositor/curve.ts \
            test/animate-spring-cache.test.ts \
            test/compositor-compile-work.test.ts \
            test/compositor-webkit-execution.test.ts \
            test/compositor-serialized-execution.test.ts
          git commit -m "perf(compositor): serialize RDP grid without transient nodes"
          git push origin HEAD:${{ github.head_ref }}
