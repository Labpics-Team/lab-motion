name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile_baseline:
        description: 'Снять зарегистрированный размерный baseline PROFILE-01'
        type: boolean
        default: false
      performance_baseline:
        description: 'Commit для парного сравнения полной стоимости движения'
        type: string
        default: ''
      s5_capture_diagnostic:
        description: 'Диагностика S5 с полными raw/PNG; обязателен performance_baseline (полный SHA)'
        type: boolean
        default: false
      performance_contract_only:
        description: 'Только контракты CLI в Chromium без парных измерений; обязателен performance_baseline (полный SHA)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # push в main не отменяем: каждый merge-коммит обязан получить завершённый
  # прогон (иначе красный промежуточный main живёт незамеченным, bisect ломается).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  performance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_baseline != '' && !(inputs.profile_baseline && (inputs.s5_capture_diagnostic || inputs.performance_contract_only)) && !(inputs.s5_capture_diagnostic && inputs.performance_contract_only) }}
    uses: ./.github/workflows/performance.yml
    with:
      baseline: ${{ inputs.performance_baseline }}
      s5_capture_diagnostic: ${{ inputs.s5_capture_diagnostic }}
      performance_contract_only: ${{ inputs.performance_contract_only }}

  # Только явный baseline-запрос: обычный кандидат может менять runtime и
  # не обязан совпадать с зарегистрированным старым источником PROFILE-01.
  profile-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_baseline && !inputs.s5_capture_diagnostic && !inputs.performance_contract_only }}
    uses: ./.github/workflows/profile-01.yml

  verify:
    name: typecheck · build · size · package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # docs-facts сверяет байты с immutable ревизией за пределами HEAD.
          fetch-depth: 0

      # Бинарник и его digest зафиксированы, чтобы валидация workflow не зависела от mutable action.
      - name: GitHub Actions contract
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum --check --status -
          mkdir "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static contract
        run: pnpm check:static

      # Нативный TypeScript — обязательный merge-гейт (бриф D3), но отдельным
      # шагом, а не внутри check:static: его отказ должен быть виден как свой
      # красный чек, а release.yml зовёт check:static и не обязан зависеть от
      # preview-компилятора. Тест разобранного workflow проверяет обязательный
      # вызов native-скрипта, включая отказ от условного пропуска.
      - name: Native typecheck (TS7)
        run: pnpm typecheck:native

      - name: Build
        run: pnpm build

      - name: Factual documentation drift
        run: node scripts/check-docs-facts.mjs

      - name: Structural documentation drift
        run: node scripts/check-docs-drift.mjs

      - name: Repository issue forms contract
        run: node scripts/check-issue-forms.mjs

      - name: Release contract smoke
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/check-release.mjs "v${version}" --validate-stored-date

      - name: Size gate
        run: pnpm size

      - name: Consumer compatibility
        run: pnpm pack:compat

      # Приёмка компиляторного среза (#208): реальный Vite-build fixture'а с
      # плагином и без — доказывает элиминацию solver/parser/compiler из бандла
      # потребителя и строго меньший вес. dist уже собран шагом Build выше.
      - name: Compiler lowering acceptance
        run: pnpm acceptance:compiler

      # Сборка использует Node 24; оба consumer runtime читают один пакет
      # из отдельной установки без dev dependencies и без передачи между jobs.
      - name: Pack Node-floor candidate
        run: |
          mkdir node-floor-artifact
          pnpm pack --pack-destination node-floor-artifact

      - name: Consumer smoke on build runtime
        shell: bash
        run: |
          shopt -s nullglob
          archives=(node-floor-artifact/*.tgz)
          [[ ${#archives[@]} -eq 1 ]] \
            || { echo "::error::ожидался ровно один tgz, найдено: ${#archives[@]}"; exit 1; }
          node scripts/pack-smoke.mjs "${archives[0]}"

      - name: Setup consumer Node floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.0.0"

      - name: Consumer smoke on minimum runtime
        shell: bash
        run: |
          test "$(node --version)" = v22.0.0
          shopt -s nullglob
          archives=(node-floor-artifact/*.tgz)
          [[ ${#archives[@]} -eq 1 ]] \
            || { echo "::error::ожидался ровно один tgz, найдено: ${#archives[@]}"; exit 1; }
          node scripts/pack-smoke.mjs "${archives[0]}"

  # Независимые проверки исполняются на разных машинах, а не конкурируют
  # за CPU/RAM одного runner. Малый build дешевле дополнительного artifact join;
  # каждый suite проверяет dist собственного exact checkout, без result cache.
  tests:
    name: test · fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release replay-тесты читают старые теги и их историю.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Vitest
        shell: bash
        run: |
          set +e
          pnpm vitest run 2>&1 | tee vitest.log
          status=${PIPESTATUS[0]}
          exit "$status"

      # Проверяем настоящий C/header/API на зарегистрированном Node, сохраняя
      # обычный suite выше на текущем Node24. Это не performance calibration.
      - name: Setup registered native-clock Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"

      - name: Native CPU clock · actual source and refusal controls
        run: node test/fixtures/server-thread-cpu-clock-check.mjs

  mutation:
    name: driver mutation
    # Обязательная merge queue проверяет полный driver на собранном источнике
    # до слияния; PR и последующий main не повторяют эту тяжёлую кампанию.
    # Ручной CI сохраняет полную квалификацию по явному запросу.
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Stryker и выбранные тесты читают src; dist проверяется другими наборами.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Мутируем весь src/driver.ts; неизвестный killable survivor ниже пола
      # блокирует merge_group и не допускает слияние.
      - name: Driver mutation gate
        run: pnpm exec stryker run stryker.driver.config.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, configuration and secrets
        run: |
          set -euo pipefail
          # trivy читает переменные TRIVY_* как флаги: охват проверки задаёт только этот шаг.
          unset "${!TRIVY_@}"
          version=0.74.0
          sum=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          echo "$sum  $dir/trivy.tgz" | sha256sum -c -
          tar -xzf "$dir/trivy.tgz" -C "$dir" trivy
          accepted=(--ignorefile /dev/null)
          [ -f .trivyignore.yaml ] && accepted=(--ignorefile .trivyignore.yaml)
          # Настройки сканера задаёт шаг: trivy.yaml из проверяемого дерева их не меняет.
          scan() { "$dir/trivy" fs --config /dev/null --cache-dir "$dir/cache" --exit-code 1 --no-progress "$@" .; }
          scan --scanners vuln,misconfig --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps "${accepted[@]}"
          # Исправление вышло — принятая раньше уязвимость снова блокирует.
          scan --scanners vuln --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps --ignore-unfixed --ignorefile /dev/null
          # Секрет в тестах, примерах и документации — такая же утечка: встроенные исключения trivy для них сняты,
          # а записи .trivyignore.yaml к секретам не применяются.
          printf 'disable-allow-rules:\n  - tests\n  - examples\n  - markdown\n' > "$dir/secret.yaml"
          scan --scanners secret --secret-config "$dir/secret.yaml" --ignorefile /dev/null
          # Тот же путь сканирования должен заметить тестовый ключ внутри examples/.
          # Проба живёт только в окружении CI и не попадает в исходники.
          probe_dir=$(mktemp -d examples/ci-trivy-canary.XXXXXXXX)
          trap 'rm -rf -- "$probe_dir"' EXIT
          probe_file="$probe_dir/credentials.txt"
          python3 test/ci-trivy-canary.py seed "$probe_file"
          set +e
          scan --scanners secret --secret-config "$dir/secret.yaml" --ignorefile /dev/null --format json > "$dir/secret-canary.json"
          canary_status=$?
          set -e
          python3 test/ci-trivy-canary.py verify "$dir/secret-canary.json" "$probe_file" "$canary_status"
          rm -rf -- "$probe_dir"
          trap - EXIT

  documentation:
    uses: ./.github/workflows/docs.yml

  browser-static:
    uses: ./.github/workflows/browser.yml

  CI:
    name: CI
    if: ${{ always() }}
    needs: [verify, tests, mutation, browser-static, documentation, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every candidate check
        shell: bash
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          S5_CAPTURE_DIAGNOSTIC: ${{ inputs.s5_capture_diagnostic }}
          PERFORMANCE_CONTRACT_ONLY: ${{ inputs.performance_contract_only }}
          PROFILE_BASELINE: ${{ inputs.profile_baseline }}
          PERFORMANCE_BASELINE: ${{ inputs.performance_baseline }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && ( "$S5_CAPTURE_DIAGNOSTIC" == true || "$PERFORMANCE_CONTRACT_ONLY" == true ) ]]; then
            [[ "$PERFORMANCE_BASELINE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PROFILE_BASELINE" != true ]]
            [[ "$S5_CAPTURE_DIAGNOSTIC" != true || "$PERFORMANCE_CONTRACT_ONLY" != true ]]
          fi
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          event = os.environ['EVENT_NAME']
          if event not in {'pull_request', 'push', 'merge_group', 'workflow_dispatch'}:
              raise SystemExit('Unexpected CI event')
          mutation_result = 'success' if event in {'merge_group', 'workflow_dispatch'} else 'skipped'
          if (not isinstance(results, dict) or not results
              or not isinstance(results.get('mutation'), dict)
              or results['mutation'].get('result') != mutation_result
              or any(not isinstance(check, dict)
                     or check.get('result') != 'success'
                     for name, check in results.items() if name != 'mutation')):
              raise SystemExit('Every required check must succeed; mutation must match the CI event')
          PY
