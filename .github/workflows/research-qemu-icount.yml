name: Research QEMU ICount

on:
  push:
    branches: ["research/bindgroup-qemu-icount-20260915-r1"]

permissions:
  contents: read

jobs:
  q1-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install source-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc git python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev curl ca-certificates
          mkdir -p research-artifact research-build
          {
            echo "runner_image=${ImageOS:-unknown}"
            gcc --version | head -n 1
            python3 --version
            ninja --version
            uname -a
          } | tee research-artifact/environment.txt

      - name: Build pinned QEMU x86_64 linux-user with plugins
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch v8.2.2 https://github.com/qemu/qemu.git research-build/qemu-src
          source_sha="$(git -C research-build/qemu-src rev-parse HEAD)"
          [[ "$source_sha" == "11aa0b1ff115b86160c4d37e7c37e6a6b13b77ea" ]]
          mkdir research-build/qemu-out
          (
            cd research-build/qemu-out
            ../qemu-src/configure \
              --target-list=x86_64-linux-user \
              --enable-plugins \
              --disable-docs \
              | tee ../../research-artifact/qemu-configure.txt
            ninja -j2 qemu-x86_64
          )
          qemu_bin="$PWD/research-build/qemu-out/qemu-x86_64"
          {
            echo "qemu_source_sha=$source_sha"
            "$qemu_bin" --version | head -n 1
            echo "configure=--target-list=x86_64-linux-user --enable-plugins --disable-docs"
          } | tee research-artifact/qemu-provenance.txt
          "$qemu_bin" -help | grep -F -- '-plugin' | tee research-artifact/qemu-plugin-option.txt
          sha256sum "$qemu_bin" | tee research-artifact/qemu-binary.sha256

      - name: Build frozen instruction-marker counter and guest
        shell: bash
        run: |
          set -euo pipefail
          cp research-build/qemu-src/include/qemu/qemu-plugin.h research-build/qemu-plugin.h
          sha256sum research-build/qemu-plugin.h | tee research-artifact/qemu-plugin-header.sha256

          cat > research-build/window-plugin.c <<'C'
          #include "qemu-plugin.h"
          #include <stdbool.h>
          #include <stdint.h>
          #include <inttypes.h>
          #include <stdio.h>
          #include <string.h>

          QEMU_PLUGIN_EXPORT int qemu_plugin_version = QEMU_PLUGIN_VERSION;

          #define LM_MAX_VCPU 256u
          static const uint8_t START_MARKER[8] = {0x0f,0x1f,0x84,0x00,0xdf,0x9b,0x57,0x13};
          static const uint8_t END_MARKER[8]   = {0x0f,0x1f,0x84,0x00,0xe0,0xac,0x68,0x24};

          static bool active[LM_MAX_VCPU];
          static uint64_t retired[LM_MAX_VCPU];
          static uint64_t windows[LM_MAX_VCPU];
          static uint64_t starts[LM_MAX_VCPU];
          static uint64_t ends[LM_MAX_VCPU];

          static void on_start(unsigned int vcpu_index, void *userdata) {
              (void)userdata;
              if (vcpu_index >= LM_MAX_VCPU) return;
              starts[vcpu_index]++;
              retired[vcpu_index] = 0;
              active[vcpu_index] = true;
          }

          static void on_end(unsigned int vcpu_index, void *userdata) {
              (void)userdata;
              if (vcpu_index >= LM_MAX_VCPU) return;
              ends[vcpu_index]++;
              active[vcpu_index] = false;
              windows[vcpu_index]++;
              char line[224];
              snprintf(line, sizeof(line),
                       "LM_QEMU_COUNT vcpu=%u window=%" PRIu64 " instructions=%" PRIu64
                       " starts=%" PRIu64 " ends=%" PRIu64 "\n",
                       vcpu_index, windows[vcpu_index], retired[vcpu_index],
                       starts[vcpu_index], ends[vcpu_index]);
              qemu_plugin_outs(line);
          }

          static void on_instruction(unsigned int vcpu_index, void *userdata) {
              (void)userdata;
              if (vcpu_index < LM_MAX_VCPU && active[vcpu_index]) {
                  retired[vcpu_index]++;
              }
          }

          static void on_tb_trans(qemu_plugin_id_t id, struct qemu_plugin_tb *tb) {
              (void)id;
              const size_t n = qemu_plugin_tb_n_insns(tb);
              for (size_t i = 0; i < n; i++) {
                  struct qemu_plugin_insn *insn = qemu_plugin_tb_get_insn(tb, i);
                  const size_t size = qemu_plugin_insn_size(insn);
                  const uint8_t *data = qemu_plugin_insn_data(insn);
                  if (size == sizeof(START_MARKER) && memcmp(data, START_MARKER, sizeof(START_MARKER)) == 0) {
                      qemu_plugin_register_vcpu_insn_exec_cb(insn, on_start, QEMU_PLUGIN_CB_NO_REGS, NULL);
                  } else if (size == sizeof(END_MARKER) && memcmp(data, END_MARKER, sizeof(END_MARKER)) == 0) {
                      qemu_plugin_register_vcpu_insn_exec_cb(insn, on_end, QEMU_PLUGIN_CB_NO_REGS, NULL);
                  } else {
                      qemu_plugin_register_vcpu_insn_exec_cb(insn, on_instruction, QEMU_PLUGIN_CB_NO_REGS, NULL);
                  }
              }
          }

          QEMU_PLUGIN_EXPORT int qemu_plugin_install(qemu_plugin_id_t id,
                                                     const qemu_info_t *info,
                                                     int argc, char **argv) {
              (void)argc; (void)argv;
              if (info->system_emulation) return -1;
              qemu_plugin_register_vcpu_tb_trans_cb(id, on_tb_trans);
              return 0;
          }
          C

          cat > research-build/guest.c <<'C'
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>

          __attribute__((noinline,noclone)) static void marker_start(void) {
              __asm__ volatile(".byte 0x0f,0x1f,0x84,0x00,0xdf,0x9b,0x57,0x13" ::: "memory");
          }

          __attribute__((noinline,noclone)) static void marker_end(void) {
              __asm__ volatile(".byte 0x0f,0x1f,0x84,0x00,0xe0,0xac,0x68,0x24" ::: "memory");
          }

          __attribute__((noinline,noclone)) static uint64_t work(uint64_t n) {
              volatile uint64_t x = 0x9e3779b97f4a7c15ULL;
              for (uint64_t i = 0; i < n; i++) {
                  x = (x ^ (i + 0x517cc1b727220a95ULL)) + 0x94d049bb133111ebULL;
              }
              return x;
          }

          int main(int argc, char **argv) {
              if (argc != 2) return 64;
              char *end = NULL;
              uint64_t n = strtoull(argv[1], &end, 10);
              if (!end || *end) return 65;
              marker_start();
              uint64_t checksum = work(n);
              marker_end();
              printf("LM_GUEST_META n=%" PRIu64 " checksum=%" PRIu64 "\n", n, checksum);
              return 0;
          }
          C

          gcc -O2 -fPIC -shared -fvisibility=hidden -Iresearch-build \
            research-build/window-plugin.c -o research-build/window-plugin.so
          gcc -O2 -fno-tree-vectorize -fno-unroll-loops \
            research-build/guest.c -o research-build/guest
          file research-build/window-plugin.so research-build/guest | tee research-artifact/binaries.txt
          objdump -d research-build/guest | grep -A4 -B2 -E '13579bdf|2468ace0|df 9b 57 13|e0 ac 68 24' \
            | tee research-artifact/marker-disassembly.txt
          sha256sum research-build/window-plugin.so research-build/guest \
            | tee research-artifact/binaries.sha256

      - name: Acquire frozen Q1 controls
        shell: bash
        run: |
          set -euo pipefail
          qemu_bin="$PWD/research-build/qemu-out/qemu-x86_64"
          for spec in zero-a:0 zero-b:0 n-a:20000 n-b:20000 two-n:40000; do
            name="${spec%%:*}"
            n="${spec##*:}"
            "$qemu_bin" -plugin ./research-build/window-plugin.so ./research-build/guest "$n" \
              >"research-artifact/${name}.log" 2>&1
          done

          python3 - <<'PY'
          import json, math, pathlib, re
          root = pathlib.Path('research-artifact')
          def count(name):
              text=(root/f'{name}.log').read_text()
              found=re.findall(r'LM_QEMU_COUNT vcpu=(\d+) window=(\d+) instructions=(\d+) starts=(\d+) ends=(\d+)', text)
              if len(found) != 1:
                  raise SystemExit(f'{name}: expected exactly one count, got {found!r}')
              vcpu, window, value, starts, ends=map(int, found[0])
              if value <= 0 or window != 1 or starts != 1 or ends != 1:
                  raise SystemExit(f'{name}: invalid counter tuple {found[0]!r}')
              if 'LM_GUEST_META' not in text:
                  raise SystemExit(f'{name}: guest did not complete')
              return {'vcpu':vcpu,'window':window,'instructions':value,'starts':starts,'ends':ends}
          za,zb,na,nb,tn=(count(x) for x in ('zero-a','zero-b','n-a','n-b','two-n'))
          z=(za['instructions']+zb['instructions'])/2
          wa=na['instructions']-z
          wb=nb['instructions']-z
          w2=tn['instructions']-z
          if min(wa,wb,w2) <= 0:
              raise SystemExit(f'non-positive derived work: {wa=} {wb=} {w2=}')
          zero_ratio=max(za['instructions'],zb['instructions'])/min(za['instructions'],zb['instructions'])
          n_ratio=max(wa,wb)/min(wa,wb)
          sensitivity=w2/math.sqrt(wa*wb)
          result={
              'zeroA':za,'zeroB':zb,'nA':na,'nB':nb,'twoN':tn,
              'zeroBaseline':z,'derivedNA':wa,'derivedNB':wb,'derived2N':w2,
              'zeroRatio':zero_ratio,'nDerivedRatio':n_ratio,'sensitivityRatio':sensitivity,
          }
          (root/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if zero_ratio > 1.001:
              raise SystemExit(f'zero null failed: {zero_ratio}')
          if n_ratio > 1.001:
              raise SystemExit(f'N null failed: {n_ratio}')
          if not (1.99 <= sensitivity <= 2.01):
              raise SystemExit(f'2x sensitivity failed: {sensitivity}')
          PY

          sha256sum research-artifact/* | tee research-artifact/SHA256SUMS

      - name: Upload immutable Q1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-icount-q1-${{ github.sha }}-${{ github.run_id }}
          path: research-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
