name: Surface 366 portable test object
on:
  push:
    branches: [research/surface366-transport-20260912]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09ece9a91fa88f7ddcbea0425f4551db49ad6a0f
          persist-credentials: false
      - name: Publish exact locally tested portable expectation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt"
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          p=Path('test/bench-surface-pair.test.ts')
          old="base: path.resolve('.'), candidate: path.resolve('..'), out: '/tmp/new',"
          source=p.read_text()
          assert source.count(old)==1
          data=source.replace(old,"base: path.resolve('.'), candidate: path.resolve('..'), out: path.resolve('/tmp/new'),").encode()
          expected='6738e4c1654c8dd1c624d34a82219ae2576cb593'
          assert subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip()==expected
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=payload))
          assert result['sha']==expected
          Path(os.environ['RUNNER_TEMP'],'receipt','object.json').write_text(json.dumps({'path':str(p),'sha':expected,'refWrites':0}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface366-portable-object-${{ github.sha }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 7
