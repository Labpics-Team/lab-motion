name: Surface 366 terminal receipt object transport
on:
  push:
    branches: [research/surface366-transport-20260912]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5105ffec63f4e35bd780345178a013223295822a
          path: source
          persist-credentials: false
      - name: Reconstruct locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          data = lzma.decompress(base64.b64decode(Path('carrier/research-surface366-transfer.xz.b64').read_bytes()))
          assert hashlib.sha256(data).hexdigest() == 'f181ac8a72b0e20faa17eae76666d2cb22ac22b02abf0bc7ae63ef43846e320f'
          Path('transfer.patch').write_bytes(data)
          PY
          cd source
          git apply --check ../transfer.patch
          git apply ../transfer.patch
      - name: Publish only verified content objects, never refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/object-receipt"
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          files = {'docs/surface-benchmark.md':'0ee359977c59e3cc1acbf3fc5204f18121451c88','scripts/bench-surface-pair.mjs':'fe047628de9ff31f5591a1f832a6a51c873a76b7','test/bench-surface-pair.test.ts':'d836692706b14fded95a370bad703ea9ea20cea6'}
          changed = subprocess.check_output(['git','-C','source','diff','--name-only'],text=True).splitlines()
          assert sorted(changed) == sorted(files)
          receipts = []
          for name, expected in files.items():
              data = Path('source', name).read_bytes()
              assert subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip() == expected
              payload = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              result = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=payload))
              assert result['sha'] == expected
              receipts.append({'path':name,'sha':expected})
          Path(os.environ['RUNNER_TEMP'],'object-receipt','published.json').write_text(json.dumps({'blobs':receipts,'refWrites':0},indent=2))
          print(json.dumps(receipts))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface366-terminal-objects-${{ github.sha }}
          path: ${{ runner.temp }}/object-receipt
          if-no-files-found: error
          retention-days: 7
