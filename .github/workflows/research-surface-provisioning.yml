name: Surface exact provisioning repair
on:
  push:
    branches: [research/surface-provisioning-proof-yDNEKZ]
permissions:
  contents: write
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6076e9a4ec43ad49ae8245b48ba6bf24dbc10e51
          path: harness
          persist-credentials: false
      - name: Применить проверенный patch, проверить exact tree, создать только Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/delivery.json
        run: |
          set -euo pipefail
          test "$(git -C carrier hash-object .research/provisioning-repair.patch.gz)" = 848d7812f70489ef4dd097f1642bcdf1f9fe6620
          gzip -dc carrier/.research/provisioning-repair.patch.gz > "$RUNNER_TEMP/repair.patch"
          git -C harness apply --index "$RUNNER_TEMP/repair.patch"
          test "$(git -C harness write-tree)" = 3b26c1c6f51857c7a8d37b13b4ebd13d29ba911e
          cd harness
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          async function post(suffix,body) {
            const r=await fetch(`https://api.github.com/repos/Labpics-Team/lab-motion/git/${suffix}`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
            assert.equal(r.status,201,`Git object status ${r.status}`);return r.json();
          }
          const paths=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(paths,['docs/surface-benchmark.md','scripts/bench-surface-pair.mjs','test/bench-surface-pair.test.ts']);
          const tree=[];
          for(const path of paths){const blob=await post('blobs',{content:readFileSync(path,'utf8'),encoding:'utf-8'});assert.equal(blob.sha,execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim());tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const t=await post('trees',{base_tree:'53d9cf55a2b0117b0d6c2aff3cb7b54893faaa9f',tree});
          assert.equal(t.sha,'3b26c1c6f51857c7a8d37b13b4ebd13d29ba911e');
          const c=await post('commits',{message:'test(perf): синхронизировать phases toolchain и сохранять ранний отказ',tree:t.sha,parents:['6076e9a4ec43ad49ae8245b48ba6bf24dbc10e51']});
          const receipt={sha:c.sha,tree:t.sha,paths};writeFileSync(process.env.RECEIPT,JSON.stringify(receipt,null,2));console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface-provisioning-exact-delivery
          path: ${{ runner.temp }}/delivery.json
          if-no-files-found: error
          retention-days: 1
