name: R11 geometry normalized clamp
on:
  push:
    branches: [carrier/r11-geometry-normalized-clamp-20260914]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Verify and materialize normalized clamp basis
        shell: bash
        run: |
          set -euo pipefail
          cp .github/research/r11_geometry_normalized_clamp.py "$RUNNER_TEMP/normalized.py"
          git show origin/carrier/r11-geometry-basis-ssot-20260914:.github/research/r11_geometry_basis_ssot.py > "$RUNNER_TEMP/ssot.py"
          git show origin/carrier/r11-geometry-inline-state-20260914:.github/research/r11_geometry_clamp_search.test.ts > "$RUNNER_TEMP/clamp-search.test.ts"
          git switch --detach ff96d9906c221c57f1e70dc25f5ec3073e2ab9d3
          python3 "$RUNNER_TEMP/ssot.py"
          python3 "$RUNNER_TEMP/normalized.py"
          cp "$RUNNER_TEMP/clamp-search.test.ts" test/research-projection-clamp-search.test.ts
          pnpm typecheck
          pnpm vitest run test/projection-vector-retarget.test.ts test/projection-vector-clamp.test.ts test/projection-driver.test.ts test/projection-geometry.test.ts test/projection-finiteness-fuzz.test.ts test/motion-contract-v1.test.ts test/projection-api-surface-pin.test.ts test/research-projection-clamp-search.test.ts
          rm test/research-projection-clamp-search.test.ts
          pnpm build
          set +e
          node scripts/size-gate.mjs 2>&1 | tee "$RUNNER_TEMP/size.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'projection-dom-one-liner|projection-core-only|projection\s|size-gate:' "$RUNNER_TEMP/size.log" || true
          echo "SIZE_RC=$rc"
          git diff --check
          git add src/projection/geometry.ts src/projection/driver.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research: normalize bounded vector projection'
          git push --force origin HEAD:refs/heads/research/r11-geometry-normalized-clamp-20260914
          exit "$rc"
