name: R11 geometry inline vector state v3
on:
  push:
    branches: [carrier/r11-geometry-inline-state-20260914]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Materialize and measure
        env:
          HEAD_SHA: 425f027499623740b7fb0a2c8275d47ebd700cf8
        shell: bash
        run: |
          set -euo pipefail
          cp .github/research/r11_geometry_inline_state.py "$RUNNER_TEMP/materialize.py"
          git switch --detach "$HEAD_SHA"
          python3 "$RUNNER_TEMP/materialize.py"
          pnpm typecheck
          pnpm vitest run test/projection-vector-retarget.test.ts test/projection-vector-clamp.test.ts test/projection-driver.test.ts test/projection-geometry.test.ts test/motion-contract-v1.test.ts test/projection-api-surface-pin.test.ts
          pnpm build
          set +e
          node scripts/size-gate.mjs 2>&1 | tee "$RUNNER_TEMP/size.log"
          size_rc=${PIPESTATUS[0]}
          set -e
          grep -E 'projection-dom-one-liner|projection-core-only|projection/index.js|size-gate:' "$RUNNER_TEMP/size.log" || true
          echo "SIZE_RC=$size_rc"
          git diff --check
          git add src/projection/driver.ts src/projection/geometry.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research: inline projection vector state'
          git push --force origin HEAD:research/r11-geometry-inline-state-20260914
          exit "$size_rc"
