name: R11 geometry same-surface combo
on:
  push:
    branches: [carrier/r11-geometry-same-surface-combo-20260914]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable && corepack install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Compose proven reductions and measure
        shell: bash
        env:
          VARIANT: combined
        run: |
          set -euo pipefail
          git show origin/carrier/r11-geometry-shared-position-20260914:.github/research/r11_geometry_shared_position.py > "$RUNNER_TEMP/shared.py"
          git show origin/carrier/r11-projection-dom-state-20260914:.github/research/r11_projection_dom_state.py > "$RUNNER_TEMP/dom.py"
          git show origin/carrier/r11-geometry-fused-retarget-20260914:.github/research/r11_geometry_fused_retarget.py > "$RUNNER_TEMP/fused.py"
          git show origin/carrier/r11-projection-cleanup-matrix-20260914:.github/research/r11_projection_cleanup_matrix.py > "$RUNNER_TEMP/cleanup.py"
          git show origin/carrier/r11-geometry-inline-state-20260914:.github/research/r11_geometry_clamp_search.test.ts > "$RUNNER_TEMP/clamp-search.test.ts"
          git switch --detach 62d94f44c8b5207354d02a30fda7283034e7cdbe
          python3 "$RUNNER_TEMP/shared.py"
          python3 "$RUNNER_TEMP/dom.py"
          python3 "$RUNNER_TEMP/fused.py"
          python3 "$RUNNER_TEMP/cleanup.py"
          cp "$RUNNER_TEMP/clamp-search.test.ts" test/research-projection-clamp-search.test.ts
          pnpm typecheck
          pnpm vitest run test/projection-dom.test.ts test/projection-vector-retarget.test.ts test/projection-vector-clamp.test.ts test/projection-driver.test.ts test/projection-geometry.test.ts test/projection-finiteness-fuzz.test.ts test/motion-contract-v1.test.ts test/projection-api-surface-pin.test.ts test/research-projection-clamp-search.test.ts
          rm test/research-projection-clamp-search.test.ts
          pnpm build >/dev/null
          set +e
          node scripts/size-gate.mjs 2>&1 | tee "$RUNNER_TEMP/size.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -E 'projection-dom-one-liner|projection-core-only|projection\s|size-gate:' "$RUNNER_TEMP/size.log" || true
          echo "SIZE_RC=$rc"
          git diff --check
          exit "$rc"
