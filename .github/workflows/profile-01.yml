name: PROFILE-01 — проверка размерного протокола

# Размерный вектор вызывается вручную через ci.yml в той же среде, что обычный CI
# публичного репозитория. Время, GPU и энергия этой машины не доказывают свойства физического устройства.
on:
  workflow_call:
    inputs:
      prepare_only:
        description: 'Только идентичность среды до регистрации серверной эпохи; без образцов проверяемой реализации'
        type: boolean
        default: false

      server_timing:
        description: 'Явный полный запуск серверного измерителя; не метаданные и не базовые размеры'
        type: boolean
        default: false
      baseline_diagnostic:
        description: 'Трассировка только базовой версии, без квалификации'
        type: boolean
        default: false
      observer_ablation:
        description: 'Фиксированная диагностика базовой версии H0/H1 без трассировки и квалификации'
        type: boolean
        default: false
      conflicting_inputs:
        description: 'Отказ при смешении серверных измерений времени с прежними режимами'
        type: boolean
        default: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'
  PROFILE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  probe:
    if: ${{ !inputs.server_timing }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить точный источник измерителя
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Настроить Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.prepare_only && '24.19.0' || '24' }}

      - name: Активировать закреплённый pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Проверить точную версию протокола
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROFILE_SOURCE_SHA"
          node --input-type=module <<'NODE'
          import { PROFILE_01, preregistrationDigest, verifyPreregistration } from './bench/profile/profile-01-preregistration.mjs';
          verifyPreregistration(PROFILE_01);
          if (PROFILE_01.candidateSamplesObservedAtRegistration !== false) {
            throw new Error('preregistration обязана предшествовать samples');
          }
          console.log(`preregistration digest: ${preregistrationDigest(PROFILE_01)}`);
          NODE

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Подготовить закреплённый браузер без samples
        if: ${{ inputs.prepare_only }}
        run: |
          pnpm --dir bench/compare install --frozen-lockfile
          pnpm --dir bench/compare exec playwright install --with-deps chromium

      - name: Сохранить фактическую hosted identity до выбора нового epoch
        if: ${{ inputs.prepare_only }}
        shell: bash
        run: |
          set -euo pipefail
          CPU=$(awk '/^Cpus_allowed_list:/ { split($2, parts, /[,-]/); print parts[1] }' /proc/self/status)
          test -n "$CPU"
          taskset -c "$CPU" node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { readFileSync } from 'node:fs';
          import { join, dirname } from 'node:path';
          import { arch, platform, release } from 'node:os';
          import { captureServerMachine, captureServerClockBuildEvidence, createServerJournal } from './bench/profile/server-profile-runner.mjs';
          import { prepareServerThreadCpuClock } from './bench/profile/server-thread-cpu-clock.mjs';
          import { SERVER_PROFILE, serverProfileDigest } from './bench/profile/server-profile-registration.mjs';
          import { hashFileTree, sha256File } from './bench/compare/provenance.mjs';
          const out = join(process.env.RUNNER_TEMP, 'server-profile-preparation');
          const journal = createServerJournal(out);
          const receipt = { schema: 1, scope: 'только метаданные, без образцов проверяемой реализации; не квалификация часов и не результат PASS проверки производительности',
            source: process.env.PROFILE_SOURCE_SHA, protocolDigest: serverProfileDigest(SERVER_PROFILE),
            hosted: { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
              imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion },
            observed: { platform: platform(), arch: arch(), kernelRelease: release() }, failures: [] };
          // Все чтения выполняются до подготовки нативного модуля и браузера, вне измерений времени.
          let browser;
          try {
            try {
              receipt.machine = captureServerMachine();
              receipt.clockBuildEvidence = receipt.machine.identity.clockBuildEvidence;
            }
            catch (error) {
              if (error.raw?.machine) receipt.machine = error.raw.machine;
              receipt.clockBuildEvidence = error.raw?.clockBuildEvidence ?? captureServerClockBuildEvidence();
              const topology = {};
              for (const file of ['/proc/self/cgroup', '/proc/self/mountinfo', '/sys/fs/cgroup/cgroup.controllers',
                '/sys/fs/cgroup/cgroup.subtree_control', '/sys/fs/cgroup/cpu.stat']) {
                try { topology[file] = { text: readFileSync(file, 'utf8') }; }
                catch (readError) { topology[file] = { error: { code: readError.code, message: readError.message } }; }
              }
              receipt.failures.push({ boundary: 'machine-resource-prerequisite', message: error.message,
                raw: error.raw ?? null, topology });
            }
            const clock = prepareServerThreadCpuClock({ directory: out });
            receipt.engineClock = clock.metadata;
            const requireBench = createRequire(join(process.cwd(), 'bench/compare/package.json'));
            const browserType = requireBench('playwright').chromium;
            const executable = browserType.executablePath();
            receipt.browser = { name: 'chromium', executableSha256: sha256File(executable),
              tree: { directory: dirname(executable), ...hashFileTree(dirname(executable)) } };
            browser = await browserType.launch({ headless: SERVER_PROFILE.headless, executablePath: executable });
            receipt.browser.version = browser.version();
            clock.assertUnchanged();
          } catch (error) {
            receipt.failures.push({ boundary: 'identity-preparation', message: error.message, raw: error.raw ?? null });
          } finally {
            try { await browser?.close(); }
            catch (error) { receipt.failures.push({ boundary: 'browser-cleanup', message: error.message }); }
          }
          const digest = serverProfileDigest(receipt);
          journal('hosted-identity-before-epoch-and-samples', { receipt, digest });
          console.log(`HOSTED_PROFILE_PREPARATION ${JSON.stringify({ receipt, digest })}`);
          process.exitCode = receipt.failures.length ? 1 : 0;
          NODE

      - name: Измерить прежний размерный вектор
        if: ${{ !inputs.prepare_only }}
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profile-01-raw"
          node bench/profile/probe-profile-01.mjs \
            --mode old-vector \
            --cells all \
            --out "$RUNNER_TEMP/profile-01-raw"

      - name: Независимо перепроверить raw-артефакт
        if: ${{ !cancelled() && steps.probe.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          for raw in "$RUNNER_TEMP"/profile-01-raw/*.json; do
            test -f "$raw"
            node bench/profile/validate-profile-01.mjs --raw "$raw"
          done

      - name: Проверить отказ внешнего validator на подменах настоящего результата
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, readdirSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const rawDirectory = join(process.env.RUNNER_TEMP, 'profile-01-raw');
          const files = readdirSync(rawDirectory).filter(name => name.endsWith('.json'));
          assert.equal(files.length, 1);
          const original = JSON.parse(readFileSync(join(rawDirectory, files[0]), 'utf8'));
          const directory = mkdtempSync(join(tmpdir(), 'profile-replay-mutations-'));
          try {
            const cases = [
              ['число', value => { value.costVector.scenarios[0].gzBytes += 1; }, 'scenarios не воспроизводится'],
              ['identity', value => { value.head = '0'.repeat(40); }, 'baseProof не покрывает'],
              ['клетки', value => { value.cellsUnproven = []; }, 'неизмеренные клетки потеряны'],
            ];
            for (const [name, mutate, rejection] of cases) {
              const value = structuredClone(original);
              mutate(value);
              const path = join(directory, 'mutated.json');
              writeFileSync(path, JSON.stringify(value));
              const run = spawnSync(process.execPath, ['bench/profile/validate-profile-01.mjs', '--raw', path],
                { encoding: 'utf8', timeout: 180_000, maxBuffer: 8 * 1024 * 1024 });
              assert.equal(run.status, 1, `${name}: ${run.error ?? run.stderr}`);
              assert.ok(run.stderr.includes(rejection), `${name}: неверная причина отказа: ${run.stderr}`);
              console.log(`${name}: ожидаемый предметный отказ подтверждён`);
            }
          } finally {
            rmSync(directory, { recursive: true, force: true });
          }
          NODE


  server:
    if: ${{ inputs.server_timing }}
    runs-on: ubuntu-latest
    # 6 h — предел бесплатного hosted job, не гарантия полного maxRuns.
    # TERM после 250 min сохраняет UNPROVEN через существующий runner; остаток
    # бюджета оставлен на preparation, replay и export. Hard kill может прервать export.
    timeout-minutes: 360
    steps:
      - name: Создать attempt receipts до setup и отказа
        id: receipt_init
        timeout-minutes: 1
        env:
          EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          CONFLICTING_INPUTS: ${{ inputs.conflicting_inputs || inputs.prepare_only }}
        run: |
          set -euo pipefail
          SERVER_OUT="$RUNNER_TEMP/server-profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SERVER_RECEIPTS="$RUNNER_TEMP/server-profile-receipts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'SERVER_OUT=%s\nSERVER_RECEIPTS=%s\n' "$SERVER_OUT" "$SERVER_RECEIPTS" >> "$GITHUB_ENV"
          mkdir "$SERVER_RECEIPTS"
          printf 'run_id=%s\nattempt=%s\ncandidate_requested=%s\nconflicting_inputs=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_CANDIDATE" "$CONFLICTING_INPUTS" \
            > "$SERVER_RECEIPTS/attempt.txt"

      - name: Отклонить смешанные режимы до подготовки и samples
        timeout-minutes: 1
        env:
          CONFLICTING_INPUTS: ${{ inputs.conflicting_inputs || inputs.prepare_only }}
        run: |
          set -euo pipefail
          test "$CONFLICTING_INPUTS" = false

      - name: Получить точный совмещённый кандидат
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: server-candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Настроить зарегистрированный Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24.19.0'

      - name: Прочитать baseline только из владельца протокола
        id: registration
        timeout-minutes: 1
        working-directory: server-candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROFILE_SOURCE_SHA"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { SERVER_PROFILE } from './bench/profile/server-profile-registration.mjs';
          if (!/^[a-f0-9]{40}$/.test(SERVER_PROFILE.baselineRevision)) throw new Error('invalid registered baseline');
          appendFileSync(process.env.GITHUB_OUTPUT, `baseline=${SERVER_PROFILE.baselineRevision}\n`);
          NODE

      - name: Получить точный зарегистрированный baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: ${{ steps.registration.outputs.baseline }}
          path: server-baseline
          persist-credentials: false
          fetch-depth: 0

      - name: Активировать закреплённый pnpm для обоих участников
        timeout-minutes: 5
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Установить locked зависимости кандидата
        timeout-minutes: 10
        working-directory: server-candidate
        run: pnpm install --frozen-lockfile

      - name: Установить locked зависимости baseline
        timeout-minutes: 10
        working-directory: server-baseline
        run: pnpm install --frozen-lockfile

      - name: Установить locked зависимости измерителя и Chromium
        timeout-minutes: 15
        working-directory: server-candidate
        run: |
          pnpm --dir bench/compare install --frozen-lockfile
          pnpm --dir bench/compare exec playwright install --with-deps chromium

      - name: Связать run attempt источники и протокол вне raw
        id: binding
        timeout-minutes: 1
        working-directory: server-candidate
        run: |
          set -euo pipefail
          test ! -e "$SERVER_OUT"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { resolve, join } from 'node:path';
          import { SERVER_PROFILE, serverProfileDigest } from './bench/profile/server-profile-registration.mjs';
          const source = (root) => ({ sha: execFileSync('git', ['rev-parse', 'HEAD'], { cwd: root, encoding: 'utf8' }).trim(),
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { cwd: root, encoding: 'utf8' }).trim() });
          const baseline = source(resolve('../server-baseline')), candidate = source(process.cwd());
          if (baseline.sha !== SERVER_PROFILE.baselineRevision || candidate.sha !== process.env.PROFILE_SOURCE_SHA) throw new Error('source binding mismatch');
          const receipt = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            baseline, candidate, protocolDigest: serverProfileDigest(SERVER_PROFILE), out: process.env.SERVER_OUT };
          writeFileSync(join(process.env.SERVER_RECEIPTS, 'source.json'), JSON.stringify(receipt), { flag: 'wx' });
          console.log(JSON.stringify(receipt));
          NODE

      - name: Исполнить существующий server runner на actual allowed CPU
        id: timing
        timeout-minutes: 254
        working-directory: server-candidate
        env:
          BASELINE_DIAGNOSTIC: ${{ inputs.baseline_diagnostic }}
          PROFILE_OBSERVER_ABLATION: ${{ inputs.observer_ablation }}
        run: |
          set -euo pipefail
          CPU=$(awk '/^Cpus_allowed_list:/ { split($2, parts, /[,-]/); print parts[1] }' /proc/self/status)
          test -n "$CPU"
          printf '%s\n' "$CPU" > "$SERVER_RECEIPTS/cpu.txt"
          ENTRY=bench/profile/server-profile-runner.mjs
          BUDGET=250m
          if test "$BASELINE_DIAGNOSTIC" = true || test "$PROFILE_OBSERVER_ABLATION" = true; then
            ENTRY=bench/profile/server-profile-diagnostic.mjs
            BUDGET=20m
          fi
          printf 'diagnostic=%s\nobserver_ablation=%s\nentry=%s\n' "$BASELINE_DIAGNOSTIC" "$PROFILE_OBSERVER_ABLATION" "$ENTRY" > "$SERVER_RECEIPTS/mode.txt"
          set +e
          timeout --signal=TERM --kill-after=90s "$BUDGET" taskset -c "$CPU" \
            node "$ENTRY" \
            --baseline "$GITHUB_WORKSPACE/server-baseline" \
            --candidate "$GITHUB_WORKSPACE/server-candidate" \
            --browser chromium --out "$SERVER_OUT" \
            > "$SERVER_RECEIPTS/runner.stdout" 2> "$SERVER_RECEIPTS/runner.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$SERVER_RECEIPTS/runner-exit.txt"
          tail -n 30 "$SERVER_RECEIPTS/runner.stdout"
          tail -n 30 "$SERVER_RECEIPTS/runner.stderr"
          exit "$status"

      - name: Независимо связать digest journal и перепроверить полный raw
        if: ${{ always() && steps.timing.outcome != 'skipped' }}
        timeout-minutes: 10
        working-directory: server-candidate
        run: |
          set -euo pipefail
          for name in server-profile.sha256 journal.ndjson; do
            if test -f "$SERVER_OUT/$name"; then cp "$SERVER_OUT/$name" "$SERVER_RECEIPTS/$name"; fi
          done
          test -s "$SERVER_OUT/server-profile.json"
          test -s "$SERVER_OUT/server-profile.sha256"
          test -s "$SERVER_OUT/journal.ndjson"
          DIGEST=$(awk '{print $1}' "$SERVER_RECEIPTS/server-profile.sha256")
          printf 'SERVER_RAW_DIGEST %s\n' "$DIGEST"
          node bench/profile/server-profile-artifact.mjs \
            --raw "$SERVER_OUT/server-profile.json" --digest "$DIGEST" \
            --journal "$SERVER_RECEIPTS/journal.ndjson" \
            > "$SERVER_RECEIPTS/replay.stdout" 2> "$SERVER_RECEIPTS/replay.stderr"
          tail -n 30 "$SERVER_RECEIPTS/replay.stdout"

      - name: Экспортировать весь raw включая partial failures
        if: ${{ always() && steps.timing.outcome != 'skipped' }}
        id: raw_export
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-profile-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SERVER_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

      - name: Сохранить отдельный raw archive receipt
        if: ${{ always() && steps.receipt_init.outcome == 'success' }}
        timeout-minutes: 1
        env:
          RAW_ID: ${{ steps.raw_export.outputs.artifact-id }}
          RAW_DIGEST: ${{ steps.raw_export.outputs.artifact-digest }}
          RAW_OUTCOME: ${{ steps.raw_export.outcome }}
          TIMING_OUTCOME: ${{ steps.timing.outcome }}
        run: |
          printf 'raw_id=%s\nraw_archive_digest=%s\nraw_outcome=%s\ntiming_outcome=%s\n' \
            "$RAW_ID" "$RAW_DIGEST" "$RAW_OUTCOME" "$TIMING_OUTCOME" > "$SERVER_RECEIPTS/raw-export.txt"

      - name: Экспортировать независимые source digest journal receipts
        if: ${{ always() && steps.receipt_init.outcome == 'success' }}
        id: receipt_export
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-profile-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SERVER_RECEIPTS }}
          if-no-files-found: error
          retention-days: 5

      - name: Проверить фактические export receipts
        timeout-minutes: 1
        if: ${{ always() && steps.receipt_init.outcome == 'success' }}
        env:
          RAW_ID: ${{ steps.raw_export.outputs.artifact-id }}
          RAW_DIGEST: ${{ steps.raw_export.outputs.artifact-digest }}
          RECEIPT_ID: ${{ steps.receipt_export.outputs.artifact-id }}
          RECEIPT_DIGEST: ${{ steps.receipt_export.outputs.artifact-digest }}
          TIMING_OUTCOME: ${{ steps.timing.outcome }}
          RAW_OUTCOME: ${{ steps.raw_export.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt_export.outcome }}
        run: |
          set -euo pipefail
          test "$RECEIPT_OUTCOME" = success
          test -n "$RECEIPT_ID"
          test -n "$RECEIPT_DIGEST"
          if test "$TIMING_OUTCOME" != skipped; then
            test "$RAW_OUTCOME" = success
            test -n "$RAW_ID"
            test -n "$RAW_DIGEST"
          fi
          printf 'SERVER_EXPORT raw=%s digest=%s receipts=%s\n' "$RAW_ID" "$RAW_DIGEST" "$RECEIPT_ID"
