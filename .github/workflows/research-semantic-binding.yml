name: Semantic binding source receipt
on:
  push:
    branches: [research/semantic-binding-delivery-20260913]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4dbd72b82782756e7fee97e1ebb7d01a685a67ca
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source without executing product code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4dbd72b82782756e7fee97e1ebb7d01a685a67ca
          test "$(git rev-parse HEAD^{tree})" = 13d75e1e9c9a834cad6449469832410bd8ba115a
          mkdir "$RUNNER_TEMP/binding-source"
          git bundle create "$RUNNER_TEMP/binding-source/source.bundle" HEAD --tags
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/binding-source/revision.txt"
          cd "$RUNNER_TEMP/binding-source"
          sha256sum source.bundle revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-binding-source-4dbd72b
          path: ${{ runner.temp }}/binding-source/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: false
