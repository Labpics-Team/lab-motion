name: Semantic binding source readback
on:
  push:
    branches: [research/semantic-binding-delivery-20260913]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 38742c875c013c42cd10d1119702f971067e7d14
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 38742c875c013c42cd10d1119702f971067e7d14
          test "$(git rev-parse HEAD^{tree})" = 2874ed1c7ce3c100e1d3b3f14000e37d09594097
          mkdir "$RUNNER_TEMP/binding-source"
          git bundle create "$RUNNER_TEMP/binding-source/source.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/binding-source/revision.txt"
          cd "$RUNNER_TEMP/binding-source"
          sha256sum source.bundle revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binding-source-38742c8
          path: ${{ runner.temp }}/binding-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: false
