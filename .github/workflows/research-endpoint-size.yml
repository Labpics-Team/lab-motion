name: Research endpoint-elision size falsifier

on:
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  size-falsifier:
    if: github.head_ref == 'research/omit-linear-endpoint-positions-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Canonical protected size gate
        run: pnpm size
