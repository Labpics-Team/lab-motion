# Standard dependencies only; vendored sources and compatibility fixtures keep their product contracts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    # This alias verifies the supported TypeScript 5 compatibility floor.
    ignore:
      - dependency-name: typescript5
      # Local-search focus is qualified with an exact-version VitePress patch.
      # Requalify dismissal and navigation together; security updates remain eligible.
      - dependency-name: vitepress
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
